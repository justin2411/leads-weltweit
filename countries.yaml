# Welche Länder dürfen per E-Mail angeschrieben werden?
#
# Nur Länder mit allowed: true dürfen Kaltmails bekommen (CLAUDE.md, Abschnitt 2).
# Alles, was hier fehlt, gilt als NICHT erlaubt.
#
# Felder:
#   allowed            E-Mail-Versand grundsätzlich erlaubt
#   language           Sprache der Mails
#   generic_only       nur allgemeine Firmenadressen (info@, hello@, office@ ...), keine Personenadressen
#   company_forms_only nur Kapitalgesellschaften anschreiben (keine Einzelunternehmer/Personengesellschaften)
#   daily_limit        maximale Mails pro Tag in dieses Land (erhöht auf Wunsch des Inhabers 26.09.2026: Ziel 100/Tag)
#   postal_footer      Pflichtfußzeile mit Postanschrift (CAN-SPAM u. a.)
#   notes              Kurzbegründung. Nicht als Rechtsberatung verstehen; offene Punkte stehen unter "open_question".

defaults:
  daily_limit: 20
  postal_footer: true

countries:
  US:
    allowed: true
    language: en
    generic_only: false
    company_forms_only: false
    daily_limit: 110
    notes: "CAN-SPAM: Opt-out-Modell. Pflicht: korrekter Absender, nicht irreführender Betreff, Postanschrift, funktionierende Abmeldung (Umsetzung binnen 10 Werktagen)."
  UK:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 100
    notes: "PECR: B2B-Mails an 'corporate subscribers' (Ltd, LLP, PLC) ohne Einwilligung zulässig; Einzelunternehmer und Personengesellschaften brauchen Einwilligung. Inhaber 04.10.2026: Einzelunternehmer nein (PECR: sole trader = individual)."
    open_question: "Reicht bei Ltd-Firmen eine allgemeine Adresse aus, oder ist eine Interessenabwägung nach UK GDPR zu dokumentieren? Vom Inhaber bestätigen lassen."
  IE:
    allowed: false
    never: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 30
    notes: "Inhaber 04.10.2026: Risiko sehr hoch (Straftat pro Mail) → nie. S.I. 336/2011: B2B-Direktmarketing per Mail an Unternehmen mit Opt-out zulässig; Einzelpersonen brauchen Einwilligung."
  NL:
    allowed: false
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 30
    notes: "Inhaber 04.10.2026 (Rechts-Tabelle nach Anwaltsberatung): keine Kaltmails – weder Einzelunternehmer noch B.V./N.V. ohne Einwilligung (Telecommunicatiewet 11.7, ACM-Bußgeld). Nur Anrufliste/Brief."
  SE:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 20
    notes: "Marknadsföringslagen: Einwilligungspflicht nur für natürliche Personen; juristische Personen (AB) Opt-out."
  BE:
    allowed: false
    never: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 15
    notes: "Inhaber 04.10.2026: Risiko mittel bis hoch → nie. KB 04.04.2003: Ausnahme für juristische Personen bei unpersönlichen Adressen (info@ ...)."
    open_question: "Sprache: Englisch oder Französisch/Niederländisch je Region? Vor Start klären."
  FR:
    allowed: true
    language: fr
    generic_only: false
    company_forms_only: false
    daily_limit: 60
    notes: "CNIL: B2B-Mails ohne Einwilligung zulässig, wenn der Inhalt zum Beruf der Person passt; Opt-out Pflicht. Inhaber 04.10.2026 nach Anwaltsberatung: Einzelunternehmer erlaubt (CNIL: berufsbezogene B2B-Mail an Berufsadresse, Opt-out); Verantwortung Inhaber. Einzelunternehmer bekommen keine automatische Nachfassmail, nur nach eigener Antwort."

  # Niemals Kaltmails. Nur Anruflisten und Briefe (S8).
  DE: { allowed: false, language: de, notes: "UWG § 7: keine Kaltmails. Nur Anrufliste/Brief." }
  AT: { allowed: false, language: de, notes: "TKG § 174: keine Kaltmails." }
  CH: { allowed: false, language: de, notes: "UWG Art. 3 lit. o: keine Kaltmails." }
  IT: { allowed: false, language: it, notes: "Keine Kaltmails." }
  ES: { allowed: false, language: es, notes: "Keine Kaltmails." }
  PL: { allowed: false, language: pl, notes: "Keine Kaltmails." }
  DK: { allowed: false, language: da, notes: "Keine Kaltmails." }
  ZA: { allowed: false, language: en, notes: "Inhaber-Tabelle 04.10.2026: keine Kaltmails (weder Einzelunternehmer noch Firmen)." }

  # Neue Mail-Länder (Inhaber 04.10.2026: „nimm also auch andere länder mit auf die passend sind“; Rechts-Tabelle
  # docs/KALTMAIL-RECHT.md: Ja/eher ja, Risiko gering bzw. gering bis mittel). Freigeschaltet vom Quellen-Scout nach
  # den zwei Tests (CLAUDE.md „Scout entscheidet allein“, Ergebnis in docs/QUELLEN-SCOUT.md, 04.10.2026):
  # (1) ≥ 10 grüne S2-Leads (Overture, Firmen ohne Website) und mail-fähige Käufer im Land, (2) Bedingung der Tabelle
  # technisch umgesetzt. Vorsichtig: generic_only, kleines daily_limit; Versand erst über den normalen Versandlauf.
  FI:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 15
    notes: "Inhaber-Tabelle 04.10.2026: Firmen ja (Opt-out), Einzelunternehmer nein, Risiko gering bis mittel. Tietoyhteiskuntakaari (917/2014) § 200/§ 202: Direktwerbung per E-Mail an juristische Personen ohne vorherige Einwilligung zulässig, solange nicht widersprochen wurde; Pflicht: Absender erkennbar, einfache kostenlose Abmeldung. Umsetzung: nur Oy/Oyj/Ab (company_forms_only), nur allgemeine Adressen, Abmeldelink + Postanschrift in der Fußzeile."
  SG:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: false
    daily_limit: 15
    subject_prefix: "<ADV> "
    notes: "Inhaber-Tabelle 04.10.2026: ja (beide), Risiko gering. Spam Control Act 2007 (Cap. 311A) Second Schedule: unaufgeforderte kommerzielle E-Mails zulässig mit „<ADV>“ und Leerzeichen am Betreffanfang, korrektem Absender/Kopfzeilen, Kontaktangabe und funktionierender Abmeldung (Umsetzung binnen 10 Werktagen). Umsetzung: subject_prefix (drafts.subject_for, Versandprüfung outreach.send), Fußzeile mit Postanschrift und Abmeldelink. PDPA: Geschäftskontaktdaten (business contact information) ausgenommen."
  HK:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: false
    daily_limit: 15
    notes: "Inhaber-Tabelle 04.10.2026: ja (beide), Risiko gering. Unsolicited Electronic Messages Ordinance (Cap. 593) §§ 8, 9: Opt-out-Modell; Pflicht: klare Absenderangabe mit Kontaktmöglichkeit, Abmeldemöglichkeit mit Hinweis, Abmeldung binnen 10 Werktagen umsetzen, keine Adressen aus dem Do-not-call-Register (gilt nur für Telefon/Fax/SMS). Umsetzung: Fußzeile mit Rechtsträger, Postanschrift und Abmeldelink, Abmeldehinweis zusätzlich auf Chinesisch (lib/rules.UNSUBSCRIBE_EXTRA)."
  BR:
    allowed: true
    language: pt
    generic_only: true
    company_forms_only: false
    daily_limit: 15
    notes: "Inhaber-Tabelle 04.10.2026: eher ja (beide), Risiko gering bis mittel. Kein Spezialgesetz für E-Mail-Werbung; LGPD (Lei 13.709/2018) Art. 7 IX: berechtigtes Interesse. Dokumentierte Interessenabwägung (Art. 10): Zweck = einmaliges B2B-Angebot an Webagenturen über ihre selbst veröffentlichte allgemeine Firmenadresse (contato@, comercial@ …), Inhalt passt zum Geschäft des Empfängers, keine sensiblen Daten, nur Firmendaten, Herkunft (eigene Website/öffentlicher Firmeneintrag) gespeichert in prospects.source_url, Widerspruch jederzeit per Link/Antwort, Sperre dauerhaft. CDC/Selbstregulierung (CAPEM): Opt-out, Absender und Betreff klar. Mail auf Portugiesisch."
  MX:
    allowed: true
    language: es
    generic_only: true
    company_forms_only: false
    daily_limit: 15
    notes: "Inhaber-Tabelle 04.10.2026: eher ja (beide), Risiko gering. Ley Federal de Protección al Consumidor Art. 76 bis / 16–18 und LFPDPPP: Werbung ohne Einwilligung zulässig, Pflicht: Absender mit Name und Anschrift, Widerspruch (Opt-out) jederzeit möglich und beachten; Register REPEP (Profeco) betrifft Telefon/Verbraucher. Umsetzung: Fußzeile mit Rechtsträger, Postanschrift und Abmeldelink, nur allgemeine Firmenadressen (contacto@, ventas@ …). Mail auf Spanisch."
  # Übrige Länder der Rechts-Tabelle: allowed false. „Bedingt“ (NZ, JP) nicht freischalten (Inhaber 04.10.2026);
  # Inhaber 04.10.2026: „bei sehr hoch oder hoch machen wir bitte nie etwas“ – never: true = nie freischalten.
  AU: { allowed: false, never: true, language: en, notes: "Tabelle: bedingt – nur an öffentlich (berufsbezogen) veröffentlichte Adressen ohne Werbeverbot; Spam Act, ACMA aktiv, hohes Risiko." }
  NZ: { allowed: false, language: en, notes: "Tabelle: bedingt wie AU (veröffentlichte Adresse, berufsbezogen)." }
  CA: { allowed: false, never: true, language: en, notes: "Tabelle: bedingt wie AU (CASL: veröffentlichte Adresse, kein Hinweis gegen Werbung, berufsbezogen; sauber dokumentieren). Sehr hohes Risiko (bis 10 Mio. CAD)." }
  JP: { allowed: false, language: ja, notes: "Tabelle: bedingt – nur geschäftlich veröffentlichte Adressen." }
  IL: { allowed: false, never: true, language: en, notes: "Tabelle: nur eine einmalige Anfrage, ob Werbung gewünscht ist – keine Kaltmail mit Angebot. Hohes Risiko (Pauschalschadensersatz pro Mail)." }

# Allgemeine Postfächer, die bei generic_only erlaubt sind (lokaler Teil vor dem @).
generic_local_parts:
  - info
  - hello
  - hi
  - contact
  - contactus
  - enquiries
  - enquiry
  - inquiries
  - office
  - mail
  - admin
  - team
  - sales
  - business
  - general
  - reception
  - studio
  - bonjour
  - accueil
  # Neue Länder (04.10.2026): allgemeine Postfächer auf Portugiesisch (BR), Spanisch (MX), Finnisch (FI)
  - contato
  - atendimento
  - comercial
  - contacto
  - ventas
  - hola
  - myynti
  - toimisto
