# Welche Länder dürfen per E-Mail angeschrieben werden?
#
# Nur Länder mit allowed: true dürfen Kaltmails bekommen (CLAUDE.md, Abschnitt 2).
# Alles, was hier fehlt, gilt als NICHT erlaubt.
#
# Felder:
#   allowed            E-Mail-Versand grundsätzlich erlaubt
#   language           Sprache der Mails
#   generic_only       nur allgemeine Firmenadressen (info@, hello@, office@ ...), keine Personenadressen
#   company_forms_only nur Kapitalgesellschaften anschreiben (keine Einzelunternehmer/Personengesellschaften)
#   daily_limit        maximale Mails pro Tag in dieses Land (erhöht auf Wunsch des Inhabers 26.09.2026: Ziel 100/Tag)
#   postal_footer      Pflichtfußzeile mit Postanschrift (CAN-SPAM u. a.)
#   notes              Kurzbegründung. Nicht als Rechtsberatung verstehen; offene Punkte stehen unter "open_question".

defaults:
  daily_limit: 20
  postal_footer: true

countries:
  US:
    allowed: true
    language: en
    generic_only: false
    company_forms_only: false
    daily_limit: 110
    notes: "CAN-SPAM: Opt-out-Modell. Pflicht: korrekter Absender, nicht irreführender Betreff, Postanschrift, funktionierende Abmeldung (Umsetzung binnen 10 Werktagen)."
  UK:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 100
    notes: "PECR: B2B-Mails an 'corporate subscribers' (Ltd, LLP, PLC) ohne Einwilligung zulässig; Einzelunternehmer und Personengesellschaften brauchen Einwilligung."
    open_question: "Reicht bei Ltd-Firmen eine allgemeine Adresse aus, oder ist eine Interessenabwägung nach UK GDPR zu dokumentieren? Vom Inhaber bestätigen lassen."
  IE:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 30
    notes: "S.I. 336/2011: B2B-Direktmarketing per Mail an Unternehmen mit Opt-out zulässig; Einzelpersonen brauchen Einwilligung."
  NL:
    allowed: false
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 30
    notes: "Inhaber 04.10.2026 (Rechts-Tabelle nach Anwaltsberatung): keine Kaltmails – weder Einzelunternehmer noch B.V./N.V. ohne Einwilligung (Telecommunicatiewet 11.7, ACM-Bußgeld). Nur Anrufliste/Brief."
  SE:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 20
    notes: "Marknadsföringslagen: Einwilligungspflicht nur für natürliche Personen; juristische Personen (AB) Opt-out."
  BE:
    allowed: true
    language: en
    generic_only: true
    company_forms_only: true
    daily_limit: 15
    notes: "KB 04.04.2003: Ausnahme für juristische Personen bei unpersönlichen Adressen (info@ ...)."
    open_question: "Sprache: Englisch oder Französisch/Niederländisch je Region? Vor Start klären."
  FR:
    allowed: true
    language: fr
    generic_only: false
    company_forms_only: true
    daily_limit: 60
    notes: "CNIL: B2B-Mails ohne Einwilligung zulässig, wenn der Inhalt zum Beruf der Person passt; Opt-out Pflicht."

  # Niemals Kaltmails. Nur Anruflisten und Briefe (S8).
  DE: { allowed: false, language: de, notes: "UWG § 7: keine Kaltmails. Nur Anrufliste/Brief." }
  AT: { allowed: false, language: de, notes: "TKG § 174: keine Kaltmails." }
  CH: { allowed: false, language: de, notes: "UWG Art. 3 lit. o: keine Kaltmails." }
  IT: { allowed: false, language: it, notes: "Keine Kaltmails." }
  ES: { allowed: false, language: es, notes: "Keine Kaltmails." }
  PL: { allowed: false, language: pl, notes: "Keine Kaltmails." }
  DK: { allowed: false, language: da, notes: "Keine Kaltmails." }
  ZA: { allowed: false, language: en, notes: "Inhaber-Tabelle 04.10.2026: keine Kaltmails (weder Einzelunternehmer noch Firmen)." }

  # Noch nicht bearbeitete Länder aus der Rechts-Tabelle des Inhabers (04.10.2026, docs/KALTMAIL-RECHT.md).
  # allowed bleibt false, bis der Quellen-Scout die zwei Tests (≥ 10 grüne Leads + Käufer im Land, Rechtsgrundlage)
  # bestanden hat; nur Länder mit „Ja“ dürfen danach freigeschaltet werden, „bedingt“ nur mit dokumentierter Bedingung.
  FI: { allowed: false, language: en, company_forms_only: true, notes: "Tabelle: Firmen ja (Opt-out), Einzelunternehmer nein." }
  SG: { allowed: false, language: en, notes: "Tabelle: ja (beide). Bedingung: „<ADV>“ am Betreffanfang, Opt-out." }
  HK: { allowed: false, language: en, notes: "Tabelle: ja (beide). Bedingung: Absenderangabe, Opt-out." }
  BR: { allowed: false, language: pt, notes: "Tabelle: eher ja (beide). Bedingung: berechtigtes Interesse dokumentieren (LGPD), Opt-out." }
  MX: { allowed: false, language: es, notes: "Tabelle: eher ja (beide). Bedingung: Opt-out, Absenderangaben." }
  AU: { allowed: false, language: en, notes: "Tabelle: bedingt – nur an öffentlich (berufsbezogen) veröffentlichte Adressen ohne Werbeverbot; Spam Act, ACMA aktiv, hohes Risiko." }
  NZ: { allowed: false, language: en, notes: "Tabelle: bedingt wie AU (veröffentlichte Adresse, berufsbezogen)." }
  CA: { allowed: false, language: en, notes: "Tabelle: bedingt wie AU (CASL: veröffentlichte Adresse, kein Hinweis gegen Werbung, berufsbezogen; sauber dokumentieren). Sehr hohes Risiko (bis 10 Mio. CAD)." }
  JP: { allowed: false, language: ja, notes: "Tabelle: bedingt – nur geschäftlich veröffentlichte Adressen." }
  IL: { allowed: false, language: en, notes: "Tabelle: nur eine einmalige Anfrage, ob Werbung gewünscht ist – keine Kaltmail mit Angebot. Hohes Risiko (Pauschalschadensersatz pro Mail)." }

# Allgemeine Postfächer, die bei generic_only erlaubt sind (lokaler Teil vor dem @).
generic_local_parts:
  - info
  - hello
  - hi
  - contact
  - contactus
  - enquiries
  - enquiry
  - inquiries
  - office
  - mail
  - admin
  - team
  - sales
  - business
  - general
  - reception
  - studio
  - bonjour
  - accueil
