# Proben-Vorrat (Inhaber 03.10.2026: „es sollen proben in der hinterhand sein ca. 50 proben immer die bereits fertig
# und geprüft sind und wirklich durch alle sicherheitsmechanismen und qualitätsprüfer gegangen sind“).
# scripts/sample_stock.py hält je öffentlich live geschalteter Landingpage (Zielgruppe/Land) so viele fertige Proben
# bereit; die Fokus-Tests aus config/fokus.yaml bekommen mehr. 3 Fokus-Seiten x 6 (je Wunsch des Formulars eine) + 12 weitere x 3 = 54.
fokus_je_seite: 6
andere_je_seite: 3
# Signale altern: Proben, die älter sind, werden verworfen, ihre Leads wieder freigegeben und neu gebaut.
max_alter_stunden: 48
# Höchstdauer eines Bau-Laufs in Minuten (der Rest folgt im nächsten Lauf).
laufzeit_minuten: 40
# Premium-Proben (Inhaber 05.10.2026: „bei proben vorrat möchte ich auch premium leads proben vorrat nehmen können“):
# davon so viele Proben je Seite, in denen alle 10 Leads Premium sind (Standard je Land, im Regler einstellbar).
# Klein gehalten, damit freie Premium-Leads für Lieferungen und den Mail-Test „Beleg-Einstieg“ bleiben
# (frei 05.10.: US ~2.700, UK ~320, FR ~140). Andere Länder 0.
premium_us: 10
premium_uk: 2
premium_fr: 1
premium_andere: 0
# Reserve freier Premium-Leads je Seite, die der Premium-Austausch (normale Probe -> Premium-Probe) nie verbraucht
# (Premium-Labor 05.10.2026: Austausch zog 60 von 119 freien S2/FR-Premium-Leads bei 0 abgerufenen Vorrat-Proben in 7 T).
premium_reserve_leads: 80
