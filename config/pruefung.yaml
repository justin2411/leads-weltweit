# Dauerprüfung (Inhaber 04.10.2026: „Qualitätsagenten bitte mehrere, auch die die Kunden-Leads immer nochmal dauerhaft
# überprüfen – je länger die liegen, desto bessere Qualität, weil sie so oft geprüft wurden. Effizient, nicht extrem
# viele unnötige Tokens, aber immer wieder prüfen.“)
# scripts/dauerpruefung.py / .github/workflows/dauerpruefung.yml: reines Python, keine Tokens. Jeder Lead läuft durch
# dieselbe Drei-Stufen-Freigabe (scripts/lib/release_gate.py, nie gelockert); bestandene Prüfungen erhöhen
# qualitaet_score und den Abstand bis zur nächsten Prüfung. Durchgefallen = held + Grund in lead_checks (nichts gelöscht).

leads:
  budget_je_lauf: 200            # Leads je stündlichem Lauf (fällige Nachprüfungen zuerst, Rest noch nie geprüfte)
  live: true                     # Trigger live nachprüfen (höchstens 1x/Tag je Seite, robots.txt – wie die Freigabe)
  # Reihenfolge für noch nie geprüfte Leads: Märkte aktiver Kunden-Abos zuerst (automatisch), dann diese Liste
  maerkte: [S2/US, S2/UK, S2/FR, S2/IE, S2/SE, S2/BE, S2/NL, S2/FI, S2/SG, S2/MX, S2/BR]
  schwerpunkt: [S2/US, S2/UK, S2/FR]   # bekommen (wie Kunden-Märkte) das 4-fache Gewicht beim Budget
  schwerpunkt_gewicht: 4

kaeufer:
  budget_je_lauf: 300            # mail-fähige Käufer (check_status = ok) je Lauf
  live: true                     # MX der Mail-Domain und Startseite (robots.txt, höchstens 1x/Tag je Seite)
  maerkte: [S2/US, S2/UK, S2/FR]  # zuerst, danach alle übrigen mail-fähigen Käufer

# Abstand bis zur nächsten Prüfung in Tagen, je Anzahl bestandener Prüfungen (1., 2., 3., 4., ab 5.)
intervalle_tage: [1, 3, 7, 14, 30]
# Käufer mit Hinweis (kein MX, Website weg, Bounce) werden nach so vielen Tagen erneut geprüft
hinweis_nachpruefung_tage: 1
