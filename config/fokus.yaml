# Fokus (Inhaber 02.10.2026: „lass uns bitte erstmal auf webagenturen fokussieren … andere Branchen ruhen“):
# Kaltmails, Entwürfe, Käufersuche und Proben bearbeiten zuerst Webagenturen (S2) in US, UK und FR.
# nur_fokus: true = der Versand schickt ausschließlich diese Paare (Erst- und Nachfassmails); Entwürfe anderer
# Branchen bleiben freigegeben liegen, bis der Inhaber sie wieder freigibt. Versandschalter: config/versand.yaml.
nur_fokus: true
fokus:
  - S2/US
  - S2/UK
  - S2/FR

# Tests nur Webagenturen US/UK/FR (Inhaber 04.10.2026: „beim gehirn bei a/b tests soll er das nur für webagencys
# usa, fr, und uk machen nichts mehr erst wenn ich ihm das freigebe das soll überall so sein, wir brauchen erstmal
# nichts anderes“). Zentrale Freigabe-Liste für ALLE Tests von Gehirn und JARVIS: Seiten-Varianten, Preis-Tests,
# Betreff-/Einstiegs-Tests, A/B bei Engpässen, neue Seiten und Zielgruppen-Auswertungen. Nur Paare Segment × Land
# aus beiden Listen dürfen getestet werden; alles andere läuft ohne Test (Seiten bleiben live, nur Variante A).
# Erweitern = Entscheidung des Inhabers. Lesen: scripts/lib/fokus.py test_allowed(), App app/lib/test-scope.ts
# (Spiegel in app/lib/ops-config.json über app/scripts/ops-config.mjs, Gleichheit per Test).
tests:
  segmente: [S2]
  laender: [US, UK, FR]

# Länder-Vorrang im Lead-Werk (Inhaber 04.10.2026: „Wenn wir genug us leads haben dann schau das wir noch uk und fr
# holen bitte“). Hat jedes Nachrang-Land mindestens faktor × den Bestand jedes Vorrang-Landes (lieferbare Leads des
# Segments, kpi_daily leads_lieferbar), behalten seine Linien 1 Wachplatz und die Plätze gehen an die Vorrang-Länder.
# Gelesen von scripts/werk_plan.py (Autopilot), Grund steht in werk_plan_log. Ausschalten: Block entfernen.
laender_vorrang:
  segment: S2
  vor: [UK, FR]
  nach: [US]
  faktor: 3
