# Täglicher automatischer Versand (jeden Tag 14:23 UTC) über .github/workflows/send.yml.
# Gesendet werden nur freigegebene Entwürfe, mit Aufwärmphase (Ziel 100/Tag: 90 Kaltmails + 10 Reserve für Antworten), Notbremse
# (Bounces über 5 %, bewertet ab 100 gesendeten Mails, oder 1 Spam-Beschwerde; scripts/lib/deliverability.py)
# und Tagesgrenzen aus countries.yaml.
aktiv: true    # 03.10.2026: Inhaber im Chat: „1 bis 3 genauso umsetzen 4. wir starten mit 90 mails pro tag“ (vorher 28.09. gestoppt)
# Inhaber 26.09.2026: „sende jeden Tag, auch heute 100“ -> keine Aufwärmphase, Tagesziel 100
# (tatsächlich höchstens anbieter_tageslimit - 10 = 90 Kaltmails, Rest für Antworten/Berichte)
# Inhaber 27.09.2026 (Chat): „lass mit 150 pro tag über strato starten“ -> keine Aufwärmphase, Tagesziel 150
# (Tagesmenge = min(tagesziel, anbieter_tageslimit - 10) = 150). Notbremse und Spam-Stopp gelten weiter.
aufwaermphase: false
# Notbremse zählt ab diesem Zeitpunkt neu (Inhaber 03.10.2026: „pass die notbremse an, das sie ab jetzt neu zählt“);
# Schwelle 5 %, Mindestmenge 100 und Sofort-Stopp bei Spam-Beschwerde bleiben unverändert.
notbremse_ab: 2026-10-03T06:52:00Z
# Inhaber 03.10.2026: „wir starten mit 90 mails pro tag“; vor jeder Erstmail Frischeprüfung der Adresse (lib/freshness.py)
tagesziel: 90
freigabe: "Justin Koch, Chat 03.10.2026: '1 bis 3 genauso umsetzen 4. wir starten mit 90 mails pro tag'"
gesamtgrenze: 1000
# Tagesgrenze des Mail-Postfachs für Kaltmails (SMTP, Strato). 10 Reserve für Antworten.
anbieter_tageslimit: 160
# Weitere Postfächer (SMTP_USER_2 … in GitHub-Secrets, scripts/lib/mailboxes.py) fahren je mit eigener Steigerung
# hoch bis höchstens zu dieser Tagesmenge je Postfach. Inhaber 03.10.2026 (leads@nextgen-profit.de als Postfach 2):
# „starte bei dem neuen postfach auch mit 60 und geh jeden tag höher bis auf 150“ -> 60, 75, 90 … 150 ab Tag 7.
postfach_start: 60
postfach_schritt: 15
# Inhaber 01.10.2026: „wir sollten die Möglichkeit haben auch hochzuskalieren, Hauptdomain passt“.
postfach_tageslimit: 150
kaufinteresse_an: justin.koch@horbach.de   # Meldungen bei Kaufinteresse/Rückfragen (Morgenbericht geht an OWNER_EMAIL)
