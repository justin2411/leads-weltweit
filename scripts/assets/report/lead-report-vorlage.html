*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream)}
body{font-family:'Inter',sans-serif;color:var(--ink);font-size:8.4pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit;text-decoration:none}
.page{position:relative;width:210mm;height:297mm;overflow:hidden;break-after:page;page-break-after:always;background:var(--cream)}
.page:last-of-type{break-after:auto;page-break-after:auto}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-size:6.1pt;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--faint);line-height:1.2}
.cap.gold,.gold{color:var(--gtext)}
.logo{font-weight:800;letter-spacing:-.025em;font-size:12pt;color:var(--ink);white-space:nowrap}
.logo .pf{color:#B48C4B}

/* header / footer */
header.top{position:absolute;left:14mm;right:14mm;top:9mm;height:9mm;display:flex;align-items:center;justify-content:space-between;
  border-bottom:.25mm solid var(--line);padding-bottom:1mm}
header.top .kicker{font-size:6.2pt;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
header.top.dark{border-bottom-color:rgba(255,255,255,.12)}
header.top.dark .logo{color:#fff} header.top.dark .logo .pf{color:var(--gink)}
header.top.dark .kicker{color:var(--gold-l)}
.prog{display:flex;align-items:center;gap:3mm;font-size:6.6pt;font-weight:700;color:var(--ink);letter-spacing:.02em}
.prog em{font-style:normal;color:var(--faint);font-weight:500}
.prog .dots{display:flex;gap:1.1mm}
.prog .dots i{width:1.7mm;height:1.7mm;border-radius:50%;border:.25mm solid #CDBF9F;display:block}
.prog .dots i.on{background:var(--gold-d);border-color:var(--gold-d)}
footer.foot{position:absolute;left:14mm;right:14mm;bottom:7.5mm;display:flex;justify-content:space-between;font-size:6.2pt;color:var(--faint);letter-spacing:.02em}
footer.foot.dark{color:#7F89A3}

/* shared navy backdrop */
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{left:-45mm;top:-70mm;width:180mm;height:160mm;background:radial-gradient(closest-side,rgba(201,164,101,.20),rgba(201,164,101,0))}
.g2{right:-60mm;bottom:-80mm;width:200mm;height:180mm;background:radial-gradient(closest-side,rgba(46,84,170,.34),rgba(46,84,170,0))}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) .26mm,transparent .3mm);background-size:4.2mm 4.2mm;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 60% 40%,#000 25%,transparent 100%)}

/* ---------------- cover ---------------- */
.cover .hero{position:absolute;left:0;top:0;width:210mm;height:121mm;background:var(--navy);overflow:hidden;color:#fff}
.eyebrow{position:absolute;left:14mm;top:29mm;display:inline-flex;align-items:center;gap:1.6mm;padding:1.3mm 3.2mm;border-radius:99mm;
  background:linear-gradient(90deg,#B8904F,#E6CC98);color:#1B1408;font-size:6.4pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow .star{fill:#1B1408;stroke:none;width:1.15em;height:1.15em}
.cover h1{position:absolute;left:14mm;top:37mm;font-size:34pt;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.cover .lede{position:absolute;left:14mm;top:55.5mm;font-size:12.5pt;color:#C8CFDD;font-weight:500;letter-spacing:-.005em}
.cover .lede .gold{color:var(--gink);font-weight:700}
.inlead{position:absolute;left:14mm;right:14mm;top:69mm;display:flex;align-items:center;gap:1.8mm;flex-wrap:nowrap}
.inlead .cap{color:#8D97B0;margin-right:1.2mm}
.chip{display:inline-flex;align-items:center;gap:1.4mm;padding:1.2mm 2.6mm;border-radius:99mm;border:.25mm solid rgba(226,198,143,.35);
  background:rgba(255,255,255,.04);font-size:7.3pt;font-weight:600;color:#EDE8DE;white-space:nowrap}
.chip .ic{color:var(--gink);width:1.15em;height:1.15em}
.kpis{position:absolute;left:14mm;right:14mm;top:84mm;display:grid;grid-template-columns:repeat(4,1fr);gap:3.5mm}
.kpi{height:26mm;border-radius:3.5mm;padding:3.6mm 4.2mm;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  border:.25mm solid rgba(226,198,143,.28);display:flex;flex-direction:column;justify-content:space-between}
.kpi b{font-size:27pt;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--gink)}
.kpi span{font-size:6.6pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A9B2C6}
.kpi.date b{font-size:21pt;padding-top:1.4mm}

.cbody{position:absolute;left:14mm;right:14mm;top:128mm}
.sech{display:flex;align-items:center;gap:3mm;margin:0 0 3mm}
.sech .rule{flex:1;height:.25mm;background:var(--line)}
.sech.dark .rule{background:rgba(255,255,255,.12)}
.panel{background:var(--card);border:.25mm solid var(--line);border-radius:4mm}
.where{display:grid;grid-template-columns:107mm minmax(0,1fr);grid-template-rows:72mm;gap:4mm;height:72mm;margin-bottom:5mm}
.where > *{min-width:0}
.mapbox{background:var(--card);border:.25mm solid var(--line);border-radius:4mm;padding:3mm 3.5mm;display:flex;align-items:center;justify-content:center}
.usmap{width:100%;height:100%}
.usmap .land{fill:#E9E3D6}
.usmap .borders{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-linejoin:round}
.usmap .pin .halo{fill:rgba(201,164,101,.22)}
.usmap .pin .dot{fill:var(--navy);stroke:#E2C68F;stroke-width:3}
.usmap .leader{stroke:#0B1530;stroke-width:2}
.usmap .spot{fill:#0B1530}
.usmap .pin text{fill:#F3E2BE;font-family:Inter;font-weight:800;font-size:15.5px;text-anchor:middle}
.legend{background:var(--card);border:.25mm solid var(--line);border-radius:4mm;padding:2.6mm 3mm;display:flex;flex-direction:column;justify-content:space-between}
.lg{display:flex;align-items:center;gap:2.2mm;padding:.38mm 0;border-bottom:.2mm solid var(--line2)}
.lg:last-child{border-bottom:none}
.lg .ln{width:4.6mm;height:4.6mm;border-radius:50%;background:var(--navy);color:#F3E2BE;font-size:6.4pt;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.lg .lt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.lg .lt b{font-size:7.1pt;font-weight:700;white-space:nowrap}
.lg .lt em{font-style:normal;font-size:6.3pt;color:var(--muted)}
.lg .lp{font-size:6pt;font-weight:700;color:var(--gtext);letter-spacing:.04em}
.common{display:grid;grid-template-columns:minmax(0,1fr) 66mm;grid-template-rows:64mm;gap:4mm;height:64mm}
.common > *,.where > *{overflow:hidden}
.panel .ph{display:flex;flex-direction:column;gap:.6mm;margin-bottom:3mm}
.panel .ph b{font-size:10.5pt;font-weight:800;letter-spacing:-.015em}
.panel .ph span{font-size:6.6pt;color:var(--muted)}
.presence{padding:3.8mm 4.5mm;display:flex;flex-direction:column}
.urow{display:flex;align-items:center;gap:3mm;height:8.6mm;border-bottom:.2mm solid var(--line2)}
.urow .ul{width:27mm;display:flex;align-items:center;gap:1.6mm;font-size:7.4pt;font-weight:600}
.urow .ul .ic{color:var(--gold-d);width:1.25em;height:1.25em}
.udots{display:flex;gap:1.15mm;flex:1}
.udots i{width:3.1mm;height:3.1mm;border-radius:50%;display:block}
.udots i.f{background:var(--navy)}
.udots i.o{border:.3mm solid var(--coral);background:var(--coral-bg)}
.uv{display:inline-flex;align-items:center;gap:1mm;font-size:7.6pt;font-weight:800;min-width:10mm;justify-content:flex-end}
.uv .ic{color:var(--green);stroke-width:2.6}
.uv.bad .ic{color:var(--coral)}
.urow.bad .ul{color:var(--coral)} .urow.bad .ul .ic{color:var(--coral)}
.opening{margin-top:auto;display:inline-flex;align-items:center;gap:1.4mm;font-size:7.6pt;font-weight:700;color:var(--gtext)}
.opening .ic{fill:var(--gold);stroke:var(--gold-d);stroke-width:1.4}
.inds{padding:3.6mm 4.2mm}
.indgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8mm 1.4mm}
.ind{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1mm}
.ind .ii{width:7.2mm;height:7.2mm;border-radius:50%;background:var(--navy);color:var(--gink);display:flex;align-items:center;justify-content:center;font-size:10.5pt}
.ind .il{font-size:5.9pt;font-weight:600;line-height:1.15;color:var(--ink)}
.ind .ic2{position:absolute;top:-1mm;left:calc(50% + 2.6mm);background:var(--gold);color:#1B1408;font-size:5.6pt;font-weight:800;border-radius:99mm;padding:.2mm 1.1mm}

/* ---------------- lead tiles ---------------- */
.tiles{position:absolute;left:14mm;right:14mm;top:23mm;bottom:15mm;display:flex;flex-direction:column;gap:5mm}
.tile{position:relative;flex:1;background:var(--card);border:.25mm solid var(--line);border-radius:4.5mm;overflow:hidden;display:flex}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:5.2mm 6mm 5mm 6mm;position:relative}
.main::before{content:'';position:absolute;left:0;top:0;right:0;height:1.4mm;background:linear-gradient(90deg,#B8904F,#EBD7AE 60%,#C9A465)}
.thead{display:flex;align-items:center;gap:3.6mm;padding:1mm 0 3.6mm;border-bottom:.2mm solid var(--line2)}
.num{width:11.5mm;height:11.5mm;border-radius:3mm;background:var(--navy);color:#EBD3A4;font-size:13pt;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;flex:none}
.tt{flex:1;min-width:0}
.tt h3{font-size:16.5pt;font-weight:800;letter-spacing:-.025em;line-height:1.12;color:var(--ink)}
.tt .sub{display:flex;align-items:center;gap:1.4mm;margin-top:1.1mm;font-size:7.7pt;color:var(--muted);font-weight:500}
.tt .sub .ind{color:var(--gold-d);width:1.35em;height:1.35em}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:3.3mm 5mm;padding:4.2mm 0 4.2mm;border-bottom:.2mm solid var(--line2)}
.cf{display:flex;align-items:center;gap:2.3mm;min-width:0}
.cf.span2{grid-column:span 2}
.ci{width:6.8mm;height:6.8mm;border-radius:50%;background:#F4EEE2;color:var(--gold-d);display:flex;align-items:center;justify-content:center;font-size:9pt;flex:none}
.ci.mute{background:#F1F1F3;color:#A3A9B6}
.cv{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.22}
.cv em{font-style:normal;font-size:5.6pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:.35mm}
.cv > a,.cv > span{font-size:9.1pt;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.cv .none{color:#A3A9B6;font-weight:500}

.tlow{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 42mm;grid-template-rows:auto 1fr;gap:3.2mm 5mm;padding-top:4mm;min-height:0}
.why{display:flex;flex-direction:column;gap:1.5mm;min-width:0}
.why p{font-size:8.15pt;line-height:1.56;color:#2B3650}
.why p b{color:var(--coral);font-weight:700}
.pres{grid-column:1 / span 2;align-self:end;display:flex;align-items:center;gap:1.6mm;padding-top:3mm;border-top:.2mm solid var(--line2)}
.pres .cap{margin-right:auto;font-size:5.8pt}
.pc{display:inline-flex;align-items:center;gap:1.2mm;padding:1.2mm 2.2mm;border-radius:99mm;background:#EDF6F0;color:var(--green);font-size:6.9pt;font-weight:700}
.pc .s{width:3.3mm;height:3.3mm}
.pc em{font-style:normal;color:#24543B}
.pc .t{width:2.6mm;height:2.6mm;stroke-width:3}
.pc.no{background:var(--coral-bg);color:var(--coral)} .pc.no em{color:var(--coral)}
.needsbox{display:flex;flex-direction:column;gap:1.6mm;min-width:0;padding-left:4.4mm;border-left:.2mm solid var(--line2)}
.needs{list-style:none;display:flex;flex-direction:column;gap:2.2mm}
.needs li{display:flex;gap:1.5mm;align-items:flex-start;font-size:7.9pt;line-height:1.32;font-weight:500;color:#2B3650}
.needs li .s{color:var(--green);width:1.2em;height:1.2em;stroke-width:2.6;margin-top:.1mm;flex:none}

/* action sidebar */
.act{width:55mm;flex:none;background:var(--navy);color:#fff;padding:5.6mm 4.8mm 4.8mm;display:flex;flex-direction:column;gap:3.2mm;position:relative;overflow:hidden}
.act{background:linear-gradient(160deg,#16264F 0%,#0B1530 55%)}
.act > *{position:relative}
.badges{display:flex;flex-direction:column;align-items:flex-start;gap:1.5mm}
.badge{display:inline-flex;align-items:center;gap:1.3mm;padding:1mm 2.3mm;border-radius:99mm;font-size:6pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.badge .s{width:1.3em;height:1.3em}
.badge.bad{background:rgba(240,128,108,.16);color:#FFB7A8;border:.25mm solid rgba(240,128,108,.5)}
.badge.prio{background:rgba(226,198,143,.10);color:var(--gold-l);border:.25mm solid rgba(226,198,143,.4)}
.meter{display:inline-flex;align-items:flex-end;gap:.45mm;height:2.3mm}
.meter i{display:block;width:.75mm;border-radius:.2mm;background:rgba(226,198,143,.28)}
.meter i:nth-child(1){height:1mm} .meter i:nth-child(2){height:1.65mm} .meter i:nth-child(3){height:2.3mm}
.meter i.on{background:var(--gink)}
.mapwrap{border-radius:2.6mm;background:rgba(255,255,255,.04);border:.25mm solid rgba(226,198,143,.18);padding:1.8mm 2mm 1.6mm}
.minimap{width:100%;height:27mm;display:block}
.mm-land{fill:#24365F} .mm-borders{fill:none;stroke:#0F1C3D;stroke-width:2.6}
.mm-halo2{fill:rgba(226,198,143,.16)} .mm-halo{fill:rgba(226,198,143,.35)} .mm-dot{fill:#E2C68F;stroke:#0B1530;stroke-width:5}
.city{display:flex;align-items:center;justify-content:center;gap:1mm;font-size:6.9pt;font-weight:700;color:#F1EDE5;margin-top:.8mm}
.city .s{color:var(--gink);width:1.2em;height:1.2em}
.win{display:flex;flex-direction:column;gap:2mm;margin-top:.6mm}
.wl{display:flex;align-items:center;gap:1.5mm}
.wl .ic{color:var(--gink);width:4mm;height:4mm}
.wl .cap{color:var(--gink);letter-spacing:.15em}
.offer{font-size:7.9pt;line-height:1.42;color:#D5DBE7}
.offer em{font-style:normal;font-weight:800;color:#fff}
.ask{border-radius:2.4mm;padding:2.2mm 2.6mm 2.4mm;background:linear-gradient(135deg,#EBD3A4,#C9A465);color:#1B1408;position:relative}
.ask::after{content:'';position:absolute;left:4mm;top:-1.4mm;width:2.8mm;height:2.8mm;background:#E6CB98;transform:rotate(45deg);border-radius:.4mm}
.ask .q{display:flex;align-items:center;gap:1.2mm;font-size:5.9pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.8mm;position:relative;z-index:1}
.ask .q em{font-style:normal}
.ask .q .ic{width:3.2mm;height:3.2mm;stroke-width:2.2}
.ask q{quotes:none;display:block;font-size:8.5pt;line-height:1.36;font-style:italic;font-weight:600;position:relative;z-index:1}

/* ---------------- closing ---------------- */
.closing{background:var(--navy);color:#fff}
.closing .ct{position:absolute;left:14mm;right:14mm;top:28mm;font-size:21pt;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.closing .ct .gold{color:var(--gink)}
.whys{position:absolute;left:14mm;right:14mm;top:44mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3.5mm}
.wcard{border-radius:3.5mm;padding:4mm 4.2mm;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:.25mm solid rgba(226,198,143,.22)}
.wcard .wi{width:8mm;height:8mm;border-radius:50%;background:linear-gradient(135deg,#E8CD97,#B8904F);color:#1B1408;display:flex;align-items:center;justify-content:center;font-size:10.5pt;margin-bottom:2.4mm}
.wcard .wi .ic{stroke-width:2.2}
.wcard b{display:block;font-size:9.6pt;font-weight:800;letter-spacing:-.01em;margin-bottom:1mm}
.wcard p{font-size:7.3pt;color:#B9C1D3;line-height:1.42}
.closing .sech{position:absolute;left:14mm;right:14mm}
.closing .sech.s2{top:90mm} .closing .sech.s3{top:137mm}
.steps{position:absolute;left:14mm;right:14mm;top:98mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3.5mm}
.step{position:relative;padding-right:4mm}
.step .sn{display:flex;align-items:center;gap:2.4mm;margin-bottom:2mm}
.step .sn span{font-size:15pt;font-weight:800;color:var(--gink);letter-spacing:-.03em;line-height:1}
.step .sn .ic{width:6.8mm;height:6.8mm;padding:1.4mm;border-radius:50%;border:.3mm solid rgba(226,198,143,.45);color:var(--gink);box-sizing:border-box}
.step:not(:last-child)::after{content:'';position:absolute;right:1mm;top:3.4mm;width:16mm;height:.3mm;
  background:linear-gradient(90deg,rgba(226,198,143,0),rgba(226,198,143,.7))}
.step b{display:block;font-size:9.4pt;font-weight:800;margin-bottom:.8mm}
.step p{font-size:7.2pt;color:#B9C1D3;line-height:1.42}
.plans{position:absolute;left:14mm;right:14mm;top:145mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3.5mm}
.plan{border-radius:4mm;padding:4.4mm 4.6mm;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:.25mm solid rgba(226,198,143,.22);
  display:flex;flex-direction:column;gap:2.2mm;min-height:55mm}
.plan .pn{font-size:6.4pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gink)}
.plan .price{display:flex;align-items:baseline;gap:1.6mm}
.plan .price b{font-size:24pt;font-weight:800;letter-spacing:-.04em;line-height:1}
.plan .price b.yn{font-size:17pt;letter-spacing:-.03em;padding:2mm 0 1.2mm}
.plan .price span{font-size:7pt;color:#9EA8BE}
.plan p{font-size:7.3pt;color:#C3CADA;line-height:1.42}
.plan p b{color:#fff}
.plan.pro{background:linear-gradient(145deg,#B8904F,#E6CC98);border-color:#F0DBAE;color:#1B1408}
.plan.pro .pn{color:#3A2A10} .plan.pro .price span{color:#4A3A1C} .plan.pro p{color:#33280F} .plan.pro p b{color:#1B1408}
.ppl{margin-top:auto;padding-top:2.4mm;border-top:.2mm solid rgba(255,255,255,.12)}
.plan.pro .ppl{border-top-color:rgba(27,20,8,.18)}
.pplh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.3mm}
.pplh span{font-size:5.8pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8D97B0}
.plan.pro .pplh span{color:#4A3A1C}
.pplh b{font-size:8pt;font-weight:800;color:#fff}
.plan.pro .pplh b{color:#1B1408}
.track{height:2.2mm;border-radius:99mm;background:rgba(255,255,255,.09);overflow:hidden}
.track i{display:block;height:100%;border-radius:99mm;background:var(--gink)}
.plan.pro .track{background:rgba(27,20,8,.14)} .plan.pro .track i{background:#1B1408}
.lower{margin-top:auto;display:flex;align-items:center;gap:1.4mm;font-size:7.1pt;font-weight:700;color:var(--gink);padding-top:2.4mm;border-top:.2mm solid rgba(255,255,255,.12)}
.lower .down{transform:rotate(90deg);width:1.3em;height:1.3em}
.custom{border-style:dashed}
.cta{position:absolute;left:14mm;right:14mm;top:212mm;border-radius:4.5mm;padding:5.5mm 6mm;display:flex;align-items:center;justify-content:space-between;gap:6mm;
  background:linear-gradient(120deg,#16295A,#0F1D40);border:.25mm solid rgba(226,198,143,.35)}
.cta b{display:block;font-size:14pt;font-weight:800;letter-spacing:-.02em;margin-bottom:1mm}
.cta p{font-size:7.8pt;color:#C3CADA;max-width:100mm}
.btn{display:inline-flex;align-items:center;gap:2mm;padding:3.2mm 5.4mm;border-radius:99mm;background:linear-gradient(90deg,#E6CC98,#B8904F);
  color:#1B1408;font-size:9pt;font-weight:800;white-space:nowrap}
.btn .ic{stroke-width:2.4;width:1.15em;height:1.15em}
.sign{position:absolute;left:0;right:0;top:252mm;text-align:center}
.dline{display:flex;align-items:center;justify-content:center;gap:3mm;margin-bottom:3.4mm}
.dline i{display:block;width:45mm;height:.25mm;background:linear-gradient(90deg,rgba(226,198,143,0),rgba(226,198,143,.8))}
.dline i:last-child{transform:scaleX(-1)}
.dm{width:3mm;height:3mm;border:.3mm solid var(--gink);transform:rotate(45deg)}
.logo.big{font-size:19pt;color:#fff} .logo.big .pf{color:var(--gink)}
.tag{margin-top:1.6mm;font-size:6.4pt;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gink)}

.call{margin-top:auto;display:flex;align-items:center;gap:2.2mm;padding:2mm 2.4mm;border-radius:2.4mm;border:.25mm solid rgba(226,198,143,.38);background:rgba(255,255,255,.04)}
.call .cb{width:7mm;height:7mm;border-radius:50%;background:linear-gradient(135deg,#E8CD97,#B8904F);color:#1B1408;display:flex;align-items:center;justify-content:center;font-size:10pt;flex:none}
.call .cb .ic{stroke-width:2.1}
.call > span:last-child{display:flex;flex-direction:column;font-size:8.6pt;font-weight:800;color:#fff;line-height:1.2;white-space:nowrap}
.call em{font-style:normal;font-size:5.6pt;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gink)}

.lg .lt b.fit{display:block;overflow:hidden}
/* ---------------- template extras ---------------- */
.where.nomap{grid-template-columns:1fr}
.where.nomap .legend{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;column-gap:6mm;align-content:space-between}
.lg.more .ln{background:var(--gold);color:#1B1408}
.lg.more b{color:var(--gtext)}
.ind.more .ii{background:#F4EEE2;color:var(--gtext);font-size:9pt;font-weight:800}
.udots.dense{gap:.6mm}
.udots.dense i{width:2mm;height:2mm}
.badge.warn{background:rgba(233,180,76,.16);color:#F4D58E;border:.25mm solid rgba(233,180,76,.5)}
.mapwrap.nomap{padding:2mm}
.tile.filler{background:var(--navy);border-color:rgba(226,198,143,.35);color:#fff;align-items:center;justify-content:center;overflow:hidden}
.tile.filler .glow.g1{left:-40mm;top:-60mm}
.tile.filler .fin{position:relative;text-align:center;max-width:125mm;display:flex;flex-direction:column;align-items:center;gap:4.5mm}
.tile.filler h3{font-size:23pt;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile.filler p{font-size:9.5pt;color:#C3CADA;line-height:1.5}
.eyebrow.inline{position:static}

</style>

    let prog = '';
    if (range) {
      const dots = n <= 20 ? `<span class="dots">${D.leads.map((_, i) => `<i class="${range[0] <= i + 1 && i + 1 <= range[1] ? 'on' : ''}"></i>`).join('')}</span>` : '';
      const lbl = fill(T.leadsRange, { from: pad2(range[0]), to: pad2(range[1]) });
      prog = `<div class="prog"><span>${esc(lbl)} <em>${esc(fill(T.ofTotal, { total: n }))}</em></span>${dots}</div>`;
    }
    return `<header class="top${dark ? ' dark' : ''}">${logo(D)}${prog}<div class="kicker">${esc(fill(D.report.kicker, D._vars))}</div></header>`;
  }
  const logo = (D, cls = '') => `<div class="logo ${cls}">${esc(D.brand.name)} <span class="pf">${esc(D.brand.accent)}</span></div>`;
  const footer = (D, page, dark) => `<footer class="foot${dark ? ' dark' : ''}"><span>${esc(D.report.footer)}</span><span>${page} / ${D._pages}</span></footer>`;

  function unitRow(row, leads, T) {
    const known = leads.filter(L => L._online[row.key] !== undefined);
    if (!known.length) return '';
    const yes = known.filter(L => L._online[row.key]).length, total = known.length;
    const dots = known.map((_, i) => `<i class="${i < yes ? 'f' : 'o'}"></i>`).join('');
    const bad = !!row.highlight;
    const stat = `<span class="uv${bad ? ' bad' : ''}">${ic(bad ? 'x' : 'check', 'ic s')}${yes}/${total}</span>`;
    return `<div class="urow${bad ? ' bad' : ''}"><span class="ul">${ic(row.icon || 'check')}${esc(row.label)}</span><span class="udots${total > 12 ? ' dense' : ''}">${dots}</span>${stat}</div>`;
  }

  function cover(D) {
    const T = D.labels, C = D.cover, leads = D.leads, V = D._vars;
    const groups = new Map();
    leads.forEach(L => { const k = industryLabel(L); const g = groups.get(k.toLowerCase()) || { label: k, icon: industryIcon(L), n: 0 }; g.n++; groups.set(k.toLowerCase(), g); });
    const inds = [...groups.values()];
    const shown = inds.length > 9 ? inds.slice(0, 8) : inds;
    let indHtml = shown.map(g => `<div class="ind"><span class="ii">${ic(g.icon)}</span><span class="il">${esc(g.label)}</span>${g.n > 1 ? `<span class="ic2">×${g.n}</span>` : ''}</div>`).join('');
    if (inds.length > 9) indHtml += `<div class="ind more"><span class="ii">+${inds.length - 8}</span><span class="il">${esc(fill(T.moreIndustries, { n: inds.length - 8 }))}</span></div>`;

    const maxRows = D.report.map === 'us' ? 10 : 20, list = leads.length > maxRows ? leads.slice(0, maxRows - 1) : leads;
    let legend = list.map(L => `<a class="lg" href="#lead-${L._n}"><span class="ln">${L._i}</span><span class="lt"><b class="fit">${esc(L.name)}</b>` +
      `<em>${esc([L.city, L.state].filter(Boolean).join(', '))}</em></span><span class="lp">${esc(T.pageShort)}${L._page}</span></a>`).join('');
    if (leads.length > maxRows) {
      const rest = leads.slice(maxRows - 1);
      legend += `<div class="lg more"><span class="ln">+</span><span class="lt"><b>${esc(fill(T.moreLeads, { n: rest.length }))}</b><em>${esc(T.pageShort)}${rest[0]._page}–${rest[rest.length - 1]._page}</em></span></div>`;
    }
    const chips = (C.inEveryLead || []).map(c => `<span class="chip">${ic(c.icon)}${esc(c.text)}</span>`).join('');
    const kpis = (C.kpis || [
      { value: String(leads.length), label: T.kpiLeads },
      { value: String(V.states), label: T.kpiStates },
      { value: String(inds.length), label: T.kpiIndustries },
      D._dateKpi,
    ]).filter(Boolean).map(k => `<div class="kpi${String(k.value).length > 3 ? ' date' : ''}"><b>${esc(k.value)}</b><span>${esc(k.label)}</span></div>`).join('');
    const rows = (C.presenceRows || []).map(r => unitRow(r, leads, T)).join('');
    const showMap = D.report.map === 'us';
    return `
<section class="page cover">
  <div class="hero">
    <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
    ${header(D, true)}
    <div class="eyebrow">${ic('star', 'ic star')}${esc(fill(D.report.eyebrow, V))}</div>
    <h1>${esc(fill(D.report.title, V))}</h1>
    <p class="lede">${md(fill(D.report.subtitle, V)).replace(/<b>/g, '<span class="gold">').replace(/<\/b>/g, '</span>')}</p>
    <div class="inlead"><span class="cap">${esc(T.inEveryLead)}</span>${chips}</div>
    <div class="kpis">${kpis}</div>
  </div>
  <div class="cbody">
    <div class="sech"><span class="cap gold">${esc(T.whereTitle)}</span><span class="rule"></span></div>
    <div class="where${showMap ? '' : ' nomap'}">
      ${showMap ? `<div class="mapbox">${bigMap(leads)}</div>` : ''}
      <div class="legend">${legend}</div>
    </div>
    <div class="sech"><span class="cap gold">${esc(T.commonTitle)}</span><span class="rule"></span></div>
    <div class="common">
      <div class="panel presence">
        <div class="ph"><b>${esc(fill(C.presenceTitle, V))}</b><span>${esc(fill(C.presenceNote, V))}</span></div>
        ${rows}
        ${C.opening ? `<div class="opening">${ic('bolt', 'ic s')}${esc(fill(C.opening, V))}</div>` : ''}
      </div>
      <div class="panel inds">
        <div class="ph"><b>${esc(fill(T.industriesTitle, V))}</b><span>${esc(fill(C.industriesNote || '', V))}</span></div>
        <div class="indgrid">${indHtml}</div>
      </div>
    </div>
  </div>
  ${footer(D, 1)}
</section>`;
  }

  function tile(D, L) {
    const T = D.labels;
    const needs = (L.needs || []).map(n => `<li>${ic('check', 'ic s')}<span>${md(n)}</span></li>`).join('');
    const pres = Object.keys(T.online).filter(k => L._online[k] !== undefined).map(k => {
      const ok = !!L._online[k], bad = !ok;
      return `<span class="pc${bad ? ' no' : ''}">${ic({ phone: 'phone', email: 'mail', facebook: 'social', website: 'globe' }[k] || 'check', 'ic s')}<em>${esc(T.online[k])}</em>${ic(ok ? 'check' : 'x', 'ic t')}</span>`;
    }).join('');
    const f = (icon, label, value, cls = '', mute = false) =>
      `<div class="cf ${cls}"><span class="ci${mute ? ' mute' : ''}">${ic(icon)}</span><span class="cv"><em>${esc(label)}</em>${value}</span></div>`;
    const val = (v, cls = '') => isEmpty(v) ? `<span class="none">${esc(T.noValue)}</span>` : `<span class="${cls}">${esc(v)}</span>`;
    const phone = isEmpty(L.phone) ? val('') : `<a href="${telHref(L.phone)}">${esc(fmtPhone(L.phone))}</a>`;
    const email = isEmpty(L.email) ? val('') : `<a class="fit" href="mailto:${esc(L.email)}">${esc(L.email)}</a>`;
    const site = isEmpty(L.website) ? val('') : `<a class="fit" href="${esc(/^https?:/.test(L.website) ? L.website : 'https://' + L.website)}">${esc(L.website)}</a>`;
    const prio = String(L.priority || 'medium').toLowerCase(), bars = PRIORITY_BARS[prio] || 2;
    const [rcls, ricon] = REASON_STYLE[L.reasonType] || REASON_STYLE.nosite;
    const sub = [L.category, [L.city, L.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
    const mm = D.report.map === 'us' ? miniMap(L) : '';
    return `
<article class="tile" id="lead-${L._n}">
  <div class="main">
    <div class="thead">
      <div class="num">${L._n}</div>
      <div class="tt"><h3 class="fit1">${esc(L.name)}</h3><div class="sub">${ic(industryIcon(L), 'ic ind')}<span>${esc(sub)}</span></div></div>
    </div>
    <div class="cgrid">
      ${f('phone', T.phone, phone)}
      ${isEmpty(L.contact) ? f('cal', T.detected, val(L.detected)) : f('user', T.contact, val(L.contact))}
      ${f('mail', T.email, email, 'span2')}
      ${f('pin', T.address, val(L.address, 'fit'), 'span2')}
      ${isEmpty(L.website) ? '' : f('globe', T.website, site)}
      ${isEmpty(L.contact) ? '' : f('cal', T.detected, val(L.detected))}
    </div>
    <div class="tlow">
      <div class="why"><div class="cap gold">${esc(T.whyNow)}</div><p>${md(L.why)}</p></div>
      <div class="needsbox"><div class="cap gold">${esc(T.needs)}</div><ul class="needs">${needs}</ul></div>
      ${pres ? `<div class="pres"><span class="cap">${esc(T.onlineCheck)}</span>${pres}</div>` : ''}
    </div>
  </div>
  <aside class="act">
    <div class="badges">
      ${L.reason ? `<span class="badge ${rcls}">${ic(ricon, 'ic s')}${esc(L.reason)}</span>` : ''}
      <span class="badge prio"><span class="meter">${[1, 2, 3].map(k => `<i class="${k <= bars ? 'on' : ''}"></i>`).join('')}</span>${esc(T.priority[prio] || prio)}</span>
    </div>
    ${mm || L.city ? `<div class="mapwrap${mm ? '' : ' nomap'}">${mm}<div class="city">${ic('pin', 'ic s')}${esc([L.city, L.state].filter(Boolean).join(', '))}</div></div>` : ''}
    <div class="win">
      <div class="wl">${ic('target', 'ic')}<span class="cap">${esc(T.howToWin)}</span></div>
      ${L.offer ? `<p class="offer"><em>${esc(T.offer)}</em> ${md(L.offer)}</p>` : ''}
      ${L.ask ? `<div class="ask"><span class="q">${ic('chat', 'ic')}<em>${esc(T.ask)}</em></span><q>${esc(L.ask)}</q></div>` : ''}
    </div>
    ${isEmpty(L.phone) ? '' : `<a class="call" href="${telHref(L.phone)}"><span class="cb">${ic('phone', 'ic')}</span><span><em>${esc(T.callPrompt)}</em>${esc(fmtPhone(L.phone))}</span></a>`}
  </aside>
</article>`;
  }

  function filler(D) {             // fills the empty half when the number of leads is odd
    const F = D.closing.filler; if (!F) return '';
    return `<article class="tile filler"><div class="glow g1"></div><div class="grid"></div><div class="fin">
      <span class="eyebrow inline">${ic('star', 'ic star')}${esc(F.eyebrow || '')}</span>
      <h3>${esc(F.title)}</h3><p>${md(F.text || '')}</p>
      ${D.closing.cta && D.closing.cta.url ? `<a class="btn" href="${esc(D.closing.cta.url)}">${esc(F.button || D.closing.cta.button)}${ic('arrow', 'ic s')}</a>` : ''}</div></article>`;
  }

  function leadPage(D, pageNo, pair) {
    const a = pair[0]._i, b = pair[pair.length - 1]._i;
    return `
<section class="page leads">
  ${header(D, false, [a, b])}
  <div class="tiles">${pair.map(L => tile(D, L)).join('')}${pair.length === 1 ? filler(D) : ''}</div>
  ${footer(D, pageNo)}
</section>`;
  }

  function closing(D) {
    const C = D.closing, T = D.labels;
    const plans = C.plans || [];
    const maxPer = Math.max(0, ...plans.map(p => +p.perLead || 0));
    const wc = (C.reasons || []).map(r => `<div class="wcard"><span class="wi">${ic(r.icon)}</span><b>${esc(r.title)}</b><p>${md(r.text)}</p></div>`).join('');
    const st = (C.steps || []).map((s, k) => `<div class="step"><div class="sn"><span>${pad2(k + 1)}</span>${ic(s.icon)}</div><b>${esc(s.title)}</b><p>${md(s.text)}</p></div>`).join('');
    const pl = plans.map(p => {
      const bar = p.perLead ? `<div class="ppl"><div class="pplh"><span>${esc(T.perLead)}</span><b>${esc(p.perLeadLabel || p.perLead)}</b></div><div class="track"><i style="width:${(p.perLead / maxPer * 100).toFixed(1)}%"></i></div></div>` : '';
      const note = p.note ? `<div class="lower">${ic('arrow', 'ic s down')}${esc(p.note)}</div>` : '';
      const big = String(p.price || '').length > 6;
      return `<div class="plan${p.highlight ? ' pro' : ''}${p.dashed ? ' custom' : ''}"><span class="pn">${esc(p.name)}</span>` +
        `<div class="price"><b class="${big ? 'yn' : ''}">${esc(p.price)}</b>${p.per ? `<span>${esc(p.per)}</span>` : ''}</div><p>${md(p.text)}</p>${bar}${note}</div>`;
    }).join('');
    const cta = C.cta || {};
    return `
<section class="page closing">
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  ${header(D, true)}
  <h2 class="ct">${esc(C.title)} <span class="gold">${esc(C.titleAccent || '')}</span></h2>
  <div class="whys" style="grid-template-columns:repeat(${Math.max(1, (C.reasons || []).length)},1fr)">${wc}</div>
  <div class="sech dark s2"><span class="cap gold">${esc(T.howItWorks)}</span><span class="rule"></span></div>
  <div class="steps" style="grid-template-columns:repeat(${Math.max(1, (C.steps || []).length)},1fr)">${st}</div>
  <div class="sech dark s3"><span class="cap gold">${esc(T.plansTitle)}</span><span class="rule"></span></div>
  <div class="plans" style="grid-template-columns:repeat(${Math.max(1, plans.length)},1fr)">${pl}</div>
  <div class="cta"><div><b>${esc(cta.title || '')}</b><p>${md(cta.text || '')}</p></div>
    ${cta.url ? `<a class="btn" href="${esc(cta.url)}">${esc(cta.button || '')}${ic('arrow', 'ic s')}</a>` : ''}</div>
  <div class="sign"><div class="dline"><i></i><span class="dm"></span><i></i></div>${logo(D, 'big')}<div class="tag">${esc(C.tagline || '')}</div></div>
  ${footer(D, D._pages, true)}
</section>`;
  }

  /* ---------------------------------------------------------------- layout fitting */
  function fitAll() {
    for (const el of $$('.fit')) {                     // emails, addresses, legend names: one line, shrink if needed
      const box = el.parentElement; let fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.whiteSpace = 'nowrap'; el.style.display = el.tagName === 'B' ? 'block' : el.style.display;
      while (el.scrollWidth > box.clientWidth + 0.5 && fs > 7.6) { fs -= 0.2; el.style.fontSize = fs + 'px'; }
    }
    for (const el of $$('.fit1')) {                    // lead names: one line down to 12.5pt, otherwise wrap
      let fs = parseFloat(getComputedStyle(el).fontSize); el.style.whiteSpace = 'nowrap';
      while (el.scrollWidth > el.clientWidth && fs > 16.7) { fs -= 0.25; el.style.fontSize = fs + 'px'; }
      if (el.scrollWidth > el.clientWidth) { el.style.whiteSpace = ''; el.style.fontSize = ''; }
    }
    for (const t of $$('.tile:not(.filler)')) {         // long texts: shrink inside the tile instead of overflowing
      const main = $('.main', t), act = $('.act', t);
      for (const [box, sels] of [[main, ['.why p', '.needs li']], [act, ['.offer', '.ask q']]]) {
        let k = 1;
        while (box.scrollHeight > box.clientHeight + 1 && k > 0.8) {
          k -= 0.03; for (const sel of sels) for (const el of $$(sel, box)) { el.style.fontSize = ''; el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * k) + 'px'; }
        }
      }
    }
    const warn = [];
    $$('.page').forEach((p, i) => {
      const pr = p.getBoundingClientRect();
      for (const el of $$('.tile, .panel, .legend, .mapbox, .plans, .cta, .sign', p)) {
        const r = el.getBoundingClientRect();
        if (r.bottom > pr.bottom - 10 || el.scrollHeight > el.clientHeight + 2) { warn.push(`Seite ${i + 1}: Inhalt passt nicht ganz (${el.className.split(' ')[0]})`); break; }
      }
    });
    warn.forEach(w => console.warn(w));
    return warn;
  }

  /* ---------------------------------------------------------------- main */
  window.renderReport = async function (data) {
    window.READY = false;
    const D = merge({ brand: { name: 'NextGen', accent: 'Profit' }, report: {}, labels: DEFAULT_LABELS, cover: {}, closing: {}, leads: [] }, data || {});
    D.labels = merge(DEFAULT_LABELS, (data || {}).labels || {});
    D.report = merge({ map: 'us', kicker: 'Lead briefing · {date}', footer: 'Confidential · for your firm only', title: 'Your free sample.' }, D.report);
    document.documentElement.lang = D.report.lang || 'en';
    const leads = D.leads = (D.leads || []).map((L, i) => {
      const online = { ...(L.online || {}) };
      if (online.phone === undefined && 'phone' in L) online.phone = !isEmpty(L.phone);
      if (online.email === undefined && 'email' in L) online.email = !isEmpty(L.email);
      if (online.website === undefined && 'website' in L) online.website = !isEmpty(L.website);
      return { ...L, _i: i + 1, _n: pad2(i + 1), _page: 2 + Math.floor(i / 2), _online: online };
    });
    const states = new Set(leads.map(L => String(L.state || '').toUpperCase()).filter(Boolean)).size;
    const industries = new Set(leads.map(L => industryLabel(L).toLowerCase())).size;
    D._pages = 2 + Math.ceil(leads.length / 2);
    D._vars = { count: leads.length, date: D.report.date || '', country: D.report.country || '', states, industries };
    if (D.report.documentTitle) document.title = fill(D.report.documentTitle, D._vars);
    const m = String(D.report.date || '').match(/^(.*\S)\s+(\d{4})$/);
    D._dateKpi = D.report.date ? (m ? { value: m[1], label: `${D.labels.kpiDetected} · ${m[2]}` } : { value: D.report.date, label: D.labels.kpiDetected }) : null;

    const pages = [cover(D)];
    for (let k = 0; k < leads.length; k += 2) pages.push(leadPage(D, 2 + k / 2, leads.slice(k, k + 2)));
    pages.push(closing(D));
    $('#report').innerHTML = pages.join('');
    await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.REPORT_WARNINGS = fitAll();
    window.READY = true;
    return window.REPORT_WARNINGS;
  };

  // preview: render the example data embedded in this file
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('report-data');
    if (el && !window.NO_AUTO_RENDER) window.renderReport(JSON.parse(el.textContent));
  });
})();

</script>
</body>
</html>
