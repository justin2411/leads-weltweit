<!doctype html>
<html><head><meta charset="utf-8">
<!-- Version 4: Radar-Film, landesweit, Dunkelblau + Gold. Texte aus CFG.ui (segments.py), Zeiten aus TIMING (vo.py).
     Szenen: A Neue Firma · B Uhr läuft · C Marke · D Radar über den Quellen · S Signale der Branche · E Lead-Karte + Briefing ·
     Q Qualitätswert (min. 60) · M Montag: PDF + Tabelle · X Exklusiv je Branche · G 10 kostenlose Leads · H Abschluss -->
<style>
@font-face{font-family:Inter;src:url(../fonts/inter-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Inter;src:url(../fonts/inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(../fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(../fonts/inter-latin-800-normal.woff2);font-weight:800}
:root{--bg:#0B1428;--bg2:#0f1d38;--card:#101f3c;--card2:#142848;--ink:#f4efe6;--soft:#9aa6ba;--gold:#D8BD8A;--goldd:#B08D57;--goldl:#E2C894;--bad:#e07a6e;--line:#17294c;--edge:#27406b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:-200px;background:
  radial-gradient(1000px 680px at var(--gx,62%) var(--gy,30%),rgba(216,189,138,.15),transparent 70%),
  radial-gradient(800px 600px at 16% 88%,rgba(62,98,170,.20),transparent 70%)}
#grid{position:absolute;inset:0;opacity:.45;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(170,40,40,.5) 100%);opacity:0}
#flash{position:absolute;inset:0;background:#fff6e4;opacity:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;display:none}
.abs{position:absolute}
svg{position:absolute;left:0;top:0;overflow:visible}
svg.i{position:static;display:block;flex:none}
.logo{font-size:128px;font-weight:800;letter-spacing:-4px;display:flex;gap:28px;justify-content:center}
.gold{background:linear-gradient(100deg,var(--goldl),var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent}
.mask{overflow:hidden;display:inline-block;padding-bottom:14px}.mask>span{display:inline-block}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 28px;border-radius:99px;font-size:30px;font-weight:600;background:rgba(216,189,138,.1);border:1px solid rgba(216,189,138,.42);color:#f3e6c8;white-space:nowrap}
.card{position:absolute;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--edge);box-shadow:0 40px 120px rgba(0,0,0,.5);overflow:hidden}
.lbl{font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.ill{position:absolute;font-size:20px;color:var(--soft);letter-spacing:.5px}
.srcl{position:absolute;font-size:26px;font-weight:600;color:#e9e1cf;text-align:center;width:300px}
/* Signale */
.sig{position:absolute;top:390px;width:460px;height:330px;border-radius:30px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--edge);box-shadow:0 30px 90px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;padding-top:40px}
.sig .ic{width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(216,189,138,.2),rgba(216,189,138,.04) 70%);border:2px solid rgba(216,189,138,.6)}
.sig .t{font-size:38px;font-weight:700;margin-top:30px;letter-spacing:-.5px;text-align:center;padding:0 20px}
.sig .s{font-size:24px;color:var(--soft);margin-top:10px;text-align:center}
.sig .ring{position:absolute;left:50%;top:104px;width:128px;height:128px;margin-left:-64px;margin-top:-64px;border-radius:50%;border:3px solid var(--gold);opacity:0}
/* Lead-Karte */
.row1{display:flex;justify-content:space-between;align-items:center}
.prio{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:#f3e6c8;padding:8px 18px;border-radius:99px;background:rgba(216,189,138,.12);border:1px solid rgba(216,189,138,.45)}
.prio i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.ev{display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.ev .e{font-size:30px;font-weight:700;color:var(--goldl);margin-right:6px}
.mchip{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:12px;font-size:22px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid #2b416b;color:#dfe5ef;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:22px;margin-top:30px;padding-top:28px;border-top:1px solid #243a62}
.fld{display:flex;align-items:center;gap:18px;min-width:0}
.fld .ic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(216,189,138,.1);border:1px solid rgba(216,189,138,.35);flex:none}
.fld .k{font-size:16px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--soft)}
.fld .v{font-size:27px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* Briefing */
#R_panel{position:absolute;left:990px;top:215px;width:820px;border-radius:30px;padding:40px 46px;background:linear-gradient(180deg,#152a4c,#0f1d38);border:1px solid rgba(216,189,138,.45);box-shadow:0 40px 120px rgba(0,0,0,.5)}
.br{display:flex;align-items:center;gap:22px;padding:18px 0;border-bottom:1px solid #243a62}
.br .ic{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--goldl),var(--goldd));flex:none}
.br .k{font-size:17px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.br .v{font-size:31px;font-weight:700;margin-top:4px}
#R_op{margin-top:24px;border-left:4px solid var(--gold);padding:4px 0 4px 22px}
#R_line{font-size:26px;line-height:1.42;margin-top:8px;color:#eee7d8;min-height:112px}
/* Qualität */
.qc{position:absolute;width:300px;height:190px;border-radius:20px;background:var(--card2);border:3px solid var(--edge);padding:24px}
.qc .l1{width:190px;height:18px;border-radius:7px;background:var(--gold)}.qc .l2{width:240px;height:13px;border-radius:5px;background:#2c4470;margin-top:14px}
.qc .sc{position:absolute;right:20px;bottom:14px;font-size:56px;font-weight:800;color:#e9e1cf}
/* Montag */
.doc{position:absolute;width:230px;height:300px;border-radius:18px;background:#f6f1e7;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;padding:26px 22px}
.doc .hd{height:40px;border-radius:8px;background:#0f1d38;display:flex;align-items:center;padding-left:12px}
.doc .hd b{width:70px;height:10px;border-radius:5px;background:var(--gold)}
.doc .ln{height:11px;border-radius:5px;background:#d9cfbd;margin-top:14px}
.doc .tag{position:absolute;right:14px;bottom:14px;font-size:22px;font-weight:800;color:#0f1d38;background:linear-gradient(135deg,var(--goldl),var(--goldd));padding:6px 12px;border-radius:8px;letter-spacing:1px}
.doc table{border-collapse:collapse;width:100%;margin-top:14px}
.doc td{border:1.5px solid #cbbfa8;height:26px}
.doc tr:first-child td{background:#e9dcc0}
.dlab{position:absolute;width:300px;text-align:center}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2C894"/><stop offset="1" stop-color="#B08D57"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="rgba(216,189,138,.45)"/><stop offset="1" stop-color="rgba(216,189,138,0)"/></radialGradient></defs></svg>

<!-- A: neue Firma taucht auf -->

<!-- B: die Zeit läuft -->
<div class="scene" id="B"><svg width="1920" height="1080" id="B_svg"></svg></div>

<!-- C: Marke -->
<div class="scene" id="C">

    <div class="logo" style="font-size:118px"><span class="mask"><span id="C1">NextGen</span></span><span class="mask"><span id="C2" class="gold">Profit</span></span></div>

</div>

<!-- D: Radar über den Quellen -->
<div class="scene" id="D">

</div>

<!-- S: Signale der Branche -->
<div class="scene" id="S">

  <div id="S_cards"></div>
</div>

<!-- E: Lead-Karte, dann Briefing -->
<div class="scene" id="E">

    <div id="E_in" style="padding:42px 56px;opacity:0;width:1300px">
      <div class="row1"><div class="lbl" data-u="newlead"></div><span class="prio" id="E_prio"><i></i><span data-u="prio"></span></span></div>
      <div style="font-size:56px;font-weight:800;letter-spacing:-1.5px;margin-top:8px;white-space:nowrap" data-l="co"></div>
      <div class="ev" id="E_ev"><span class="e" data-l="event"></span><span class="mchip" id="E_c1"><span data-ic="cal" data-s="24"></span><span data-l="date"></span></span><span class="mchip" id="E_c2"><span data-ic="link" data-s="24"></span><span data-l="src"></span></span></div>

    </div>
  </div>
  <div id="R_panel" style="opacity:0">

<!-- Q: Qualitätswert -->
