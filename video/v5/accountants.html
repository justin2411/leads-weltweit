<!doctype html>
<html><head><meta charset="utf-8">
<!-- v5 Steuerberater / Accountants: "Das erste Jahr einer Firma" – Register-Stempel, Jahresleiste mit Fristen,
     Kanzlei als Mittelpunkt über Jahre, Kassenbuch mit Neueintragungen, Montag. -->
<link rel="stylesheet" href="lib/base.css">
<style>
#pat{background-image:repeating-linear-gradient(0deg,rgba(120,150,200,.07) 0 1px,transparent 1px 64px)}
#pat::after{content:"";position:absolute;top:0;bottom:0;left:250px;width:2px;background:rgba(216,189,138,.12)}
/* A: Registerauszug */
#A_doc{position:absolute;left:560px;top:230px;width:800px;height:560px;border-radius:14px;background:linear-gradient(180deg,#faf6ee,#efe6d4);color:#1a2540;box-shadow:0 50px 140px rgba(0,0,0,.55);padding:52px 64px;transform-origin:50% 100%}
#A_doc .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #1a2540;padding-bottom:18px}
#A_doc .t{font-size:24px;font-weight:800;letter-spacing:5px;text-transform:uppercase}
#A_doc .s{font-size:20px;font-weight:600;color:#6b6a63}
.rf{display:flex;padding:20px 0;border-bottom:1px solid #d5c9b1}
.rf .kk{width:220px;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8a7c60;padding-top:6px}
.rf .vv{font-size:32px;font-weight:700;white-space:nowrap}
#A_stamp{position:absolute;left:1110px;top:590px;width:230px;height:230px;border-radius:50%;border:8px solid #B8914F;color:#B8914F;display:flex;align-items:center;justify-content:center;opacity:0}
#A_stamp::before{content:"";position:absolute;inset:14px;border-radius:50%;border:3px solid #B8914F}
#A_stamp span{font-size:28px;font-weight:800;letter-spacing:4px;text-transform:uppercase;text-align:center;line-height:1.1;padding:0 30px}
/* B: Jahresleiste */
#B_stage{position:absolute;inset:0;perspective:1600px}
#B_strip{position:absolute;left:0;top:560px;height:150px;transform-origin:0 50%;display:flex;gap:14px}
.mo{width:128px;height:140px;border-radius:18px;background:linear-gradient(180deg,#142848,#0f1d38);border:1px solid #27406b;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.mo b{font-size:30px;font-weight:700;color:#dfe5ef;text-transform:capitalize}
.mo small{font-size:18px;color:var(--soft);margin-top:6px}
#B_prog{position:absolute;left:0;top:740px;height:6px;border-radius:3px;background:linear-gradient(90deg,#B8914F,#E2C894);box-shadow:0 0 20px rgba(216,189,138,.6)}
.dl{position:absolute;display:flex;align-items:center;gap:18px;padding:20px 28px 20px 20px;border-radius:22px;background:linear-gradient(180deg,#18305a,#112240);border:2px solid rgba(216,189,138,.7);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 40px rgba(216,189,138,.18);white-space:nowrap}
.dl .ic{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#E2C894,#B8914F);display:flex;align-items:center;justify-content:center;flex:none}
.dl .a{font-size:30px;font-weight:800;letter-spacing:-.3px}
.dl .b{font-size:20px;font-weight:600;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.stem{position:absolute;width:3px;background:linear-gradient(180deg,#E2C894,rgba(216,189,138,.1))}
#B_head{position:absolute;top:150px}
/* C: Kanzlei im Mittelpunkt */
.yr{position:absolute;top:830px;width:170px;height:90px;border-radius:16px;border:2px solid #27406b;background:#101f3c;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#9aa6ba}
/* D: Kassenbuch */
#D_book{position:absolute;left:170px;top:170px;width:1580px;height:760px;perspective:2200px}
.pg{position:absolute;top:0;height:760px;width:790px;background:linear-gradient(180deg,#faf6ee,#ede3cf);color:#1a2540;padding:50px 54px}
#D_l{left:0;border-radius:18px 4px 4px 18px;box-shadow:-30px 40px 120px rgba(0,0,0,.5);background-image:linear-gradient(90deg,#faf6ee 88%,#e3d7bf)}
#D_r{left:790px;border-radius:4px 18px 18px 4px;transform-origin:0 50%;box-shadow:30px 40px 120px rgba(0,0,0,.5);background-image:linear-gradient(90deg,#e3d7bf,#faf6ee 12%)}
.lh{font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#8a6a33;display:flex;align-items:center;gap:12px}
.lr{display:grid;grid-template-columns:1.55fr .9fr 1.2fr;gap:14px;padding:17px 12px;border-bottom:1.5px solid #cdbf a3;border-bottom:1.5px solid #d5c9b1;font-size:22px;font-weight:600;white-space:nowrap;position:relative}
.lr>span{overflow:hidden;text-overflow:ellipsis}
.lr.h{font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8a7c60;padding-top:30px}
.lr .hl{position:absolute;inset:4px -6px;border-radius:10px;background:rgba(216,189,138,.45);z-index:-1;transform-origin:0 50%}
.df{display:flex;align-items:center;gap:20px;padding:17px 0;border-bottom:1.5px solid #d5c9b1}
.df .ic{width:54px;height:54px;border-radius:14px;background:#1a2540;display:flex;align-items:center;justify-content:center;flex:none}
.df .kk{font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8a7c60}
.df .vv{font-size:26px;font-weight:700;white-space:nowrap}
/* E: Montag */
.sheet{position:absolute;width:300px;height:390px;border-radius:14px;background:linear-gradient(180deg,#faf6ee,#ede3cf);box-shadow:0 40px 100px rgba(0,0,0,.5);padding:30px 28px;color:#1a2540}
.sheet .ln{height:12px;border-radius:6px;background:#d5c9b1;margin-top:16px}
.sheet .tg{position:absolute;right:18px;bottom:18px;font-size:22px;font-weight:800;color:#0f1d38;background:linear-gradient(135deg,#E2C894,#B8914F);padding:6px 14px;border-radius:8px;letter-spacing:1px}
.wk{width:120px;height:120px;border-radius:22px;border:2px solid #27406b;background:#101f3c;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#51607d}
</style></head>
<body>
<!-- A: neue Firma, Stempel -->
<div class="scene" id="A">
  <div id="A_doc">
    <div class="hd"><span class="t" data-u="regtitle"></span><span class="s" data-u="src"></span></div>
    <div id="A_rows"></div>
  </div>
  <div id="A_stamp"><span data-u="stamp"></span></div>
</div>
<!-- B: das erste Jahr -->
<div class="scene" id="B">
  <div id="B_head" class="abs ctr"><span class="chip" style="font-size:34px"><span data-ic="cal" data-s="36"></span><span data-u="yearone"></span></span></div>
  <div id="B_stage"><div id="B_world" class="abs" style="inset:0"><div id="B_strip"></div><div id="B_prog"></div><div id="B_pins"></div></div></div>
</div>
<!-- C: die Kanzlei, die zuerst da ist -->
<div class="scene" id="C"><svg width="1920" height="1080" id="C_svg"></svg><div id="C_yrs"></div>
  <div id="C_hubl" class="abs ctr" style="top:640px"><span class="chip" style="font-size:32px" data-u="hub"></span></div></div>
<!-- D: Kassenbuch der Neueintragungen -->
<div class="scene" id="D">
  <div id="D_book">
    <div class="pg" id="D_l"><div class="lh"><span data-ic="file" data-s="28" data-c="#8a6a33"></span><span data-u="ledger"></span></div><div id="D_rows"></div></div>
    <div class="pg" id="D_r"><div class="lh"><span data-ic="user" data-s="28" data-c="#8a6a33"></span><span data-u="detail"></span></div>
      <div style="font-size:38px;font-weight:800;margin-top:26px;letter-spacing:-.6px;white-space:nowrap" data-u="co"></div><div id="D_fields" style="margin-top:14px"></div></div>
  </div>
</div>
<!-- E: jeden Montag -->
<div class="scene" id="E">
  <div id="E_week" class="abs" style="left:0;right:0;top:170px;display:flex;justify-content:center;gap:24px"></div>
  <div class="sheet" id="E_pdf"><div class="ln" style="width:60%;height:22px;background:#1a2540"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:75%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:80%"></div><span class="tg">PDF</span></div>
  <div class="sheet" id="E_xls"><div class="ln" style="width:60%;height:22px;background:#1a2540"></div><div id="E_grid" style="margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div><span class="tg">XLSX</span></div>
  <div id="E_excl" class="abs ctr" style="top:860px"><span class="chip" style="font-size:32px"><span data-ic="lock" data-s="32"></span><span data-u="excl"></span></span></div>
</div>
<script src="lib/lib.js"></script>
<script>
window.SCENES = [["A", "reg", { ill: true }], ["B", U.dlat[0][0], { ill: true }], ["C", "turn"], ["D", "leads", { ill: true }], ["E", "weekly"]];
// A
const AF = U.regf.map(([k, v]) => div("A_rows", "rf", `<div class="kk">${esc(k)}</div><div class="vv">${esc(v)}</div>`));
// B: zwölf Monate ab Eintragungsmonat
const MW = 142, X0 = 118;
const months = []; for (let i = 0; i < 12; i++) { const d = new Date(Date.UTC(2026, 8 + i, 1));
  months.push(div("B_strip", "mo", `<b>${new Intl.DateTimeFormat(U.locale, { month: "short", timeZone: "UTC" }).format(d).replace(".", "")}</b><small>${d.getUTCFullYear()}</small>`)); }
const pins = U.dl.map(([ic, a, b, pos], i) => {
  const x = X0 + pos * MW + 64, up = i % 2 === 0;
  const stem = div("B_pins", "stem", "", { left: (x - 1.5) + "px", top: up ? "420px" : "710px", height: "140px" });
  if (!up) stem.style.background = "linear-gradient(0deg,#E2C894,rgba(216,189,138,.1))";
  const c = div("B_pins", "dl", `<div class="ic">${ico(ic, 36, "#0b1428", 2)}</div><div><div class="a">${esc(a)}</div><div class="b">${esc(b)}</div></div>`);
  const [id, f] = U.dlat[i];
  return { x, up, stem, c, t0: at(id, f), pos };
});
// C: Kanzlei in der Mitte, Fristen als Umlauf, Jahre darunter
const HC = { x: 960, y: 410 };
const hubGlow = mk("C_svg", "circle", { cx: HC.x, cy: HC.y, r: 170, fill: "rgba(216,189,138,.10)" });
const orbit = mk("C_svg", "circle", { cx: HC.x, cy: HC.y, r: 225, fill: "none", stroke: "#27406b", "stroke-width": 2, "stroke-dasharray": "6 12" });
const hub = mk("C_svg", "circle", { cx: HC.x, cy: HC.y, r: 110, fill: "url(#cg)" });
mk("C_svg", "defs").innerHTML = `<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2C894"/><stop offset="1" stop-color="#B8914F"/></linearGradient>`;
const hubIc = icoG("C_svg", "calc", HC.x, HC.y, 96, "#0b1428", 1.7);
const sats = U.dl.map(([ic], i) => { const g = mk("C_svg", "g"); const c = mk(g, "circle", { r: 46, fill: "#142848", stroke: "#D8BD8A", "stroke-width": 3 }); const ln = mk("C_svg", "line", { stroke: "#B8914F", "stroke-width": 2.5, "stroke-dasharray": "5 8" }); icoG(g, ic, 0, 0, 44); return { g, ln, i }; });
const yrs = [0, 1, 2, 3, 4].map(i => div("C_yrs", "yr", `${esc(U.yearw)} ${i + 1}`, { left: (960 - 2.5 * 190 + i * 190 + 10) + "px" }));
// D: Zeilen und Details
const rows = [div("D_rows", "lr h", U.cols.map(c => `<span>${esc(c)}</span>`).join(""))].concat(U.rows.map((r, i) => div("D_rows", "lr", (i === 0 ? `<i class="hl"></i>` : "") + r.slice(0, 3).map(c => `<span>${esc(c)}</span>`).join(""))));
const DF = [["user", U.f[0], U.director], ["phone", U.f[1], U.phone], ["mail", U.f[2], U.email], ["globe", U.f[3], U.web], ["link", U.f[4], U.srcdate]];
const dfs = DF.map(([ic, k, v]) => div("D_fields", "df", `<div class="ic">${ico(ic, 28, "#E2C894")}</div><div style="min-width:0"><div class="kk">${esc(k)}</div><div class="vv">${esc(v)}</div></div>`));
// E
const wd = U.week.map((d, i) => div("E_week", "wk", esc(d)));
for (let i = 0; i < 18; i++) div("E_grid", "", "", { height: "34px", borderRadius: "4px", background: i < 3 ? "#e3d2ad" : "#ddd2bd" });
// Muster: Linien des Kassenbuchs
window.film = t => {
  $("pat").style.transform = `translateY(${-(t * 14) % 64}px)`;
  // A: Blatt kippt herein, Felder erscheinen, Stempel
  const a0 = L.reg.start - .3, ad = L.reg.end - a0;
  const dk = eo5(p(t, a0 - .1, 1.2));
  st("A_doc", { opacity: cl(dk * 1.5), transform: `perspective(1600px) rotateX(${(1 - dk) * 38}deg) translateY(${(1 - dk) * 120}px) rotate(${-1.5 * dk}deg)` });
  AF.forEach((r, i) => reveal(r, p(t, a0 + .5 + i * .22, .5), 0, -24));
  const sAt = a0 + Math.min(ad * .55, 2.6), sk = p(t, sAt, .28);
  st("A_stamp", { opacity: sk > 0 ? 1 : 0, transform: `scale(${lerp(2.4, 1, eio(sk))}) rotate(${lerp(-30, -12, eio(sk))}deg)` });
  const hit = p(t, sAt + .28, .35); if (hit > 0 && hit < 1) st("A_doc", { transform: $("A_doc").style.transform + ` translateY(${Math.sin(hit * 20) * 6 * (1 - hit)}px)` });
  $("A_stamp").style.boxShadow = hit > 0 ? `0 0 0 ${hit * 60}px rgba(216,189,138,${.25 * (1 - hit)})` : "none";
  // B: Leiste fährt aus der Tiefe herein, Fortschritt läuft, Fristen leuchten auf
  const b0 = pins[0].t0 - .6, bEnd = L.turn.start - .5;
  const bk = eo5(p(t, b0 - .2, 1.3));
  const lastT = pins[pins.length - 1].t0;
  const prog = cl(lerp(0, 1, eio(p(t, b0, lastT + 1.2 - b0))));
  const pan = lerp(30, -30, eio(p(t, b0 + .3, bEnd - b0 - .3)));
  st("B_world", { transform: `translateX(${pan}px) rotateX(${(1 - bk) * 50 + 14}deg) translateY(${(1 - bk) * 200}px)`, transformOrigin: "960px 640px" });
  $("B_stage").style.perspective = "1600px";
  months.forEach((m, i) => { const k = p(t, b0 - .1 + i * .05, .5); st(m, { opacity: eo(k), transform: `translateY(${(1 - eo(k)) * 40}px)` });
    const lit = X0 + (i + .5) * MW < X0 + prog * 12 * MW; m.style.borderColor = lit ? "rgba(216,189,138,.55)" : ""; });
  st("B_strip", { left: X0 + "px" });
  st("B_prog", { left: X0 + "px", width: (prog * 12 * MW - 14) + "px" });
  pins.forEach(pn => { const k = p(t, pn.t0, .55), kb = back(k);
    pn.stem.style.transform = `scaleY(${eo(p(t, pn.t0 - .1, .4))})`; pn.stem.style.transformOrigin = pn.up ? "50% 100%" : "50% 0";
    const w = pn.c.offsetWidth, h = pn.c.offsetHeight;
    st(pn.c, { left: cl(pn.x - w / 2, 60, 1860 - w) + "px", top: (pn.up ? 420 - h : 850) + "px", opacity: cl(k * 2), transform: `translateY(${(1 - eo(k)) * (pn.up ? 40 : -40)}px) scale(${.6 + .4 * kb})` }); });
  reveal("B_head", p(t, b0, .6), -30);
  // C: Fristen kreisen um die Kanzlei, Jahre leuchten nacheinander
  const c0 = L.turn.start - .4, cd = L.turn.end - c0;
  const hk = back(p(t, c0 + .1, .7)); [hub, hubIc].forEach(e => scaleAt(e, HC.x, HC.y, hk));
  hubGlow.setAttribute("r", 150 + 20 * Math.sin(t * 3) * eo(p(t, c0, 1)));
  orbit.setAttribute("opacity", eo(p(t, c0 + .3, .6))); orbit.setAttribute("stroke-dashoffset", -t * 20);
  sats.forEach(s => { const k = eo(p(t, c0 + .4 + s.i * .18, .8)); const a = -Math.PI / 2 + s.i * Math.PI / 2 + t * .25;
    const x = HC.x + Math.cos(a) * 225 * k + (1 - k) * (s.i - 1.5) * 380, y = HC.y + Math.sin(a) * 225 * k + (1 - k) * 360;
    s.g.setAttribute("transform", `translate(${x} ${y}) scale(${.4 + .6 * k})`); s.g.setAttribute("opacity", cl(k * 2));
    s.ln.setAttribute("x1", HC.x); s.ln.setAttribute("y1", HC.y); s.ln.setAttribute("x2", x); s.ln.setAttribute("y2", y); s.ln.setAttribute("opacity", .6 * k); s.ln.setAttribute("stroke-dashoffset", -t * 30); });
  reveal("C_hubl", p(t, c0 + .6, .6), 20);
  yrs.forEach((y, i) => { const k = p(t, c0 + cd * .5 + i * Math.min(.45, cd * .08), .5); y.style.opacity = .25 + .75 * eo(p(t, c0 + .4 + i * .1, .5));
    const g = eo(k); y.style.background = g > .5 ? "linear-gradient(135deg,#E2C894,#B8914F)" : "#101f3c"; y.style.color = g > .5 ? "#0b1428" : "#9aa6ba";
    y.style.borderColor = g > .5 ? "#E2C894" : "#27406b"; y.style.transform = `scale(${1 + .12 * Math.sin(Math.PI * k)})`; });
  $("C_hubl").style.top = "700px";
  // D: Buch öffnet sich, Zeilen werden eingetragen, erste Zeile markiert, rechts die Details
  const d0 = L.leads.start - .4, dd = L.leads.end - d0;
  const ok = eio(p(t, d0 + .2, 1.1));
  st("D_book", { transform: `translateY(${(1 - eo(p(t, d0 - .2, 1))) * 80}px) rotateX(${(1 - eo(p(t, d0 - .2, 1))) * 20}deg)` });
  st("D_r", { transform: `perspective(2200px) rotateY(${-178 * (1 - ok)}deg)`, opacity: ok > .02 ? 1 : 0 });
  rows.forEach((r, i) => { const k = p(t, d0 + .7 + i * Math.min(.32, dd * .06), .45); st(r, { opacity: eo(k), clipPath: `inset(0 ${100 - 100 * eo(k)}% 0 0)` }); });
  const hl = $("D_rows").querySelector(".hl"); hl.style.transform = `scaleX(${eio(p(t, d0 + dd * .25, .6))})`;
  dfs.forEach((d, i) => reveal(d, p(t, d0 + dd * .3 + i * Math.min(.35, dd * .08), .45), 0, 30));
  // E: Wochentage, Montag leuchtet, Blätter fliegen heraus
  const e0 = L.weekly.start - .4, ed = L.weekly.end - e0;
  wd.forEach((w, i) => { const k = p(t, e0 + i * .07, .5); w.style.opacity = eo(k); w.style.transform = `translateY(${(1 - eo(k)) * -30}px)`;
    if (i === 0) { const g = eo(p(t, e0 + .6, .4)); w.style.background = g > .5 ? "linear-gradient(135deg,#E2C894,#B8914F)" : "#101f3c"; w.style.color = g > .5 ? "#0b1428" : "#51607d"; w.style.transform += ` scale(${1 + .15 * g})`; w.style.boxShadow = `0 0 ${50 * g}px rgba(216,189,138,${.4 * g})`; } });
  [["E_pdf", -1], ["E_xls", 1]].forEach(([id, s], i) => { const k = eo5(p(t, e0 + .9 + i * .25, .9));
    st(id, { left: (960 - 150 + s * lerp(0, 190, k)) + "px", top: lerp(640, 400, k) + "px", opacity: cl(k * 2), transform: `rotate(${s * lerp(0, 6, k)}deg) scale(${lerp(.4, 1, k)})` }); });
  reveal("E_excl", p(t, e0 + ed * .5, .6), 30);
};
</script></body></html>
