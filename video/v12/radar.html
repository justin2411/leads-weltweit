<!doctype html>
<html><head><meta charset="utf-8">
<!-- v12 Premium-Film Webagenturen: "So findet unser Radar Ihren nächsten Kunden".
     A Radar über dem ganzen Land → goldener Treffer (Neugründung, Website lädt nicht, mit Datum)
     B Beleg-Karte (Signal, Datum, Quelle, Website-Prüfung, Abrufdatum, Stempel „geprüft“)
     C Ansprechperson aus dem Register mit Firmenkontakt
     D Wert: nur veröffentlichte Zahlen mit Quelle, Hinweis „kein Versprechen“ (ohne Beispiel-Kennzeichnung, echte Zahlen). -->
<link rel="stylesheet" href="../v5/lib/base.css">
<style>
#pat{background-image:radial-gradient(rgba(140,170,220,.10) 1.5px,transparent 1.6px);background-size:36px 36px}
/* A: Radar */
#rad{position:absolute;left:250px;top:120px;width:840px;height:840px}
#A_area{position:absolute;left:250px;top:62px;width:840px;text-align:center}
#A_scan{position:absolute;left:1180px;top:250px;display:flex;flex-direction:column;gap:22px}
#A_hit{position:absolute;left:1150px;top:560px;width:640px;border-radius:26px;padding:30px 36px;background:linear-gradient(180deg,#152a4c,#0f1d38);border:1px solid rgba(216,189,138,.6);box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 6px rgba(216,189,138,.06)}
#A_hit .co{font-size:36px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
#A_hit .dm{font-size:24px;color:var(--soft);margin-top:6px;font-family:monospace}
#A_hit .row{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
.chip.warn{background:rgba(201,119,46,.16);border-color:rgba(226,160,90,.6);color:#f6dcc0}
#A_line{position:absolute;height:2px;background:linear-gradient(90deg,#E2C894,rgba(226,200,148,.1));transform-origin:0 50%}
/* B: Beleg */
#B_card{position:absolute;left:300px;top:150px;width:1320px;border-radius:28px;padding:38px 50px;background:linear-gradient(180deg,#152a4c,#0f1d38);border:1px solid rgba(216,189,138,.45);box-shadow:0 40px 120px rgba(0,0,0,.5)}
.brow{display:grid;grid-template-columns:330px 1fr;align-items:center;gap:26px;padding:22px 4px;border-top:1px solid #243a62}
.brow .k{font-size:20px}
.brow .v{font-size:32px;font-weight:700;display:flex;align-items:center;gap:16px}
#B_stamp{position:absolute;right:70px;top:120px;width:230px;height:230px;border-radius:50%;border:5px solid rgba(216,189,138,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#E2C894;font-size:30px;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:rgba(11,20,40,.6)}
/* C: Ansprechperson */
#C_card{position:absolute;left:330px;top:170px;width:1260px;border-radius:28px;padding:46px 54px;background:linear-gradient(180deg,#152a4c,#0f1d38);border:1px solid rgba(216,189,138,.45);box-shadow:0 40px 120px rgba(0,0,0,.5)}
#C_top{display:flex;align-items:center;gap:40px;padding-bottom:34px}
#C_av{width:170px;height:170px;border-radius:50%;background:#0b1428;border:2px solid rgba(216,189,138,.6);display:flex;align-items:center;justify-content:center;flex:none}
#C_name{font-size:64px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
#C_role{font-size:30px;color:var(--soft);margin-top:8px;white-space:nowrap}
.crow{display:grid;grid-template-columns:70px 220px 1fr;align-items:center;gap:20px;padding:20px 4px;border-top:1px solid #243a62}
.crow .v{font-size:32px}
/* D: Wert */
#D_hd{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:58px;font-weight:800;letter-spacing:-1.5px}
#D_row{position:absolute;left:200px;right:200px;top:300px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:50px;align-items:stretch}
.vcard{border-radius:28px;padding:44px 46px;background:linear-gradient(180deg,#152a4c,#0f1d38);border:1px solid rgba(216,189,138,.45);box-shadow:0 40px 120px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:22px}
.vcard .t{font-size:30px;font-weight:600;color:#dfe5ef;display:flex;align-items:center;gap:16px;min-height:80px}
.vcard .n{font-size:64px;font-weight:800;letter-spacing:-2px;white-space:nowrap}
.vcard .s{font-size:24px;color:var(--soft);display:flex;align-items:center;gap:10px;margin-top:auto}
#D_note{position:absolute;left:0;right:0;top:790px;text-align:center}
</style></head>
<body>
<!-- A: Radar -->
<div class="scene" id="A">
  <div id="A_area"><span class="chip"><span data-ic="flag" data-s="28"></span><span data-u="area"></span></span></div>
  <svg id="rad" width="840" height="840" viewBox="0 0 840 840"></svg>
  <div id="A_scan"></div>
  <div id="A_line"></div>
  <div id="A_hit">
    <div class="lbl" style="display:flex;align-items:center;gap:12px"><span data-ic="sparkle" data-s="26"></span><span data-u="new"></span></div>
    <div class="co" style="margin-top:14px" data-u="co"></div>
    <div class="dm" id="A_dm"></div>
    <div class="row"><span class="chip" id="A_age" style="font-size:24px;padding:10px 20px"><span data-ic="cal" data-s="24"></span><span data-u="age"></span></span>
      <span class="chip warn" id="A_web" style="font-size:24px;padding:10px 20px"><span data-ic="noweb" data-s="24" data-c="#E2A05A"></span><span data-u="web"></span></span></div>
  </div>
</div>
<!-- B: Beleg -->
<div class="scene" id="B">
  <div id="B_card"><div style="display:flex;align-items:center;gap:12px;padding-bottom:22px" class="lbl"><span data-ic="file" data-s="28"></span><span data-u="proofhd"></span></div>
    <div id="B_rows"></div></div>
  <div id="B_stamp"><span data-ic="shieldc" data-s="64"></span><span data-u="proofok"></span></div>
</div>
<!-- C: Ansprechperson -->
<div class="scene" id="C">
  <div id="C_card">
    <div class="lbl" style="display:flex;align-items:center;gap:12px;padding-bottom:28px"><span data-ic="user" data-s="28"></span><span data-u="personhd"></span></div>
    <div id="C_top"><div id="C_av"><span data-ic="user" data-s="96" data-c="#D8BD8A"></span></div>
      <div><div id="C_name" data-u="person"></div><div id="C_role" data-u="role"></div></div></div>
    <div id="C_rows"></div>
  </div>
</div>
<!-- D: Wert -->
<div class="scene" id="D">
  <div id="D_hd" data-u="valuehd"></div>
  <div id="D_row"></div>
  <div id="D_note"><span class="chip" style="font-size:30px;padding:16px 32px"><span data-ic="scale" data-s="30"></span><span data-u="note"></span></span></div>
</div>
<script src="../v5/lib/lib.js"></script>
<script>
window.SCENES = [["A", "radar", { ill: true }], ["B", "proof", { ill: true }], ["C", "person", { ill: true }], ["D", "value", {}]];
// Radar: Ringe, Fadenkreuz, Strahl, Punkte (Firmen), ein goldener Treffer
const R = $("rad"), CX = 420, CY = 420, RR = 400;
[1, .75, .5, .25].forEach(k => mk(R, "circle", { cx: CX, cy: CY, r: RR * k, fill: "none", stroke: "#27406b", "stroke-width": 2 }));
mk(R, "line", { x1: CX - RR, y1: CY, x2: CX + RR, y2: CY, stroke: "#1d3256", "stroke-width": 2 });
mk(R, "line", { x1: CX, y1: CY - RR, x2: CX, y2: CY + RR, stroke: "#1d3256", "stroke-width": 2 });
const defs = mk(R, "defs");
defs.innerHTML = `<radialGradient id="sw" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(${CX} ${CY}) scale(${RR})"><stop offset="0" stop-color="#E2C894" stop-opacity=".0"/><stop offset="1" stop-color="#E2C894" stop-opacity=".28"/></radialGradient>`;
const sweep = mk(R, "path", { d: `M${CX} ${CY} L${CX + RR} ${CY} A${RR} ${RR} 0 0 0 ${CX + RR * Math.cos(-0.7)} ${CY + RR * Math.sin(-0.7)} Z`, fill: "url(#sw)" });
const beam = mk(R, "line", { x1: CX, y1: CY, x2: CX + RR, y2: CY, stroke: "#E2C894", "stroke-width": 3, "stroke-linecap": "round" });
const DOTS = [];
for (let i = 0; i < 46; i++) { const a = rnd() * Math.PI * 2, r = 40 + Math.sqrt(rnd()) * (RR - 60);
  DOTS.push({ a, el: mk(R, "circle", { cx: CX + r * Math.cos(a), cy: CY + r * Math.sin(a), r: 5, fill: "#8fa3c6" }) }); }
const HA = -0.55, HR = 250, HX = CX + HR * Math.cos(HA), HY = CY + HR * Math.sin(HA);
const ring = mk(R, "circle", { cx: HX, cy: HY, r: 14, fill: "none", stroke: "#E2C894", "stroke-width": 3 });
const hit = mk(R, "circle", { cx: HX, cy: HY, r: 11, fill: "#E2C894" });
const SC = U.scan.map((s, i) => div("A_scan", "", `<span class="chip" style="font-size:28px">${ico(["bank", "globe", "clock"][i], 30)}<span>${esc(s)}</span></span>`));
// B: Beleg-Zeilen
const BI = ["sparkle", "cal", "link", "noweb", "check"];
const BR = U.pf.map((k, i) => div("B_rows", "brow", `<div class="k">${esc(k)}</div><div class="v">${ico(BI[i], 32, i === 3 ? "#E2A05A" : "#D8BD8A")}<span>${esc(U.pv[i])}</span></div>`));
// C: Kontakt
const CI = ["phone", "mail", "bank"];
const CR = U.pk.map((k, i) => div("C_rows", "crow", `<div>${ico(CI[i], 34)}</div><div class="k">${esc(k)}</div><div class="v nw">${esc(U.pc[i])}</div>`));
// D: Wert-Karten (nur veröffentlichte Zahlen mit Quelle)
const DV = U.vals.map(([t, n, s, ic]) => div("D_row", "vcard", `<div class="t">${ico(ic, 40)}<span>${esc(t)}</span></div><div class="n gold">${esc(n)}</div><div class="s">${ico("link", 24, "#9aa6ba")}<span>${esc(U.srcl)} ${esc(s)}</span></div>`));

window.film = t => {
  // A: Radar dreht sich, Punkte glimmen beim Überstreichen, Treffer leuchtet gold
  const a0 = L.radar.start - .4, ak = eo5(p(t, a0, 1.2));
  st("rad", { opacity: cl(ak * 1.4), transform: `scale(${lerp(.85, 1, ak)})` });
  reveal("A_area", p(t, a0 + .3, .6), -20);
  const ang = (t - a0) * 1.9;
  const ex = CX + RR * Math.cos(ang), ey = CY + RR * Math.sin(ang);
  beam.setAttribute("x2", ex); beam.setAttribute("y2", ey);
  sweep.setAttribute("transform", `rotate(${ang * 180 / Math.PI} ${CX} ${CY})`);
  DOTS.forEach(d => { let da = ((ang - d.a) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    d.el.setAttribute("opacity", (.25 + .75 * Math.exp(-da * 1.6)).toFixed(3)); });
  SC.forEach((s, i) => reveal(s, p(t, a0 + .6 + i * .35, .5), 0, 40));
  const f0 = L.found.start - .2, hk = p(t, f0, .5);
  hit.setAttribute("opacity", t < f0 ? 0 : 1); hit.setAttribute("r", 11 * back(hk));
  const pulse = t < f0 ? 0 : ((t - f0) % 1.2) / 1.2;
  ring.setAttribute("r", 14 + pulse * 46); ring.setAttribute("opacity", t < f0 ? 0 : (1 - pulse).toFixed(3));
  SC.forEach((s, i) => { s.style.opacity = cl(+s.style.opacity) * (1 - eo(p(t, f0 + .1, .4))); });
  const ck = eo5(p(t, f0 + .5, .8));
  st("A_hit", { opacity: cl(ck * 1.3), transform: `translateX(${(1 - ck) * 60}px) scale(${lerp(.94, 1, ck)})`, top: "330px" });
  // Verbindungslinie vom Treffer zur Karte
  const rb = $("rad").getBoundingClientRect(), s = rb.width / 840, hx = rb.left + HX * s, hy = rb.top + HY * s;
  const cb = $("A_hit").getBoundingClientRect(), tx = cb.left, ty = cb.top + 60;
  const len = Math.hypot(tx - hx, ty - hy) * eio(p(t, f0 + .35, .5));
  st("A_line", { left: hx + "px", top: hy + "px", width: len + "px", transform: `rotate(${Math.atan2(ty - hy, tx - hx)}rad)`, opacity: t < f0 + .35 ? 0 : 1 });
  $("A_dm").textContent = type(U.domain, p(t, f0 + 1.1, 1.0));
  reveal("A_age", p(t, at("found", .35), .5), 20);
  const wk = p(t, at("found", .7), .5); reveal("A_web", wk, 20);
  // B: Zeilen nacheinander, Stempel am Ende
  const b0 = L.proof.start - .4, bd = L.proof.end - b0;
  const bk = eo5(p(t, b0, 1)); st("B_card", { opacity: cl(bk * 1.4), transform: `perspective(2000px) rotateX(${(1 - bk) * 20}deg) translateY(${(1 - bk) * 70}px)` });
  BR.forEach((r, i) => reveal(r, p(t, b0 + .5 + i * Math.min(.6, bd * .14), .45), 0, -30));
  const sk = p(t, at("proof", .72), .45);
  st("B_stamp", { opacity: cl(sk * 2), transform: `rotate(-12deg) scale(${lerp(1.8, 1, eo5(sk))})` });
  // C: Karte, Name, Kontaktzeilen
  const c0 = L.person.start - .4, cd = L.person.end - c0;
  const ccard = eo5(p(t, c0, 1)); st("C_card", { opacity: cl(ccard * 1.4), transform: `translateY(${(1 - ccard) * 70}px)` });
  st("C_av", { transform: `scale(${back(p(t, c0 + .4, .5))})` });
  reveal("C_name", p(t, c0 + .6, .5), 0, -30); reveal("C_role", p(t, c0 + .8, .5), 0, -30);
  CR.forEach((r, i) => reveal(r, p(t, c0 + cd * .45 + i * .35, .45), 20));
  // D: Überschrift, zwei Zahlen, Hinweis
  const d0 = L.value.start - .4, dd = L.value.end - d0;
  reveal("D_hd", p(t, d0, .7), -30);
  DV.forEach((c, i) => { const k = p(t, d0 + dd * (i ? .55 : .25), .6); reveal(c, k, 50); });
  reveal("D_note", p(t, L.note.start - .2, .6), 30);
};
</script></body></html>
