# Kunden-Werk (Inhaber 01.10.2026: „ein Kunden-Werk … was 24/7 läuft bis 100.000 voll ist“, erhöht: „Kundenwerk soll erst bei 1mio Kunden aufhören“).
# Dauerbetrieb, 8 Teile gleichzeitig (läuft parallel zum Lead-Werk; GitHub Pro: 40 Jobs = 30 Lead + 8 Kunden + 2 frei): Käufer der Zielgruppen (Overture-Firmen mit Website, US/UK/FR) auf ihrer Website prüfen
# (Firmen-E-Mail, Rechtsform, Prüfregeln) und in `prospects` speichern. Hört bei 1.000.000 geprüften Käufern auf.
# Sendet NIE Mails (Versand steuert allein config/versand.yaml). Lädt keine Dateien hoch.
# Schalter: config/pipeline.yaml kunden_suche. Jeder Teil hört nach 90 Minuten auf, neue Firmen anzufangen
# (--deadline-min), danach startet sich das Werk selbst neu (Job „weiter“); Cron und Wachhund bleiben als Rückfall.
name: kunden-werk
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
concurrency: { group: kunden-werk, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      an: ${{ steps.gate.outputs.an }}
      monat: ${{ steps.m.outputs.monat }}
    steps:
      - uses: actions/checkout@v4
      - name: Schalter Kunden-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^kunden_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kunden-Suche pausiert (config/pipeline.yaml: kunden_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache@v4
        with:
          path: out/cache/kunden_pool.parquet
          key: kunden-pool-v2-${{ steps.m.outputs.monat }}  # v2: mit IE/NL/BE/SE (Scout-Sprint 01.10.2026)
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-hit != 'true'
        with: { python-version: "3.11" }
      - name: Käufer-Liste aus Overture (einmal im Monat)
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt && python scripts/kundenwerk.py pool

  pruefen:
    needs: pool
    if: needs.pool.outputs.an == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8   # Inhaber 01.10.2026: „kunden auf 7 gleichzeitig“, dann „maximale Effizienz für GitHub Pro“
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_pool.parquet
          key: kunden-pool-v2-${{ needs.pool.outputs.monat }}
          fail-on-cache-miss: true
      # ca. 150 Firmen/min je Teil: --max reicht für das ganze Zeitfenster, das Zeitfenster beendet den Teil
      - name: Käufer prüfen und speichern
        run: python scripts/kundenwerk.py run --shard ${{ matrix.shard }}/8 --max 15000 --workers 16 --deadline-min 90 | tee -a "$GITHUB_STEP_SUMMARY"

  weiter:
    # sofort den nächsten Lauf starten (nur bei Schalter an und echter Laufzeit, sonst Cron/Wachhund)
    needs: [pool, pruefen]
    if: always() && needs.pool.outputs.an == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq '^kunden_suche:\s*true' config/pipeline.yaml || { echo "Schalter aus – kein Neustart"; exit 0; }
          start=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          mins=$(( ( $(date -u +%s) - $(date -u -d "$start" +%s) ) / 60 ))
          if [ "$mins" -lt 30 ]; then echo "Lauf nur $mins Minuten – kein Sofort-Neustart"; exit 0; fi
          gh workflow run kunden-werk.yml --ref "${{ github.ref_name }}"
          echo "Nächster Lauf gestartet (dieser lief $mins Minuten)" | tee -a "$GITHUB_STEP_SUMMARY"
