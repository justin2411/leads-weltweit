# Kunden-Werk (Inhaber 01.10.2026: „ein Kunden-Werk … was 24/7 läuft bis 100.000 voll ist“, erhöht: „Kundenwerk soll erst bei 1mio Kunden aufhören“).
# Dauerbetrieb, 8 Teile gleichzeitig (läuft parallel zum Lead-Werk; GitHub Pro: 40 Jobs = 30 Lead + 8 Kunden + 2 frei): Käufer der Zielgruppen (Overture-Firmen mit Website, US/UK/FR) auf ihrer Website prüfen
# (Firmen-E-Mail, Rechtsform, Prüfregeln) und in `prospects` speichern. Hört bei 1.000.000 geprüften Käufern auf.
# Sendet NIE Mails (Versand steuert allein config/versand.yaml). Lädt keine Dateien hoch.
# Fokus Webagenturen (Inhaber 02.10.2026): S2-Käufer; dazu S1 (Recruiting, Quellen-Scout 02.10.2026), seit die
# S2-Liste durchgeprüft ist (Lauf 06:17: 1 neue Firma).
# Schalter: config/pipeline.yaml kunden_suche. Jeder Teil hört nach 90 Minuten auf, neue Firmen anzufangen
# (--deadline-min), danach startet sich das Werk selbst neu (Job „weiter“); Cron und Wachhund bleiben als Rückfall.
# Actions-Drossel (Inhaber 06.10.2026: „fahr github actions erstmal runter“): 2× täglich, Gruppe „werke“, Teile
# höchstens 2 gleichzeitig (höchstens 5 laut Plan), Nebenjobs nacheinander danach, kein Selbst-Neustart, kein Anstoßen
# von Wachhund/Nachfüller/Käufer-Liste (kunden-pool.yml läuft monatlich selbst).
name: kunden-werk
on:
  schedule:
    - cron: "41 3,21 * * *"   # Drossel 06.10.2026: 2× täglich (vorher alle 2 h + Selbst-Neustart)
  workflow_dispatch:
    inputs:
      teile:
        description: "Puffer vom Nachfüller (Mindestbelegung 30), z. B. kunden:12 – nur mehr Teile, nie über max"
        required: false
        default: ""
concurrency: { group: werke, cancel-in-progress: false }   # Drossel: ein schweres Werk zur Zeit
permissions:
  contents: read
jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # France-Num-Seiten: bis 50 min (1 Abruf/s)
    permissions:
      actions: read
      contents: read
    outputs:
      an: ${{ steps.gate.outputs.an }}
      monat: ${{ steps.m.outputs.monat }}
      pool_key: ${{ steps.key.outputs.pool_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Schalter Kunden-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^kunden_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kunden-Suche pausiert (config/pipeline.yaml: kunden_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Belegung lückenlos (05.10.2026): die Teile warteten bis 60 min mit 1 Job auf den Neubau der Käufer-Liste.
      # Jetzt: gibt es keine Liste dieses Monats, nimmt der Lauf sofort die neueste vorhandene (gleiche Version) und
      # baut die neue im Hintergrund (kunden-pool.yml); nur ganz ohne Liste baut er sie hier selbst.
      - id: cache
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_pool.parquet
          key: kunden-pool-v10-${{ steps.m.outputs.monat }}  # v10: France Num wieder an, Abruf über tabular-api.data.gouv.fr (04.10.2026); v9: Activateurs France Num (04.10.2026); v8: offene Register MX DENUE + FI YTJ (04.10.2026); v7: Namens-Pool auch US/IE (04.10.2026); v6: neue Länder FI/SG/HK/MX/BR (04.10.2026); v5: Namens-Pool Webagenturen UK/FR (04.10.2026); v4: weitere Käufer-Kategorien
          restore-keys: kunden-pool-v10-
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-matched-key == ''
        with: { python-version: "3.11" }
      - name: Käufer-Liste aus Overture (nur wenn gar keine vorhanden ist)
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-matched-key == ''
        run: pip install -r requirements.txt && python scripts/kundenwerk.py pool
      - name: Käufer-Liste sichern
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: out/cache/kunden_pool.parquet
          key: kunden-pool-v10-${{ steps.m.outputs.monat }}
      - name: Käufer-Liste für die Teile
        id: key
        if: steps.gate.outputs.an == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
          EXACT: kunden-pool-v10-${{ steps.m.outputs.monat }}
        run: |
          echo "pool_key=${MATCHED:-$EXACT}" >> "$GITHUB_OUTPUT"
          if [ -n "$MATCHED" ] && [ "$MATCHED" != "$EXACT" ]; then
            # Drossel 06.10.2026: kein Anstoßen mehr – kunden-pool.yml baut monatlich selbst (oder von Hand)
            echo "Käufer-Liste $MATCHED genutzt, $EXACT baut kunden-pool.yml (monatlich/von Hand)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Bekannte Käufer-Domains einmal je Lauf aktualisieren (nur neue seit dem letzten Lauf) und allen Teilen geben:
      # alle ~190.000 in jedem Teil zu laden brach unter Last ab (02.10.2026)
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true' && steps.cache.outputs.cache-matched-key != ''
        with: { python-version: "3.11" }
      - name: Bekannte Käufer laden
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_known.json
          key: kunden-known-${{ github.run_id }}
          restore-keys: kunden-known-
      - name: Bekannte Käufer aktualisieren
        if: steps.gate.outputs.an == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install -q -r requirements.txt
          python scripts/kundenwerk.py known
      - name: Bekannte Käufer sichern
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/save@v4
        with:
          path: out/cache/kunden_known.json
          key: kunden-known-${{ github.run_id }}

  plan:
    # Belegungsplan (Inhaber 03.10.2026): Teile des Kunden-Werks aus dem Leitstand (owner_settings.slot_plan, Linie
    # „kunden“), sonst Standard aus app/lib/werk-linien.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      teile: ${{ steps.p.outputs.teile }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - id: p
        env:
          TEILE: ${{ inputs.teile }}
        run: python scripts/werk_plan.py kunden-werk ${TEILE:+--teile "$TEILE"}

  pruefen:
    needs: [pool, plan]
    if: needs.pool.outputs.an == 'true' && needs.plan.outputs.teile != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # früher fest 8 (Inhaber 01.10.2026: „kunden auf 7 gleichzeitig“, dann „maximale Effizienz für GitHub Pro“);
      # jetzt aus dem Belegungsplan (Job plan)
      max-parallel: 2   # Drossel 06.10.2026 (vorher 16)
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_pool.parquet
          key: ${{ needs.pool.outputs.pool_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_known.json
          key: kunden-known-${{ github.run_id }}
      # ca. 150 Firmen/min je Teil: --max reicht für das ganze Zeitfenster, das Zeitfenster beendet den Teil
      - name: Käufer prüfen und speichern
        run: python scripts/kundenwerk.py run --shard ${{ matrix.shard }}/${{ matrix.of }} --max 15000 --workers 16 --deadline-min 90 --segments S2,S1 | tee -a "$GITHUB_STEP_SUMMARY"

  nachpruefen:
    # Quellen-Scout R20 (03.10.2026): „nur Anruf/Brief“-Käufer mit Firmen-E-Mail, die nur an der fehlenden Rechtsform
    # scheitern -> Registernummer auf der eigenen Website (UK Company No., FR SIREN aus den Mentions légales), vom
    # Register bestätigt (Companies House Massendaten / Annuaire des entreprises), dann unveränderte Prüfregel.
    # Test 360 Firmen: S2 UK 16/160, S2 FR 23/100, S1 UK 11/100 neu mail-fähig. Ein Job (2 Plätze frei).
    needs: [pool, pruefen]   # Drossel 06.10.2026: Nebenjobs nacheinander nach den Teilen
    if: ${{ !cancelled() && needs.pool.outputs.an == 'true' }}
    runs-on: ubuntu-latest
    # Betrieb 05.10.2026: Nebenjobs halten den ganzen Lauf (concurrency kunden-werk) – der nächste Lauf wartete
    # über 1 h hinter einem Nachzügler, 13 Plätze leer. Kürzeres Zeitfenster, Rest macht der nächste Lauf
    # (idempotent, gleiche Gruppe -> nie doppelt gleichzeitig)
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # Zuerst ohne Abruf: an der Rechtsform gescheiterte Käufer in Ländern ohne company_forms_only (FR seit
      # 04.10.2026, Einzelunternehmer nach Anwaltsberatung erlaubt) mit unveränderter Prüfregel neu prüfen –
      # idempotent, findet nach dem ersten Lauf nichts mehr. Danach Registernummer nur noch, wo die Rechtsform zählt.
      # 04.10.2026 (JARVIS-Agent „Käufer finden · Mail-Länder“): auch S2 SE/FI (Org.nr/Y-tunnus -> EU VIES, Test SE
      # 4–7 von 100 neu mail-fähig); NL (KVK-Nummer -> KVK Open Dataset, nur BV/NV, 1 Abfrage/min je IP, --kvk-max 75)
      # wirkt erst, wenn NL wieder Mail-Land ist (nur Länder mit allowed + company_forms_only)
      - name: Regeln neu prüfen, dann Registernummer nachprüfen (S2 UK/SE/FI, S1 UK)
        run: python scripts/kundenwerk.py nachpruefen --max 3000 --workers 16 --deadline-min 30 --kvk-max 25 | tee -a "$GITHUB_STEP_SUMMARY"

  fr_webdesign:
    # JARVIS-Auftrag 1e9a203d (04.10.2026, optout-muster-s2: 3 von 17 FR-Käufern ohne Webdesign meldeten sich ab):
    # S2/FR bleibt nur mail-fähig mit Code NAF 6201Z/6202A/7311Z/7410Z (SIRENE) + Webdesign auf der eigenen Website,
    # keine Verkaufs-/Parkseiten. Prüft noch nicht markierte FR/S2-Käufer (Bestand einmal, danach nur Nachzügler),
    # stuft nicht passende auf rejected ab (Grund im check_reason), löscht nichts, sendet nie.
    needs: [pool, nachpruefen]   # Drossel 06.10.2026: nacheinander
    if: ${{ !cancelled() && needs.pool.outputs.an == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40   # Betrieb 05.10.2026: Nachzügler nicht länger als die Teile (Rest im nächsten Lauf)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: FR Webagenturen schärfen (S2)
        run: python scripts/kundenwerk.py fr-webdesign --max 10000 --workers 16 --deadline-min 25 | tee -a "$GITHUB_STEP_SUMMARY"

  uk_register:
    # JARVIS-Agent 2 (06.10.2026): Overture-Pool S2/UK durchgeprüft -> neue Käuferquelle Companies House „Free Company
    # Data Product“ (BasicCompanyData, monatlich, ohne Konto/Schlüssel): aktive Ltd/PLC/LLP mit SIC 62012/63120/74100/
    # 73110. Website nur über Domain-Varianten des Namens mit Beleg auf der Seite (Registernummer/Name/PLZ,
    # lib.websites), robots.txt, 1 Anfrage/s je Domain; Firmen ohne Website frühestens nach 30 Tagen erneut
    # (kunden_ch_seen.json). Nur mit Webdesign-Nachweis auf der Website, dann unveränderte Prüfregel. Sendet nie.
    needs: [pool, fr_webdesign]   # Drossel 06.10.2026: nacheinander
    if: ${{ !cancelled() && needs.pool.outputs.an == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_known.json
          key: kunden-known-${{ github.run_id }}
      # Firmenliste (kompakt, ~20 MB) je Monat; ohne sie lädt der Schritt die Massendaten einmal (~500 MB)
      - id: chlist
        uses: actions/cache/restore@v4
        with:
          path: out/cache/ch_s2
          key: kunden-ch-s2-v1-${{ needs.pool.outputs.monat }}
      - uses: actions/cache/restore@v4
        with:
          path: out/cache/kunden_ch_seen.json
          key: kunden-ch-seen-${{ github.run_id }}
          restore-keys: kunden-ch-seen-
      - name: UK-Käufer aus Companies House prüfen und speichern (S2)
        run: python scripts/kundenwerk.py uk-register --max 6000 --workers 16 --deadline-min 35 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Firmenliste sichern
        if: always() && steps.chlist.outputs.cache-hit != 'true' && hashFiles('out/cache/ch_s2/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: out/cache/ch_s2
          key: kunden-ch-s2-v1-${{ needs.pool.outputs.monat }}
      - name: Versuchte Firmen sichern
        if: always() && hashFiles('out/cache/kunden_ch_seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: out/cache/kunden_ch_seen.json
          key: kunden-ch-seen-${{ github.run_id }}
