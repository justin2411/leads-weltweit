          # (Overture mit Website: NL 565.448, BE 324.377, SE 264.896, IE 97.337; Test 895 Seiten -> 70 grün:
          # NL 18/150, BE 14/150, SE 22/298, IE 16/297). Je Land 2.500 je Teil und Lauf, damit alle vier Länder drankommen
          # Quellen-Scout S1 (Inhaber 02.10.2026: „recruiting kunden und leads … darauf fokussieren“): US-Arbeitgeber mit
