# Lead-Werk (Inhaber 01.10.2026: „eigener Bereich der 24/7 die leads holt und anreichert“).
# Fokus Webagenturen (Inhaber 02.10.2026: „erstmal auf Webagenturen fokussieren … massenweise“): 8 Teile S2
# Website-Prüfung (US 5, UK 2, FR 2: unsichere, nicht handytaugliche, veraltete oder kaputte Websites), 21 Teile S2
# ohne Website (US 18, IE/NL/BE/SE 1), 1 Teil S1 US (DOL LCA), 1 Teil S1 UK (Find a Tender, Quellen-Scout). Dauerbetrieb, eine Welle: kostenlose Quellen -> Sicherheitsfilter -> kostenlose Anreicherung -> Qualitäts- und
# Signalkontrolle -> grüne Leads direkt in Supabase (watch_companies, observations, leads). Schon gespeicherte
# Firmen werden übersprungen, so arbeitet sich jeder Lauf weiter durch den Bestand.
# Lädt KEINE Lead-Dateien hoch (öffentliches Repo) – nur den Zählbericht. Sendet nichts.
# Schalter: config/pipeline.yaml lead_suche. robots.txt, höchstens 1 Abruf/s je Domain, keine gesperrten Plattformen.
# GitHub Pro voll nutzen (Inhaber 01.10.2026: „maximale Effizienz für GitHub Pro“): 40 Jobs gleichzeitig = 30 Lead-Werk
# + 8 Kunden-Werk + 2 frei für Tagesablauf/Tagescheck/Wachhund. Jeder Teil hört nach 75 Minuten auf, neue Firmen
# anzufangen, und speichert (--deadline-min), damit kein Nachzügler die übrigen Plätze blockiert; danach startet sich
# das Werk selbst neu (Job „weiter“). Cron und Wachhund bleiben als Rückfall.
name: lead-werk
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
concurrency: { group: lead-werk, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  us-auszug:
    # US-Auszug (Overture, Firmen ohne Website, ~250 MB) einmal im Monat bauen und allen US-Teilen geben
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      monat: ${{ steps.m.outputs.monat }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ steps.m.outputs.monat }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: US-Auszug bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US)"
      - id: web
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web2-${{ steps.m.outputs.monat }}
      - name: US-Auszug mit Website bauen (Website-Prüfung S2, je Monat die andere Hälfte)
        if: steps.web.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt er, baut ihn jeder Teil web-us-* selbst
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US_WEB)"
      - id: lca
        uses: actions/cache@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ steps.m.outputs.monat }}
      - name: DOL-LCA-Auszug bauen (S1 US, neueste Quartalsdatei, ~250 MB -> kleine JSON)
        if: steps.lca.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt die Datei, läuft nur der S1-Teil leer, die S2-Teile nicht
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import us_dol_lca as l; l.build()"

  holen:
    needs: us-auszug
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      # 30 Teile, alle gleichzeitig (Inhaber 01.10.2026: „Erhöhe die lead läufe auf 30“, GitHub Pro: 40 Jobs
      # gleichzeitig; 8 für das Kunden-Werk, 2 frei). --shard verteilt fest nach Quell-ID.
      # Zwischendurch 25 (Inhaber 02.10.2026: „senke nur auf 25“, Supabase Disk-IO); wieder 30 (Inhaber 02.10.2026
      # abends: „Mach 30“): bei 25 warteten 5 Teile, ein Durchgang dauerte ~2,5 h statt ~80 min. 30 + 8 Kunden-Werk = 38.
      max-parallel: 30
      matrix:
        include:
          # Website-Prüfung S2 im großen Stil (Inhaber 02.10.2026: „mach das jetzt bitte im ganz großen stil und hol viele
          # leads rein“): 26 Teile (seit R16) mit je 40 gleichzeitigen Abrufen (verschiedene Domains, je Domain weiter 1/s, robots.txt).
          # Zuerst in der Liste, damit sie immer sofort starten. Plätze von S2 ohne Website in FR (3 -> 1),
          # UK (1 -> 0) und IE/NL/BE/SE (4 -> 1 gemeinsamer Teil): dort liegen schon ~130.000 Leads bei wenigen Käufern.
          - { name: web-us-0, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/16" }
          - { name: web-us-1, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/16" }
          - { name: web-us-2, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 2/16" }
          - { name: web-us-3, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 3/16" }
          - { name: web-us-4, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 4/16" }
          - { name: web-us-5, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 5/16" }
          - { name: web-us-6, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 6/16" }
          - { name: web-us-7, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 7/16" }
          - { name: web-us-8, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 8/16" }
          - { name: web-us-9, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 9/16" }
          - { name: web-us-10, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 10/16" }
          - { name: web-us-11, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 11/16" }
          - { name: web-us-12, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 12/16" }
          - { name: web-us-13, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 13/16" }
          - { name: web-us-14, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 14/16" }
          - { name: web-us-15, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 15/16" }
          - { name: web-uk-0, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/5" }
          - { name: web-uk-1, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/5" }
          - { name: web-uk-2, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 2/5" }
          - { name: web-uk-3, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 3/5" }
          - { name: web-uk-4, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 4/5" }
          - { name: web-fr-0, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/5" }
          - { name: web-fr-1, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/5" }
          - { name: web-fr-2, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 2/5" }
          - { name: web-fr-3, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 3/5" }
          - { name: web-fr-4, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 4/5" }
          # Quellen-Scout S1 (Inhaber 02.10.2026: „recruiting kunden und leads … darauf fokussieren“): US-Arbeitgeber mit
          # Fachkräfte-Bedarf aus den DOL-LCA-Daten, Test 50 -> 26 grün
          - { name: s1-us-lca, args: "--segments S1 --countries US --fmcsa-days 0 --formd-days 0 --s1-probe 0 --lca --per 4000 --max-tries 4000" }
          # S2 ohne Website: IE/NL/BE/SE ruht seit R16 (03.10.2026: 0 grüne je Lauf, BE nur noch ohne E-Mail, IE/NL leer,
          # schrieb nur Rohbestand). FR ruht seit R15 (Platz an s1-uk-tender). UK ohne Website ruht (Lauf 19: 5 grüne aus 3.792)
          # Quellen-Scout R15 (02.10.2026): S1 UK aus Find a Tender (KMU mit gewonnenem öffentlichem Auftrag, OGL v3),
          # Test 300 -> 82 grün. Platz von s2-fr-0 (S2 FR ohne Website: ~47.500 Leads im Bestand, FR-Website-Prüfung
          # läuft weiter mit 2 Teilen). Schnittstelle und Companies-House-Daten höchstens einmal am Tag (Zwischenspeicher)
          - { name: s1-uk-tender, workers: 32, args: "--segments S1 --countries UK --s1-probe 0 --tender-days 45 --tender-pages 25 --cf-pages 25 --per 4000 --max-tries 4000" }
          # Fokus Webagenturen (Inhaber 02.10.2026): US-Firmen ohne Website aus Overture, ~390.000 mit E-Mail, Test 95 % grün.
          # Scout R16 (03.10.2026): Vorrat abgearbeitet (je Teil 1 Kandidat, 0 grün; S2 US 257.755 Leads) -> 18 -> 2 Teile
          # für Neuzugänge im Monatsauszug; die 16 Plätze und der von s2-north-0 gehen an die Website-Prüfung (US 5 -> 16, UK 2 -> 5,
          # FR 2 -> 5); US-S2 hat damit 18 statt 23 Teile, aber alle mit Ertrag
          - { name: s2-us-0, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 0/2" }
          - { name: s2-us-1, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 1/2" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true'
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.an == 'true'
      - name: Monat (für Cache-Schlüssel)
        id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Zwischenspeicher laden (Overture-Auszug, Form-D-Meldungen, Karriereseiten-Beobachtung)
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/cache/overture_gb_fr.parquet
            out/cache/overture_ie_nl_be_se.parquet
            out/cache/formd
            out/cache/careers_seen.json
            out/cache/wdc_job_domains.csv
            out/cache/find_tender.json
            out/cache/find_tender_ch.json
            out/cache/contracts_finder.json
          key: lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-${{ github.run_id }}
          restore-keys: |
            lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-
            lead-werk-${{ startsWith(matrix.name, 'web-uk') && 's2-uk-0' || startsWith(matrix.name, 'web-fr') && 's2-fr-0' || matrix.name == 's2-north-0' && 's2-ie-0' || matrix.name }}-${{ steps.m.outputs.monat }}-
      # Gedächtnis der Website-Prüfung (geprüfte Firmen, 120 Tage): das ALLER Teile desselben Landes laden, damit eine
      # geänderte Aufteilung keine Seite am selben Tag erneut abruft (je Teil gesichert, hier nacheinander geholt)
      - name: Gedächtnis der Website-Prüfung – Land bestimmen
        id: wc
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: echo "land=${MATRIX_NAME%-*}" >> "$GITHUB_OUTPUT"
        env: { MATRIX_NAME: "${{ matrix.name }}" }
      - name: Gedächtnis der Website-Prüfung laden (Teil 0)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ steps.wc.outputs.land }}-0-none
          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-0-
      - name: Gedächtnis Teil 0 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_0.json || true'
      - name: Gedächtnis der Website-Prüfung laden (Teil 1)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ steps.wc.outputs.land }}-1-none
          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-1-
      - name: Gedächtnis Teil 1 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_1.json || true'
