# Lead-Werk (Inhaber 01.10.2026: „eigener Bereich der 24/7 die leads holt und anreichert“).
# Fokus Webagenturen (Inhaber 02.10.2026: „erstmal auf Webagenturen fokussieren … massenweise“): 8 Teile S2
# Website-Prüfung (US 4, UK 2, FR 2: unsichere, nicht handytaugliche, veraltete oder kaputte Websites), 21 Teile S2
# ohne Website (US 18, FR, UK, IE/NL/BE/SE je 1), 1 Teil S1 US (DOL LCA, Quellen-Scout). Dauerbetrieb, eine Welle: kostenlose Quellen -> Sicherheitsfilter -> kostenlose Anreicherung -> Qualitäts- und
# Signalkontrolle -> grüne Leads direkt in Supabase (watch_companies, observations, leads). Schon gespeicherte
# Firmen werden übersprungen, so arbeitet sich jeder Lauf weiter durch den Bestand.
# Lädt KEINE Lead-Dateien hoch (öffentliches Repo) – nur den Zählbericht. Sendet nichts.
# Schalter: config/pipeline.yaml lead_suche. robots.txt, höchstens 1 Abruf/s je Domain, keine gesperrten Plattformen.
# GitHub Pro voll nutzen (Inhaber 01.10.2026: „maximale Effizienz für GitHub Pro“): 40 Jobs gleichzeitig = 30 Lead-Werk
# + 8 Kunden-Werk + 2 frei für Tagesablauf/Tagescheck/Wachhund. Jeder Teil hört nach 75 Minuten auf, neue Firmen
# anzufangen, und speichert (--deadline-min), damit kein Nachzügler die übrigen Plätze blockiert; danach startet sich
# das Werk selbst neu (Job „weiter“). Cron und Wachhund bleiben als Rückfall.
name: lead-werk
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
concurrency: { group: lead-werk, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  us-auszug:
    # US-Auszug (Overture, Firmen ohne Website, ~250 MB) einmal im Monat bauen und allen US-Teilen geben
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      monat: ${{ steps.m.outputs.monat }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ steps.m.outputs.monat }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: US-Auszug bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US)"
      - id: web
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web2-${{ steps.m.outputs.monat }}
      - name: US-Auszug mit Website bauen (Website-Prüfung S2, je Monat die andere Hälfte)
        if: steps.web.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt er, baut ihn jeder Teil web-us-* selbst
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US_WEB)"
      - id: lca
        uses: actions/cache@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ steps.m.outputs.monat }}
      - name: DOL-LCA-Auszug bauen (S1 US, neueste Quartalsdatei, ~250 MB -> kleine JSON)
        if: steps.lca.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt die Datei, läuft nur der S1-Teil leer, die S2-Teile nicht
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import us_dol_lca as l; l.build()"

  holen:
    needs: us-auszug
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      # 30 Teile, alle gleichzeitig (Inhaber 01.10.2026: „Erhöhe die lead läufe auf 30“, GitHub Pro: 40 Jobs
      # gleichzeitig; 8 für das Kunden-Werk, 2 frei). --shard verteilt fest nach Quell-ID.
      # 25 gleichzeitig (Inhaber 02.10.2026: „senke nur auf 25“, nach Supabase-Warnung Disk-IO-Budget);
      # alle 30 Teile laufen weiter, 5 starten, sobald Plätze frei werden.
      max-parallel: 25
      matrix:
        include:
          # Website-Prüfung S2 im großen Stil (Inhaber 02.10.2026: „mach das jetzt bitte im ganz großen stil und hol viele
          # leads rein“): 8 Teile mit je 40 gleichzeitigen Abrufen (verschiedene Domains, je Domain weiter 1/s, robots.txt).
          # Zuerst in der Liste, damit sie bei max-parallel 25 sofort starten. Plätze von S2 ohne Website in FR (3 -> 1),
          # UK und IE/NL/BE/SE (4 -> 1 gemeinsamer Teil): dort liegen schon ~130.000 Leads bei wenigen Käufern.
          - { name: web-us-0, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/4" }
          - { name: web-us-1, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/4" }
          - { name: web-us-2, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 2/4" }
          - { name: web-us-3, workers: 40, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 3/4" }
          - { name: web-uk-0, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/2" }
          - { name: web-uk-1, workers: 40, args: "--segments S2 --countries UK --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/2" }
          - { name: web-fr-0, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 0/2" }
          - { name: web-fr-1, workers: 40, args: "--segments S2 --countries FR --web-check --s2-limit 60000 --per 60000 --max-tries 60000 --shard 1/2" }
          # Quellen-Scout S1 (Inhaber 02.10.2026: „recruiting kunden und leads … darauf fokussieren“): US-Arbeitgeber mit
          # Fachkräfte-Bedarf aus den DOL-LCA-Daten, Test 50 -> 26 grün
          - { name: s1-us-lca, args: "--segments S1 --countries US --fmcsa-days 0 --formd-days 0 --s1-probe 0 --lca --per 4000 --max-tries 4000" }
          # S2 ohne Website: FR, UK und IE/NL/BE/SE je ein Teil (laufen weiter, nur mit weniger Plätzen)
          - { name: s2-fr-0, args: "--segments S2 --countries FR --s2-limit 32000 --per 4000 --max-tries 4000" }
          - { name: s2-uk-0, args: "--segments S2 --countries UK --s2-limit 32000 --per 4000 --max-tries 4000" }
          - { name: s2-north-0, args: "--segments S2 --countries IE,NL,BE,SE --s2-limit 20000 --per 4000 --max-tries 4000" }
          # Fokus Webagenturen (Inhaber 02.10.2026): US-Firmen ohne Website aus Overture, ~390.000 mit E-Mail, Test 95 % grün
          - { name: s2-us-0, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 0/18" }
          - { name: s2-us-1, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 1/18" }
          - { name: s2-us-2, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 2/18" }
          - { name: s2-us-3, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 3/18" }
          - { name: s2-us-4, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 4/18" }
          - { name: s2-us-5, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 5/18" }
          - { name: s2-us-6, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 6/18" }
          - { name: s2-us-7, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 7/18" }
          - { name: s2-us-8, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 8/18" }
          - { name: s2-us-9, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 9/18" }
          - { name: s2-us-10, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 10/18" }
          - { name: s2-us-11, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 11/18" }
          - { name: s2-us-12, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 12/18" }
          - { name: s2-us-13, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 13/18" }
          - { name: s2-us-14, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 14/18" }
          - { name: s2-us-15, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 15/18" }
          - { name: s2-us-16, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 16/18" }
          - { name: s2-us-17, args: "--segments S2 --countries US --fmcsa-days 0 --formd-days 0 --us-overture --s2-limit 400000 --per 20000 --max-tries 20000 --shard 17/18" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true'
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.an == 'true'
      - name: Monat (für Cache-Schlüssel)
        id: m
        run: echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Zwischenspeicher laden (Overture-Auszug, Form-D-Meldungen, Karriereseiten-Beobachtung)
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/cache/overture_gb_fr.parquet
            out/cache/overture_ie_nl_be_se.parquet
            out/cache/formd
            out/cache/careers_seen.json
            out/cache/wdc_job_domains.csv
          key: lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-${{ github.run_id }}
          restore-keys: |
            lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-
            lead-werk-${{ startsWith(matrix.name, 'web-uk') && 's2-uk-0' || startsWith(matrix.name, 'web-fr') && 's2-fr-0' || matrix.name == 's2-north-0' && 's2-ie-0' || matrix.name }}-${{ steps.m.outputs.monat }}-
      - name: Gedächtnis der Website-Prüfung laden (geprüfte Firmen, 120 Tage)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            webcheck-${{ matrix.name }}-
      - name: US-Auszug laden
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 's2-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ needs.us-auszug.outputs.monat }}
      - name: US-Auszug mit Website laden (Website-Prüfung)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web2-${{ needs.us-auszug.outputs.monat }}
      - name: DOL-LCA-Auszug laden
        if: steps.gate.outputs.an == 'true' && matrix.name == 's1-us-lca'
        uses: actions/cache/restore@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ needs.us-auszug.outputs.monat }}
          fail-on-cache-miss: true  # fehlt der Auszug, ist der Teil rot statt still leer (Scout 02.10.2026)
      - name: Leads holen, prüfen, speichern
        if: steps.gate.outputs.an == 'true'
        run: python scripts/extraktor/run.py ${{ matrix.args }} --workers ${{ matrix.workers || 16 }} --db --store --out out/lead-werk --deadline-min 75
      - name: Zwischenspeicher sichern
        if: always() && steps.gate.outputs.an == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/cache/overture_gb_fr.parquet
            out/cache/overture_ie_nl_be_se.parquet
            out/cache/formd
            out/cache/careers_seen.json
            out/cache/wdc_job_domains.csv
          key: lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-${{ github.run_id }}
      - name: Gedächtnis der Website-Prüfung sichern
        if: always() && steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/save@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ matrix.name }}-${{ github.run_id }}
      - name: Zusammenfassung (nur Zahlen)
        if: always() && steps.gate.outputs.an == 'true'
        run: |
          [ -f out/lead-werk/bericht.json ] && python -c "
          import json; r=json.load(open('out/lead-werk/bericht.json'))
          print('| ${{ matrix.name }} | Vorrat | bearbeitet | grün | gelb | rot |'); print('|---|---|---|---|---|---|')
          for s,v in r['segments'].items(): print(f\"| {s} | {v['pool']} | {v['processed']} | {v.get('green',0)} | {v.get('yellow',0)} | {v.get('red',0)} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.an == 'true'
        with:
          name: lead-werk-bericht-${{ matrix.name }}
          path: out/lead-werk/bericht.json
          retention-days: 7

  weiter:
    # sofort den nächsten Lauf starten (nur wenn der Schalter an ist und dieser Lauf echte Arbeit gemacht hat,
    # sonst übernehmen Cron und Wachhund – so entsteht keine Schleife aus Fehlstarts)
    needs: holen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || { echo "Schalter aus – kein Neustart"; exit 0; }
          start=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          mins=$(( ( $(date -u +%s) - $(date -u -d "$start" +%s) ) / 60 ))
          if [ "$mins" -lt 10 ]; then echo "Lauf nur $mins Minuten – kein Sofort-Neustart"; exit 0; fi
          gh workflow run lead-werk.yml --ref "${{ github.ref_name }}"
          echo "Nächster Lauf gestartet (dieser lief $mins Minuten)" | tee -a "$GITHUB_STEP_SUMMARY"
