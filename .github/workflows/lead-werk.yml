          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-13-
      - name: Gedächtnis Teil 13 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_13.json || true'
      - name: Gedächtnis der Website-Prüfung laden (Teil 14)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ steps.wc.outputs.land }}-14-none
          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-14-
      - name: Gedächtnis Teil 14 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_14.json || true'
      - name: Gedächtnis der Website-Prüfung laden (Teil 15)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ steps.wc.outputs.land }}-15-none
          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-15-
      - name: Gedächtnis Teil 15 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_15.json || true'
      - name: US-Auszug laden
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 's2-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ needs.us-auszug.outputs.monat }}
      - name: US-Auszug mit Website laden (Website-Prüfung)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web2-${{ needs.us-auszug.outputs.monat }}
      - name: DOL-LCA-Auszug laden
        if: steps.gate.outputs.an == 'true' && matrix.name == 's1-us-lca'
        uses: actions/cache/restore@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ needs.us-auszug.outputs.monat }}
          fail-on-cache-miss: true  # fehlt der Auszug, ist der Teil rot statt still leer (Scout 02.10.2026)
      - name: Leads holen, prüfen, speichern
        if: steps.gate.outputs.an == 'true'
        run: python scripts/extraktor/run.py ${{ matrix.args }} --workers ${{ matrix.workers || 16 }} --db --store --out out/lead-werk --deadline-min 75
      - name: Zwischenspeicher sichern
        if: always() && steps.gate.outputs.an == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/cache/overture_gb_fr.parquet
            out/cache/overture_ie_nl_be_se.parquet
            out/cache/formd
            out/cache/careers_seen.json
            out/cache/wdc_job_domains.csv
            out/cache/find_tender.json
            out/cache/find_tender_ch.json
            out/cache/contracts_finder.json
          key: lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-${{ github.run_id }}
      - name: Gedächtnis der Website-Prüfung sichern
        if: always() && steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/save@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ matrix.name }}-${{ github.run_id }}
      - name: Zusammenfassung (nur Zahlen)
        if: always() && steps.gate.outputs.an == 'true'
        run: |
          [ -f out/lead-werk/bericht.json ] && python -c "
          import json; r=json.load(open('out/lead-werk/bericht.json'))
          print('| ${{ matrix.name }} | Vorrat | bearbeitet | grün | gelb | rot |'); print('|---|---|---|---|---|---|')
          for s,v in r['segments'].items(): print(f\"| {s} | {v['pool']} | {v['processed']} | {v.get('green',0)} | {v.get('yellow',0)} | {v.get('red',0)} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.an == 'true'
        with:
          name: lead-werk-bericht-${{ matrix.name }}
          path: out/lead-werk/bericht.json
          retention-days: 7

  weiter:
    # sofort den nächsten Lauf starten (nur wenn der Schalter an ist und dieser Lauf echte Arbeit gemacht hat,
    # sonst übernehmen Cron und Wachhund – so entsteht keine Schleife aus Fehlstarts)
    needs: holen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || { echo "Schalter aus – kein Neustart"; exit 0; }
          start=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          mins=$(( ( $(date -u +%s) - $(date -u -d "$start" +%s) ) / 60 ))
          if [ "$mins" -lt 10 ]; then echo "Lauf nur $mins Minuten – kein Sofort-Neustart"; exit 0; fi
          gh workflow run lead-werk.yml --ref "${{ github.ref_name }}"
          echo "Nächster Lauf gestartet (dieser lief $mins Minuten)" | tee -a "$GITHUB_STEP_SUMMARY"
