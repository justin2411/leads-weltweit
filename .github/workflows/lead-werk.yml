      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - id: p
        # --github: Linien, die ein anderer aktiver Lauf belegt, auslassen; --teile: nur die Linien des Nachfüllers
