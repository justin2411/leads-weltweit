        uses: actions/cache/restore@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ steps.wc.outputs.land }}-20-none
          restore-keys: |
            webcheck-${{ steps.wc.outputs.land }}-20-
      - name: Gedächtnis Teil 20 ablegen
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        run: '[ -f out/cache/webcheck_seen.json ] && mv out/cache/webcheck_seen.json out/cache/webcheck_seen_20.json || true'
      - name: US-Auszug laden
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 's2-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ needs.us-auszug.outputs.release }}
      - name: US-Auszug mit Website laden (Website-Prüfung)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web3-${{ needs.us-auszug.outputs.release }}
      - name: US-Auszug mit Website, zweite Stufe laden (Website-Prüfung, Scout 04.10.2026)
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-us-')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_us_web_zweite.parquet
          key: overture-us-web-zweite-${{ needs.us-auszug.outputs.release }}
      - name: UK/FR-Auszug mit Website ohne Telefon laden (Website-Prüfung, Scout 04.10.2026)
        if: steps.gate.outputs.an == 'true' && (startsWith(matrix.name, 'web-uk-') || startsWith(matrix.name, 'web-fr-'))
        uses: actions/cache/restore@v4
        with:
          path: out/cache/overture_gb_fr_web_ohne_tel.parquet
          key: overture-gbfr-web-ohne-tel-${{ needs.us-auszug.outputs.release }}
      - name: DOL-LCA-Auszug laden
        if: steps.gate.outputs.an == 'true' && startsWith(matrix.name, 's1-us-lca')
        uses: actions/cache/restore@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ needs.us-auszug.outputs.monat }}
          fail-on-cache-miss: true  # fehlt der Auszug, ist der Teil rot statt still leer (Scout 02.10.2026)
      - name: Leads holen, prüfen, speichern
        if: steps.gate.outputs.an == 'true'
        run: python scripts/extraktor/run.py ${{ matrix.args }} --workers ${{ matrix.workers || 16 }} --db --store --out out/lead-werk --deadline-min 75
      - name: Zwischenspeicher sichern
        if: always() && steps.gate.outputs.an == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/cache/overture_gb_fr.parquet
            out/cache/overture_ie_nl_be_se.parquet
            out/cache/overture_fi_sg_hk_mx_br.parquet
            out/cache/overture_fi_sg_web.parquet
            out/cache/formd
            out/cache/careers_seen.json
            out/cache/wdc_job_domains.csv
            out/cache/find_tender.json
            out/cache/find_tender_ch.json
            out/cache/contracts_finder.json
            out/cache/usaspending.json
            out/cache/fr_rge.json
          key: lead-werk-${{ matrix.name }}-${{ steps.m.outputs.monat }}-${{ github.run_id }}
      - name: Gedächtnis der Website-Prüfung sichern
        if: always() && steps.gate.outputs.an == 'true' && startsWith(matrix.name, 'web-')
        uses: actions/cache/save@v4
        with:
          path: out/cache/webcheck_seen.json
          key: webcheck-${{ matrix.name }}-${{ github.run_id }}
      - name: Zusammenfassung (nur Zahlen)
        if: always() && steps.gate.outputs.an == 'true'
        run: |
          [ -f out/lead-werk/bericht.json ] && python -c "
          import json; r=json.load(open('out/lead-werk/bericht.json'))
          print('| ${{ matrix.name }} | Vorrat | bearbeitet | grün | gelb | rot |'); print('|---|---|---|---|---|---|')
          for s,v in r['segments'].items(): print(f\"| {s} | {v['pool']} | {v['processed']} | {v.get('green',0)} | {v.get('yellow',0)} | {v.get('red',0)} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.an == 'true'
        with:
          name: lead-werk-bericht-${{ matrix.name }}
          path: out/lead-werk/bericht.json
          retention-days: 7

  weiter:
    # sofort den nächsten Lauf starten (nur wenn der Schalter an ist und dieser Lauf echte Arbeit gemacht hat,
    # sonst übernehmen Cron und Wachhund – so entsteht keine Schleife aus Fehlstarts)
    needs: holen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wachhund anstoßen, wenn GitHub ihn nicht startet
        # Nachtschicht 04.10.2026: GitHub ließ die geplanten Läufe (Wachhund, Antwort-Assistent) nachts stundenlang
        # aus. Das Lead-Werk startet sich selbst neu und hält so den Wachhund am Leben; der startet dann alles
        # Überfällige nach (Antworten, Kunden-Werk, Proben). Nie Versand – den startet der Wachhund nur in seinen Grenzen.
        # Prüfung 04.10.2026: GitHub-Aufrufe bis zu 3 Versuche (eine 503 ließ den Schritt sonst scheitern).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep 20; done; return 1; }
          last=$(retry gh run list --workflow wachhund.yml --limit 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -n "$last" ]; then
            mins=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          else
            mins=999
          fi
          if [ "$mins" -ge 30 ]; then
            if retry gh workflow run wachhund.yml --ref "${{ github.ref_name }}"; then
              echo "Wachhund angestoßen (letzter Lauf vor $mins min)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Wachhund nicht anstoßbar (GitHub antwortet nicht)"
            fi
          else
            echo "Wachhund lief vor $mins min – nichts zu tun"
          fi
      - name: Nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || { echo "Schalter aus – kein Neustart"; exit 0; }
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep 20; done; return 1; }
          # Prüfung 04.10.2026: bis zu 3 Versuche je GitHub-Aufruf; Startzeit unbekannt -> kein Sofort-Neustart
          # (sonst Kette kurzer Selbststarts bei API-Störung); Cron und Wachhund übernehmen
          start=$(retry gh run view ${{ github.run_id }} --json createdAt -q .createdAt || true)
          if [ -n "$start" ]; then
            mins=$(( ( $(date -u +%s) - $(date -u -d "$start" +%s) ) / 60 ))
          else
            mins=0
          fi
          # Nachfüller (05.10.2026): startet diese und jede andere freie Linie sofort neu (Mindestbelegung 30);
          # kurze Läufe ohne Ertrag ruhen dort 60 min. Nur wenn er nicht startbar ist: alter Weg (ganzer Lauf).
          if retry gh workflow run werk-nachfuellen.yml --ref "${{ github.ref_name }}"; then
            echo "Nachfüller angestoßen (dieser Lauf lief $mins Minuten)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$mins" -lt 10 ]; then echo "Lauf nur $mins Minuten – kein Sofort-Neustart"; exit 0; fi
          retry gh workflow run lead-werk.yml --ref "${{ github.ref_name }}"
          echo "Nächster Lauf gestartet (dieser lief $mins Minuten)" | tee -a "$GITHUB_STEP_SUMMARY"
