# Lead-Werk (Inhaber 01.10.2026: „eigener Bereich der 24/7 die leads holt und anreichert“).
# Fokus Webagenturen (Inhaber 02.10.2026: „erstmal auf Webagenturen fokussieren … massenweise“): 8 Teile S2
# Website-Prüfung (US 5, UK 2, FR 2: unsichere, nicht handytaugliche, veraltete oder kaputte Websites), 21 Teile S2
# ohne Website (US 18, IE/NL/BE/SE 1), 1 Teil S1 US (DOL LCA), 1 Teil S1 UK (Find a Tender, Quellen-Scout). Dauerbetrieb, eine Welle: kostenlose Quellen -> Sicherheitsfilter -> kostenlose Anreicherung -> Qualitäts- und
# Signalkontrolle -> grüne Leads direkt in Supabase (watch_companies, observations, leads). Schon gespeicherte
# Firmen werden übersprungen, so arbeitet sich jeder Lauf weiter durch den Bestand.
# Lädt KEINE Lead-Dateien hoch (öffentliches Repo) – nur den Zählbericht. Sendet nichts.
# Schalter: config/pipeline.yaml lead_suche. robots.txt, höchstens 1 Abruf/s je Domain, keine gesperrten Plattformen.
# GitHub Pro voll nutzen (Inhaber 01.10.2026: „maximale Effizienz für GitHub Pro“): 40 Jobs gleichzeitig = 30 Lead-Werk
# + 8 Kunden-Werk + 2 frei für Tagesablauf/Tagescheck/Wachhund. Jeder Teil hört nach 75 Minuten auf, neue Firmen
# anzufangen, und speichert (--deadline-min), damit kein Nachzügler die übrigen Plätze blockiert; danach startet sich
# das Werk selbst neu (Job „weiter“). Cron und Wachhund bleiben als Rückfall.
# Linien-Läufe (05.10.2026, Inhaber: „mind. 30 gleichzeitig“): der Nachfüller (werk-nachfuellen.yml,
# scripts/werk_belegung.py) startet jede Linie als eigenen Lauf (Eingaben linien/teile) und neu, sobald sie fertig ist –
# fertige Linien warten nicht mehr auf Nachzügler anderer Linien. Ohne Eingabe (Zeitplan, Wachhund, Dashboard) plant
# der Lauf alle Linien wie bisher. Der Plan-Job lässt Linien aus, die ein anderer Lauf belegt (nie doppelt).
name: lead-werk
# Teile-Läufe (05.10.2026, Mindestbelegung 30): jede Linie hat eine feste Aufteilung --shard i/K (K = max der Linie,
# scripts/werk_plan.py lane_k). „· Teile“ im Titel kennzeichnet sie; der Nachfüller startet freie Teile einer laufenden
# Linie als weiteren Lauf (Eingabe shards), der Plan-Job lässt Teile aus, die ein anderer Lauf belegt (nie doppelt).
run-name: ${{ inputs.linien && format('lead-werk · Linie {0} · Teile {1}', inputs.linien, inputs.shards) || 'lead-werk · Teile' }}
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      linien:
        description: "Linien-Lauf: Linie(n), z. B. web-us (leer = alle Linien laut Plan)"
        required: false
        default: ""
      teile:
        description: "Teile je Linie, z. B. web-us:3 (vom Nachfüller)"
        required: false
        default: ""
      shards:
        description: "Teil-Nummern der Linie, z. B. 3,4,5 (feste Aufteilung, vom Nachfüller)"
        required: false
        default: ""
# Linien-Läufe nebeneinander (Doppelbelegung verhindert der Plan-Job), Läufe für alle Linien nacheinander wie bisher
concurrency:
  group: ${{ inputs.linien && format('lead-werk-linie-{0}', github.run_id) || 'lead-werk' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  us-auszug:
    # US-Auszüge (Overture, ohne Website ~250 MB, mit Website ~1 GB) je Overture-Veröffentlichung einmal bauen und allen US-Teilen geben
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      monat: ${{ steps.m.outputs.monat }}
      release: ${{ steps.m.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        # Overture-Veröffentlichung im Schlüssel: eine neue Veröffentlichung (etwa monatlich) baut die US-Auszüge sofort
        # neu statt erst im Folgemonat (Neuzugänge für s2-us-* und web-us-*); ohne Antwort zählt nur der Monat
        run: |
          echo "monat=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          rel=$(curl -fsS --max-time 30 "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" \
                | grep -oE 'release/[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+/' | sort | tail -1 | cut -d/ -f2 || true)
          echo "release=${rel:-$(date -u +%Y-%m)}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_s2.parquet
          key: overture-us-s2-${{ steps.m.outputs.release }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: US-Auszug bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US)"
      - id: web
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_web.parquet
          key: overture-us-web3-${{ steps.m.outputs.release }}
      - name: US-Auszug mit Website bauen (Website-Prüfung S2, ganzer Bestand)
        if: steps.web.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt er, baut ihn jeder Teil web-us-* selbst
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US_WEB)"
      - id: web2
        uses: actions/cache@v4
        with:
          path: out/cache/overture_us_web_zweite.parquet
          key: overture-us-web-zweite-${{ steps.m.outputs.release }}
      - name: US-Auszug mit Website, zweite Stufe bauen (Konfidenz 0,4–0,6 oder ohne Telefon, Scout 04.10.2026)
        if: steps.web2.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt er, baut ihn jeder Teil web-us-* selbst
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_US_WEB2)"
      - id: webtel
        uses: actions/cache@v4
        with:
          path: out/cache/overture_gb_fr_web_ohne_tel.parquet
          key: overture-gbfr-web-ohne-tel-${{ steps.m.outputs.release }}
      - name: UK/FR-Auszug mit Website ohne Telefon bauen (Website-Prüfung S2, Scout 04.10.2026, ~1 min)
        if: steps.webtel.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt er, baut ihn jeder Teil web-uk-*/web-fr-* selbst
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import overture as o; o.build_cache(path=o.CACHE_WEB_NOPHONE)"
      - id: lca
        uses: actions/cache@v4
        with:
          path: out/cache/dol_lca.json
          key: dol-lca-${{ steps.m.outputs.monat }}
      - name: DOL-LCA-Auszug bauen (S1 US, neueste Quartalsdatei, ~250 MB -> kleine JSON)
        if: steps.lca.outputs.cache-hit != 'true'
        continue-on-error: true  # fehlt die Datei, läuft nur der S1-Teil leer, die S2-Teile nicht
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'scripts'); from extraktor.sources import us_dol_lca as l; l.build()"

  uk-psc:
    # Premium-Radar UK (Quellen-Scout 05.10.2026, scripts/lib/uk_psc_radar.py): Eigentümerwechsel laut Companies House
    # (PSC-Snapshot, ≤ 30 Tage) bei UK-S2-Firmen im Bestand + heute bestätigter Website-Zustand -> Premium-Leads.
    # Dazu neue Abfall-Beförderer laut Environment Agency (Quellen-Scout R44, scripts/lib/uk_ea_radar.py, je Tag der
    # letzten 14 Tage genau ein Registerabruf), gleicher Bestand, gleiche Prüfung.
    # Höchstens einmal am Tag (Merker im Zwischenspeicher je Tag, vor dem Abruf gesetzt): jede Registerdatei und jede
    # Startseite höchstens 1×/Tag. Nur im Zeitplan-Lauf (nie doppelt neben Linien-Läufen). Sendet nichts.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXTRAKTOR_CACHE_CH: out/cache/ch
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache@v4
        with:
          path: out/cache/uk_psc_tag.txt
          key: uk-psc-${{ steps.d.outputs.tag }}
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/cache && echo "${{ steps.d.outputs.tag }}" > out/cache/uk_psc_tag.txt
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true'
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.an == 'true'
      - name: Eigentümerwechsel UK prüfen und speichern
        if: steps.gate.outputs.an == 'true'
        continue-on-error: true  # Merker bleibt gesetzt: kein zweiter Abruf am selben Tag
        run: python scripts/uk_psc_radar.py --apply | tee -a "$GITHUB_STEP_SUMMARY"

  fr-decp:
    # Premium-Radar FR (Quellen-Scout R50, scripts/lib/fr_decp_radar.py): öffentlicher Auftrag laut DECP
    # (data.gouv.fr Tabular-API, Zuschlag an PME ≤ 14 Tage) bei FR-S2-Firmen im Bestand + heute bestätigter
    # Website-Zustand bzw. „keine Website“ -> Premium-Leads. Höchstens einmal am Tag (Merker je Tag, vor dem Abruf
    # gesetzt), nur im Zeitplan-Lauf, kein Platz im Linienplan. Sendet nichts.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache@v4
        with:
          path: out/cache/fr_decp_tag.txt
          key: fr-decp-${{ steps.d.outputs.tag }}
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/cache && echo "${{ steps.d.outputs.tag }}" > out/cache/fr_decp_tag.txt
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml; then
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true'
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.an == 'true'
      - name: Öffentliche Aufträge FR prüfen und speichern
        if: steps.gate.outputs.an == 'true'
        continue-on-error: true  # Merker bleibt gesetzt: kein zweiter Abruf am selben Tag
        run: python scripts/fr_decp_radar.py --apply | tee -a "$GITHUB_STEP_SUMMARY"

  fr-bio:
    # Premium FR (Quellen-Scout R37, scripts/extraktor/sources/fr_bio.py): neue Bio-Betriebe laut Agence Bio
    # (Ersteintrag ≤ 30 Tage). Die Schnittstelle hat keinen Datumsfilter -> einmal am Tag alle Seiten, behalten werden
    # nur frische Einträge. Merker je Tag wird VOR dem Abruf gesichert: jede Seite höchstens 1×/Tag, auch wenn
    # mehrere Läufe gleichzeitig starten oder der Abruf scheitert. Die Teile (s2-ukfr) lesen nur den Zwischenspeicher.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - id: d
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache/restore@v4
        with:
          path: out/cache/fr_bio_tag.txt
          key: fr-bio-tag-${{ steps.d.outputs.tag }}
          lookup-only: true
      - uses: actions/checkout@v4
        if: steps.done.outputs.cache-hit != 'true'
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p out/cache && echo "${{ steps.d.outputs.tag }}" > out/cache/fr_bio_tag.txt
            echo "an=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Merker sichern (vor dem Abruf)
        if: steps.gate.outputs.an == 'true'
        uses: actions/cache/save@v4
        with:
          path: out/cache/fr_bio_tag.txt
          key: fr-bio-tag-${{ steps.d.outputs.tag }}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.an == 'true'
        with: { python-version: "3.11" }
      - run: pip install requests
        if: steps.gate.outputs.an == 'true'
      - name: Agence Bio laden (nur frische Einträge behalten)
        id: dl
        if: steps.gate.outputs.an == 'true'
        continue-on-error: true  # Merker bleibt gesetzt: kein zweiter Abruf am selben Tag
        env:
          PYTHONPATH: scripts
          EXTRAKTOR_BIO: out/cache/fr_bio.json
        run: |
          python -m extraktor.sources.fr_bio | tee -a "$GITHUB_STEP_SUMMARY"
          python -c "import json; print('neue Bio-Betriebe (≤ 30 Tage):', len(json.load(open('out/cache/fr_bio.json'))))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis sichern
        if: steps.dl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/cache/fr_bio.json
          key: fr-bio-data-${{ steps.d.outputs.tag }}

