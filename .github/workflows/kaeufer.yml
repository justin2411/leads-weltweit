# Käufer suchen und prüfen – parallel je Zielgruppe und Land (OpenStreetMap -> Website -> Prüfregeln).
# Sendet nie Mails.
name: kaeufer
on:
  # Drossel 06.10.2026: kein Zeitplan mehr (andere Branchen ruhen, S2-Käufer liefert das Kunden-Werk) – nur von Hand
  workflow_dispatch:
    inputs:
      max:
        description: "Höchstzahl gefundener Adressen je Zielgruppe/Land"
        default: "100"
concurrency: { group: werke, cancel-in-progress: false }   # Drossel 06.10.2026: ein schweres Werk zur Zeit
jobs:
  doppelt:
    # Prüfung 04.10.2026: fiel der geplante Lauf aus, startet ihn der Wachhund nach (workflow_dispatch); kommt der
    # verspätete Cron-Lauf danach doch noch, endet er hier sauber statt alles doppelt zu machen. Fehler -> normal laufen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - name: Heute schon nachgestartet?
        id: d
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SEIT: "05:13"   # geplante Zeit (UTC) wie im Cron oben
        run: |
          since="$(date -u +%Y-%m-%d)T${SEIT}:00Z"
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/kaeufer.yml/runs" \
                -f event=workflow_dispatch -f "created=>=$since" --jq .total_count 2>/dev/null || echo 0)
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Heute schon nachgestartet ($n Lauf seit $since) – geplanter Lauf endet ohne Arbeit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  suchen:
    needs: doppelt
    if: needs.doppelt.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1   # Drossel 06.10.2026
      matrix:
        combo: [S1-UK, S2-UK, S9-UK, S3-UK, S4-UK, S5-UK, S1-US, S2-US, S9-US, S3-US, S4-US, S5-US, S1-FR, S2-FR, S9-FR]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMBO: ${{ matrix.combo }}
      MAX: ${{ inputs.max || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Kandidaten aus OpenStreetMap
        # Prüfung 04.10.2026: ein hängender Overpass-Abruf hielt den Job 4 h fest; nach 45 min abbrechen und mit
        # dem weitermachen, was schon da ist (Folgeschritte prüfen nur vorhandene Kandidaten)
        timeout-minutes: 45
        continue-on-error: true
        run: python scripts/osm.py --segment "${COMBO%-*}" --country "${COMBO#*-}" --out-dir candidates/osm
      - name: Websites prüfen (Adresse, Rechtsform)
        run: |
          [ -f "candidates/osm/${COMBO}.csv" ] || { echo "Keine Kandidaten (OpenStreetMap abgebrochen)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          python scripts/prospects.py --max "$MAX" "candidates/osm/${COMBO}.csv"
      - name: Prüfregeln
        run: python scripts/outreach.py check --db

  arbeitgeber:
    needs: doppelt
    if: needs.doppelt.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1   # Drossel 06.10.2026
      matrix:
        area: ["UK|Greater Manchester", "UK|West Yorkshire", "UK|West Midlands", "UK|London", "UK|Bristol",
               "UK|Merseyside", "US|New York City", "US|Long Island", "FR|Lyon", "FR|Paris"]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "suche=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.suche == 'true'
      - name: Arbeitgeber mit Karriereseite finden (Lead-Inhalte, pausierbar)
        if: steps.gate.outputs.suche == 'true'
        run: python scripts/employers.py --country "${AREA%%|*}" --area "${AREA#*|}" --limit 300
