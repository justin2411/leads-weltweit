# Mails senden: nur manuell über "Run workflow". Der Start ist die Freigabe des Inhabers für diesen Lauf.
# Gesendet werden nur Entwürfe mit Status "approved", im Rahmen der Tageslimits aus countries.yaml.
name: mails-senden
on:
  workflow_dispatch:
    inputs:
      freigabe:
        description: "Freigabe (z. B. 'Justin, 26.09.2026, S1 UK + S2 US')"
        required: true
      probelauf:
        description: "Nur Probelauf (nichts senden)"
        type: boolean
        default: true
concurrency: { group: mails-senden, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_TRANSPORT: resend
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      UNSUBSCRIBE_MODE: reply
      FREIGABE: ${{ inputs.freigabe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Probelauf
        if: ${{ inputs.probelauf }}
        run: python scripts/outreach.py send
      - name: Senden
        if: ${{ !inputs.probelauf }}
        run: python scripts/outreach.py send --live --owner-ok "$FREIGABE"
