# Mails senden. Nur freigegebene Entwürfe (Status "approved"), mit Aufwärmphase, Notbremse und MX-Prüfung.
#  - manuell: "Run workflow" (Standard: Probelauf)
#  - automatisch (rund um die Uhr: jeden Tag stündlich, Plan app/lib/versandzeit.json) NUR, wenn in config/versand.yaml "aktiv: true" steht (vom Inhaber freigegeben)
#    ODER die Repository-Variable SENDEN_AKTIV = "ja" ist. Zum Stoppen: aktiv: false oder SENDEN_AKTIV = "nein".
name: mails-senden
on:
  workflow_dispatch:
    inputs:
      freigabe:
        description: "Freigabe (z. B. 'Justin, 26.09.2026, alle freigegebenen Entwürfe')"
        required: true
      probelauf:
        description: "Nur Probelauf (nichts senden)"
        type: boolean
        default: true
      gruppe:
        description: "auto = Anteil der Tagesmenge wie der stündliche Lauf, alle = ohne Anteil und Zeitgrenze"
        type: choice
        options: [auto, alle]
        default: auto
  # Versand rund um die Uhr (Inhaber 04.10.2026: „es sollen immer mails rausgehen nicht nur di-do. sondern jeden tag
  # um jede uhrzeit es soll die ganze zeit laufen“): jeden Tag stündlich zur Minute 37, alle Länder. Jeder Lauf sendet
  # nur seinen Anteil der Tagesmenge (Rest / verbleibende Läufe des Tages) und höchstens 45 min (versandzeit.json).
  schedule:
    - cron: "37 * * * *"      # stündlich, jeden Tag (:37 = auch deutscher Zeit)
concurrency: { group: mails-senden, cancel-in-progress: false }
jobs:
  send:
    if: ${{ vars.SENDEN_AKTIV != 'nein' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90    # Vorbereitung + höchstens 45 min Versand je stündlichem Lauf
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Kaltmails nur über ein eigenes Postfach (SMTP, z. B. Strato) – Resend verbietet Kaltakquise.
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_FROM: ${{ secrets.SMTP_FROM || secrets.MAIL_FROM }}
      # Postfächer lesen (Rückläufer für die Notbremse, wie antworten.yml; Prüfung 04.10.2026). Nur lesend.
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      # weiteres Postfach 2 (scripts/lib/mailboxes.py): leer = nicht benutzt
      SMTP_USER_2: ${{ secrets.SMTP_USER_2 }}
      SMTP_PASSWORD_2: ${{ secrets.SMTP_PASSWORD_2 }}
      SMTP_FROM_2: ${{ secrets.SMTP_FROM_2 }}
      # weiteres Postfach 3 (scripts/lib/mailboxes.py): leer = nicht benutzt
      SMTP_USER_3: ${{ secrets.SMTP_USER_3 }}
      SMTP_PASSWORD_3: ${{ secrets.SMTP_PASSWORD_3 }}
      SMTP_FROM_3: ${{ secrets.SMTP_FROM_3 }}
      # weiteres Postfach 4 (scripts/lib/mailboxes.py): leer = nicht benutzt
      SMTP_USER_4: ${{ secrets.SMTP_USER_4 }}
      SMTP_PASSWORD_4: ${{ secrets.SMTP_PASSWORD_4 }}
      SMTP_FROM_4: ${{ secrets.SMTP_FROM_4 }}
      # weiteres Postfach 5 (scripts/lib/mailboxes.py): leer = nicht benutzt
      SMTP_USER_5: ${{ secrets.SMTP_USER_5 }}
      SMTP_PASSWORD_5: ${{ secrets.SMTP_PASSWORD_5 }}
      SMTP_FROM_5: ${{ secrets.SMTP_FROM_5 }}
      REPLY_TO: ${{ secrets.SMTP_FROM || secrets.REPLY_TO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_COMPANY: ${{ secrets.SENDER_COMPANY }}
      SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
      SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      UNSUBSCRIBE_MODE: link   # Abmeldelink + List-Unsubscribe-Post (CLAUDE.md §2: Abmeldelink vom System)
      APP_BASE_URL: ${{ vars.SITE_URL || 'https://www.nextgen-profit.de' }}   # persönlicher Seitenlink in der Erstmail
      FREIGABE: ${{ inputs.freigabe || 'Dauerfreigabe des Inhabers laut config/versand.yaml' }}
      # Posteingangstest (Inhaber 04.10.2026): eigene Adressen des Inhabers, kommagetrennt; leer = kein Test
      SEED_INBOXES: ${{ secrets.SEED_INBOXES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Versand rund um die Uhr (Anteil der Tagesmenge je Lauf)
        id: zeit
        run: python scripts/lib/versandzeit.py --gruppe "${{ inputs.gruppe || 'auto' }}"
      - name: Versand freigegeben?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probelauf }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"   # Probelauf (sendet nichts) geht immer
          elif [ "${{ steps.zeit.outputs.ok }}" != "true" ]; then
            echo "Heute kein Versandtag (Plan) – nichts zu tun"; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || grep -Eq '^aktiv:\s*true' config/versand.yaml || [ "${{ vars.SENDEN_AKTIV }}" = "ja" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Versand nicht aktiv (config/versand.yaml)"; echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Zustellstatus holen (Notbremse braucht aktuelle Bounces)
        if: ${{ steps.gate.outputs.ok == 'true' }}
        run: python scripts/outreach.py sync --days 30
      - name: "Rückläufer aus allen Postfächern holen (Notbremse, Prüfung 04.10.2026)"
        if: ${{ steps.gate.outputs.ok == 'true' && env.IMAP_HOST != '' }}
        continue-on-error: true  # Postfach nicht lesbar: Versand prüft trotzdem mit dem Stand der Datenbank
        timeout-minutes: 10
        run: python scripts/inbox.py --days 14 --apply
      - name: Offene Entwürfe auf den aktuellen Text bringen
        if: ${{ steps.gate.outputs.ok == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.probelauf) }}
        run: python scripts/drafts.py --refresh
      - name: "Neue Entwürfe für die Fokus-Tests (Inhaber 03.10.2026, UK und FR sollen nicht leerlaufen)"
        if: ${{ steps.gate.outputs.ok == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.probelauf) }}
        continue-on-error: true  # ohne neue Entwürfe wird der vorhandene Vorrat trotzdem gesendet
        timeout-minutes: 30
        run: |
          APPROVE=$(grep -E '^freigabe:' config/versand.yaml | cut -d'"' -f2)
          python scripts/drafts.py --approve "$APPROVE" --max-new 300
      - name: "Rückläufer-Risiko zurückstellen (Syntax 5.1.3, Microsoft 365 5.4.1; Bounce-Analyse 05.10.2026)"
        if: ${{ steps.gate.outputs.ok == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.probelauf) }}
        continue-on-error: true  # der Versand prüft beides ohnehin je Mail noch einmal
        timeout-minutes: 15
        run: python scripts/zurueckstellen.py --apply --seit-stunden 3 --bestaetigen 20
      - name: Probelauf
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf }}
        run: python scripts/outreach.py send ${LAENDER:+--countries "$LAENDER"}
        env: { LAENDER: "${{ steps.zeit.outputs.laender }}" }
      - name: Senden
        if: ${{ steps.gate.outputs.ok == 'true' && ((github.event_name == 'workflow_dispatch' && !inputs.probelauf) || github.event_name == 'schedule') }}
        # Inhaber 03.10.2026: zeitversetzt, Postfächer abwechselnd, ~1 Mail pro Minute; 04.10.2026: rund um die Uhr,
        # je Lauf nur der Anteil der Tagesmenge, höchstens 45 min (Pausen verkürzen sich bei Bedarf, nie unter 20 s)
        run: python scripts/outreach.py send --live --owner-ok "$FREIGABE" --pause 60 ${LAENDER:+--countries "$LAENDER"} ${MINUTEN:+--minuten "$MINUTEN"} $( [ "$ANTEIL" = "true" ] && echo --anteil )
        env: { LAENDER: "${{ steps.zeit.outputs.laender }}", MINUTEN: "${{ steps.zeit.outputs.minuten }}", ANTEIL: "${{ steps.zeit.outputs.anteil }}" }
