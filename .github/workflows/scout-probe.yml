# Vorübergehend (Quellen-Scout R63): Erreichbarkeit der DILA-Rohdaten von GitHub aus – wird vor dem Merge entfernt.
name: scout-probe
on:
  push:
    branches: [claude/scout-bodacc-dila]
    paths: [".github/workflows/scout-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sS -o /dev/null -w "robots %{http_code}\n" --max-time 60 -A "NextGenProfitBot/0.1" https://echanges.dila.gouv.fr/robots.txt || echo "robots Fehler"
          curl -sS -o idx.html -w "index %{http_code} %{size_download}\n" --max-time 120 -A "NextGenProfitBot/0.1" https://echanges.dila.gouv.fr/OPENDATA/BODACC/FluxAnneeCourante/ || echo "index Fehler"
          grep -c 'RCS-B_BXB' idx.html || true
