# Morgenbericht an den Inhaber, täglich ca. 06:45 Uhr deutscher Zeit (04:47 UTC im Sommer).
name: morgenbericht
on:
  schedule: [{ cron: "47 4 * * *" }]
  workflow_dispatch:
concurrency: { group: takt, cancel-in-progress: false }   # Drossel 06.10.2026: leichte Zeitpläne nacheinander
jobs:
  doppelt:
    # Prüfung 04.10.2026: fiel der geplante Lauf aus, startet ihn der Wachhund nach (workflow_dispatch); kommt der
    # verspätete Cron-Lauf danach doch noch, endet er hier sauber statt alles doppelt zu machen. Fehler -> normal laufen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - name: Heute schon nachgestartet?
        id: d
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SEIT: "04:47"   # geplante Zeit (UTC) wie im Cron oben
        run: |
          since="$(date -u +%Y-%m-%d)T${SEIT}:00Z"
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/morgenbericht.yml/runs" \
                -f event=workflow_dispatch -f "created=>=$since" --jq .total_count 2>/dev/null || echo 0)
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Heute schon nachgestartet ($n Lauf seit $since) – geplanter Lauf endet ohne Arbeit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  bericht:
    needs: doppelt
    if: needs.doppelt.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python scripts/outreach.py sync --days 30
      - run: python scripts/report.py --send
