# Recherche mit Internetzugang (sendet nie Mails).
# Schritte: register-ny (Neugründungen New York), kaeufer (Websites der Kandidaten prüfen),
#           karriereseiten (beobachtete Karriereseiten), leads (Signale erkennen)
name: recherche
on:
  workflow_dispatch:
    inputs:
      schritt:
        description: "register-ny, register-fr, kaeufer, karriereseiten, leads (kombinierbar, z. B. kaeufer+karriereseiten) oder alles"
        required: true
        default: alles
      kandidaten:
        description: "CSV-Dateien für 'kaeufer' (Leerzeichen-getrennt)"
        default: "candidates/S2-US-NY.csv candidates/S1-UK-GM.csv candidates/S9-UK-GM.csv"
concurrency: { group: recherche, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SCHRITT: ${{ inputs.schritt }}
      KANDIDATEN: ${{ inputs.kandidaten }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Neugründungen New York
        if: ${{ contains(inputs.schritt, 'register-ny') || inputs.schritt == 'alles' }}
        run: python scripts/watch.py ny-incorporations --days 45 --limit 300
      - name: Neugründungen Frankreich (BODACC)
        if: ${{ contains(inputs.schritt, 'register-fr') || inputs.schritt == 'alles' }}
        run: python scripts/watch.py fr-incorporations --departement 69 --days 30 --limit 400
      - name: Käufer-Websites prüfen
        if: ${{ contains(inputs.schritt, 'kaeufer') || inputs.schritt == 'alles' }}
        run: |
          python scripts/prospects.py $(ls $KANDIDATEN 2>/dev/null)
          python scripts/outreach.py check --db
      - name: Arbeitgeber übernehmen und Karriereseiten prüfen
        if: ${{ contains(inputs.schritt, 'karriereseiten') || inputs.schritt == 'alles' }}
        run: |
          ls candidates/*-employers.csv >/dev/null 2>&1 && python scripts/watch.py import-employers candidates/*-employers.csv --country UK || true
          python scripts/watch.py careers
      - name: Signale erkennen
        if: ${{ contains(inputs.schritt, 'leads') || inputs.schritt == 'alles' || contains(inputs.schritt, 'register-ny') || contains(inputs.schritt, 'register-fr') || contains(inputs.schritt, 'karriereseiten') }}
        run: python scripts/watch.py detect
