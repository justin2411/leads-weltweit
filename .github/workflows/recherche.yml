# Recherche mit Internetzugang (sendet nie Mails).
# Schritte: register-ny (Neugründungen New York), kaeufer (Websites der Kandidaten prüfen),
#           karriereseiten (beobachtete Karriereseiten), leads (Signale erkennen)
name: recherche
on:
  workflow_dispatch:
    inputs:
      schritt:
        description: "osm, register-uk, proben, entwuerfe, register-ny, register-fr, kaeufer, karriereseiten, leads (kombinierbar, z. B. kaeufer+karriereseiten) oder alles"
        required: true
        default: alles
      freigabe:
        description: "Nur für 'entwuerfe': Freigabe des Inhabers (leer = nur Entwürfe, nichts freigeben)"
        default: ""
      kandidaten:
        description: "CSV-Dateien für 'kaeufer' (Leerzeichen-getrennt)"
        default: "candidates/S2-US-NY.csv candidates/S1-UK-GM.csv candidates/S9-UK-GM.csv"
concurrency: { group: recherche, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SCHRITT: ${{ inputs.schritt }}
      KANDIDATEN: ${{ inputs.kandidaten }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Neugründungen New York
        if: ${{ contains(inputs.schritt, 'register-ny') || inputs.schritt == 'alles' }}
        run: python scripts/watch.py ny-incorporations --days 45 --limit 300
      - name: Neugründungen UK (Companies House Monatsabzug)
        if: ${{ contains(inputs.schritt, 'register-uk') || inputs.schritt == 'alles' }}
        run: python scripts/watch.py uk-bulk --days 45 --limit 12000
      - name: Neugründungen Frankreich (BODACC)
        if: ${{ contains(inputs.schritt, 'register-fr') || inputs.schritt == 'alles' }}
        run: python scripts/watch.py fr-incorporations --departement 69,75,92,59 --days 30 --limit 400
      - name: Kandidaten aus OpenStreetMap
        if: ${{ contains(inputs.schritt, 'osm') }}
        run: |
          python scripts/osm.py --out-dir candidates/osm
          python scripts/prospects.py --max 100 candidates/osm/*.csv
          python scripts/outreach.py check --db
      - uses: actions/upload-artifact@v4
        if: ${{ contains(inputs.schritt, 'osm') }}
        with: { name: osm-kandidaten, path: candidates/osm/, retention-days: 30 }
      - name: Käufer-Websites prüfen
        if: ${{ contains(inputs.schritt, 'kaeufer') || inputs.schritt == 'alles' }}
        run: |
          python scripts/prospects.py $(ls $KANDIDATEN 2>/dev/null)
          python scripts/outreach.py check --db
      - name: Arbeitgeber übernehmen und Karriereseiten prüfen
        if: ${{ contains(inputs.schritt, 'karriereseiten') || inputs.schritt == 'alles' }}
        run: |
          ls candidates/*-employers.csv >/dev/null 2>&1 && python scripts/watch.py import-employers candidates/*-employers.csv --country UK || true
          python scripts/watch.py careers
      - name: Signale erkennen (vor Proben)
        if: ${{ contains(inputs.schritt, 'proben') || contains(inputs.schritt, 'entwuerfe') }}
        run: python scripts/watch.py detect
      - name: Probe-Leads auswählen und ins Repo schreiben
        if: ${{ contains(inputs.schritt, 'proben') || contains(inputs.schritt, 'entwuerfe') || inputs.schritt == 'alles' }}
        run: |
          python scripts/samples.py
          # Prüfung 04.10.2026: Proben nicht mehr ins öffentliche Repo committen (Lead-Kontaktdaten); Quelle ist die DB
      - name: Entwürfe schreiben
        if: ${{ contains(inputs.schritt, 'entwuerfe') || inputs.schritt == 'alles' }}
        env:
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_COMPANY: ${{ secrets.SENDER_COMPANY }}
          SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          FREIGABE: ${{ inputs.freigabe }}
        run: |
          if [ -n "$FREIGABE" ]; then python scripts/drafts.py --approve "$FREIGABE"; else python scripts/drafts.py; fi
      - name: Signale erkennen
        if: ${{ contains(inputs.schritt, 'leads') || inputs.schritt == 'alles' || contains(inputs.schritt, 'register-ny') || contains(inputs.schritt, 'register-fr') || contains(inputs.schritt, 'register-uk') || contains(inputs.schritt, 'karriereseiten') }}
        run: python scripts/watch.py detect
