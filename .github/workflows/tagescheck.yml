# Tagescheck (Inhaber 27.09.2026: „jeden Tag checken, ob alles funktioniert“): prüft alle Kontaktpunkte
# (Versand, Nachfassmails, Antworten, Web-Proben, Website, Kasse, Kunden) und die geplanten Läufe.
# Mail an OWNER_EMAIL mit dem Ergebnis; bei einem Problem wird der Lauf rot.
name: tagescheck
on:
  schedule: [{ cron: "37 17 * * *" }]   # täglich ca. 19:37 Uhr deutscher Zeit, nach Versand (14:23 UTC) und Automatiklauf
  workflow_dispatch:
    inputs:
      mail:
        description: "Ergebnis per Mail an den Inhaber"
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
jobs:
  doppelt:
    # Prüfung 04.10.2026: fiel der geplante Lauf aus, startet ihn der Wachhund nach (workflow_dispatch); kommt der
    # verspätete Cron-Lauf danach doch noch, endet er hier sauber statt alles doppelt zu machen. Fehler -> normal laufen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - name: Heute schon nachgestartet?
        id: d
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SEIT: "17:37"   # geplante Zeit (UTC) wie im Cron oben
        run: |
          since="$(date -u +%Y-%m-%d)T${SEIT}:00Z"
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/tagescheck.yml/runs" \
                -f event=workflow_dispatch -f "created=>=$since" --jq .total_count 2>/dev/null || echo 0)
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Heute schon nachgestartet ($n Lauf seit $since) – geplanter Lauf endet ohne Arbeit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: doppelt
    if: needs.doppelt.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.nextgen-profit.de' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Tagescheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mail }}" != "true" ]; then
            python scripts/tagescheck.py
          else
            python scripts/tagescheck.py --send
          fi
