# Extraktor (Inhaber 01.10.2026): Leads aus kostenlosen amtlichen Quellen (FMCSA, SEC Form D) holen, kostenlos
# anreichern (eigene Websites der Firmen, DNS/MX), Qualitätskontrolle + Signalkontrolle, Ergebnis als CSV-Artefakt.
# Nur von Hand. Schreibt nichts in die Datenbank (liest mit "datenbank=true" nur Sperrliste und vorhandene Leads).
# Sendet keine Mails. Kein Scraping von Plattformen; robots.txt, höchstens 1 Abruf/s je Domain.
name: extraktor
on:
  workflow_dispatch:
    inputs:
      branchen:
        description: "Branchen, z. B. S1,S2,S4,S5,S9"
        default: "S1,S2,S4,S5,S9"
      je_branche:
        description: "grüne Leads je Branche"
        default: "100"
      fmcsa_tage:
        description: "FMCSA-Neuzugänge der letzten N Tage"
        default: "30"
      formd_tage:
        description: "SEC-Form-D-Meldungen der letzten N Tage"
        default: "21"
      datenbank:
        description: "Sperrliste und vorhandene Leads prüfen (true/false)"
        default: "true"
concurrency: { group: werke, cancel-in-progress: false }   # Drossel 06.10.2026: ein schweres Werk zur Zeit
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Extraktor
        run: |
          DB=""; [ "${{ inputs.datenbank }}" = "true" ] && DB="--db"
          python scripts/extraktor/run.py --segments "${{ inputs.branchen }}" --per "${{ inputs.je_branche }}" \
            --fmcsa-days "${{ inputs.fmcsa_tage }}" --formd-days "${{ inputs.formd_tage }}" $DB --out out/extraktor
      - name: Zusammenfassung
        if: always()
        run: |
          [ -f out/extraktor/bericht.json ] && python -c "
          import json; r=json.load(open('out/extraktor/bericht.json'))
          print('| Branche | Vorrat | bearbeitet | grün | gelb | rot |'); print('|---|---|---|---|---|---|')
          for s,v in r['segments'].items(): print(f\"| {s} | {v['pool']} | {v['processed']} | {v.get('green',0)} | {v.get('yellow',0)} | {v.get('red',0)} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraktor-bericht
          path: out/extraktor/bericht.json   # keine Lead-Dateien: das Repo ist öffentlich
          retention-days: 14
