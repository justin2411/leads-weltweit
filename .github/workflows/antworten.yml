# Antwort-Assistent: rund um die Uhr alle 10 Minuten Antworten lesen, Proben/FAQ automatisch beantworten, Inhaber bei
# Kaufinteresse/Fragen sofort benachrichtigen (Mail + Push, Deep-Link ins Antworten-Cockpit). Nachtschicht 03.10.2026:
# US-Antworten kommen in unserer Nacht, vorher bis zu 9 h Verzögerung. Öffentliches Repo: Actions-Minuten kostenlos.
# Läuft nur, wenn IMAP_HOST gesetzt ist (eigenes Postfach für Antworten). Pause im Dashboard (werke_paused.antworten)
# schaltet nur die automatischen Antworten ab; Abmeldungen werden immer gesperrt.
name: antworten
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
    inputs:
      probelauf:
        type: boolean
        default: true
# Läufe überlappen nie: ein neuer wartet, bis der laufende fertig ist (kein doppeltes Antworten)
concurrency: { group: antworten, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write   # Wachhund anstoßen (Prüfung 04.10.2026)
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.nextgen-profit.de' }}   # Deep-Link ins Cockpit, Push über /api/push
      # Chromium fürs Proben-PDF erst installieren, wenn wirklich eine Probe gebaut wird (responder.ensure_chromium)
      PLAYWRIGHT_LAZY_INSTALL: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      KAUFINTERESSE_AN: ${{ secrets.KAUFINTERESSE_AN }}   # leer = Adresse aus config/versand.yaml bzw. OWNER_EMAIL
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_COMPANY: ${{ secrets.SENDER_COMPANY }}
      SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
      SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      # Alle Versand-Postfächer mitlesen (Nachtschicht 04.10.2026, lib/imap_boxes.py): Rückläufer und manche Antworten
      # gehen an das sendende Postfach, nicht an REPLY_TO. Nur lesend; gesendet wird hier nie per SMTP (Antworten über
      # Resend). Leere Werte = Postfach nicht vorhanden.
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER_2: ${{ secrets.SMTP_USER_2 }}
      SMTP_PASSWORD_2: ${{ secrets.SMTP_PASSWORD_2 }}
      SMTP_FROM_2: ${{ secrets.SMTP_FROM_2 }}
      SMTP_USER_3: ${{ secrets.SMTP_USER_3 }}
      SMTP_PASSWORD_3: ${{ secrets.SMTP_PASSWORD_3 }}
      SMTP_FROM_3: ${{ secrets.SMTP_FROM_3 }}
      SMTP_USER_4: ${{ secrets.SMTP_USER_4 }}
      SMTP_PASSWORD_4: ${{ secrets.SMTP_PASSWORD_4 }}
      SMTP_FROM_4: ${{ secrets.SMTP_FROM_4 }}
      SMTP_USER_5: ${{ secrets.SMTP_USER_5 }}
      SMTP_PASSWORD_5: ${{ secrets.SMTP_PASSWORD_5 }}
      SMTP_FROM_5: ${{ secrets.SMTP_FROM_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Postfach eingerichtet?
        id: gate
        run: if [ -n "$IMAP_HOST" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "IMAP noch nicht eingerichtet"; fi
      - name: Bounces aus allen Postfächern
        if: ${{ steps.gate.outputs.ok == 'true' }}
        run: python scripts/inbox.py --days 14 --apply
      - name: Antworten bearbeiten
        # läuft auch, wenn die Bounce-Auswertung scheitert (27.09.: doppelte Bounce-Meldung blockierte alles)
        if: ${{ !cancelled() && steps.gate.outputs.ok == 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probelauf }}" = "true" ]; then
            python scripts/responder.py
          else
            python scripts/responder.py --apply
          fi
      - name: Kunden-Agenten – Kundenmails zuordnen, Nachfragen nach Lieferungen
        # docs/KUNDEN-AGENTEN.md: Mails zahlender Kunden (ab Pro) landen beim Kunden-Agenten (Verlauf + Auftrag für die
        # Agenten-Routine); Preis/Vertrag/Kündigung/Beschwerde meldet er dem Inhaber. Check-in nach der 2./4. Lieferung,
        # höchstens 1 eigene Mail pro Woche. Nur an Kunden (Einwilligung, Resend), nie Kaltmails.
        if: ${{ !cancelled() && steps.gate.outputs.ok == 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probelauf }}" = "true" ]; then
            python scripts/customer_agents.py inbox --dry-run
            python scripts/customer_agents.py checkin --dry-run
          else
            python scripts/customer_agents.py inbox
            python scripts/customer_agents.py checkin
          fi
      - name: Probe-Anfragen von Landingpages beantworten
        if: ${{ !cancelled() }}
        # unabhängig vom Postfach: Anfragen kommen über die Website (Einwilligung -> Resend erlaubt)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probelauf }}" = "true" ]; then
            python scripts/web_samples.py
          else
            python scripts/web_samples.py --apply
          fi
      - name: Wachhund anstoßen, wenn GitHub ihn nicht startet
        # Nachtschicht 04.10.2026: GitHub ließ die geplanten Läufe (Wachhund, Antwort-Assistent) nachts stundenlang
        # aus. Der Antwort-Assistent läuft alle 10 min und stößt den Wachhund an, wenn der seit
        # 30 min nicht lief (Prüfung 04.10.2026). Nie Versand – den startet der Wachhund nur in seinen Grenzen.
        # Prüfung 04.10.2026: GitHub-Aufrufe bis zu 3 Versuche (eine 503 ließ den Schritt sonst scheitern).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep 20; done; return 1; }
          last=$(retry gh run list --workflow wachhund.yml --limit 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -n "$last" ]; then
            mins=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          else
            mins=999
          fi
          if [ "$mins" -ge 30 ]; then
            if retry gh workflow run wachhund.yml --ref "${{ github.ref_name }}"; then
              echo "Wachhund angestoßen (letzter Lauf vor $mins min)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Wachhund nicht anstoßbar (GitHub antwortet nicht)"
            fi
          else
            echo "Wachhund lief vor $mins min – nichts zu tun"
          fi
