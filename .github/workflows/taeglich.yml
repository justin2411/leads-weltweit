# Täglicher Automatiklauf (werktags 12:17 UTC, vor dem Versand um 14:23 UTC). Sendet selbst keine Mails.
# Nachfassmails -> Quellen aktualisieren -> Signale erkennen -> Website-Prüfung -> Proben -> neue Entwürfe (freigegeben).
name: taeglich
on:
  schedule: [{ cron: "17 12 * * *" }]
  workflow_dispatch:
    inputs:
      uk_bulk:
        # Prüfung 04.10.2026: Nachstarts des Wachhunds liefen sonst immer den Companies-House-Import (~112 min)
        description: "Neugründungen UK (Companies House) auch außerhalb des Montags importieren"
        type: boolean
        default: false
concurrency: { group: recherche, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  doppelt:
    # Prüfung 04.10.2026: fiel der geplante Lauf aus, startet ihn der Wachhund nach (workflow_dispatch); kommt der
    # verspätete Cron-Lauf danach doch noch, endet er hier sauber statt alles doppelt zu machen. Fehler -> normal laufen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - name: Heute schon nachgestartet?
        id: d
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SEIT: "12:17"   # geplante Zeit (UTC) wie im Cron oben
        run: |
          since="$(date -u +%Y-%m-%d)T${SEIT}:00Z"
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/taeglich.yml/runs" \
                -f event=workflow_dispatch -f "created=>=$since" --jq .total_count 2>/dev/null || echo 0)
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Heute schon nachgestartet ($n Lauf seit $since) – geplanter Lauf endet ohne Arbeit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  run:
    needs: doppelt
    if: needs.doppelt.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_COMPANY: ${{ secrets.SENDER_COMPANY }}
      SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
      SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Schalter Lead-Suche (config/pipeline.yaml)
        id: gate
        run: |
          if grep -Eq '^lead_suche:\s*true' config/pipeline.yaml; then
            echo "suche=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lead-Suche pausiert (config/pipeline.yaml: lead_suche: false)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Nachfassmails
        # Prüfung 04.10.2026: vor den Quellen (hängt nicht von ihnen ab), damit ein langer Quellen-Schritt sie nie
        # aus dem Zeitlimit drängt. Die Entwürfe bleiben hinter „Proben aktualisieren“ (brauchen 10 Probe-Leads).
        run: python scripts/followups.py --apply
      - name: Quellen
        if: ${{ !cancelled() && steps.gate.outputs.suche == 'true' }}
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python scripts/watch.py careers
          python scripts/watch.py ny-incorporations --days 10 --limit 2000
          python scripts/watch.py fr-incorporations --departement 69,75,92,59 --days 10 --limit 200
      - name: Neugründungen UK (Companies House, montags)
        if: ${{ !cancelled() && steps.gate.outputs.suche == 'true' }}
        # Prüfung 04.10.2026: höchstens 40 min, außerhalb des Montags nur mit Eingabe uk_bulk (nicht bei jedem Nachstart)
        timeout-minutes: 40
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ "${{ inputs.uk_bulk }}" = "true" ]; then
            python scripts/watch.py uk-bulk --days 45 --limit 12000
          fi
      - name: Signale und Website-Prüfung
        if: ${{ !cancelled() && steps.gate.outputs.suche == 'true' }}
        # darf Nachfassmails und Entwürfe nie blockieren (27.09.: Zeitlimit des ganzen Laufs überschritten)
        timeout-minutes: 60
        continue-on-error: true
        run: |
          python scripts/watch.py detect
          python scripts/watch.py sitecheck --limit 150
          python scripts/watch.py people --limit 600
          # Website finden/prüfen, Kontakte, Qualität: scripts/enrich.py (auch eigener Workflow anreichern.yml)
          python scripts/enrich.py run --limit 300
      - name: Proben aktualisieren
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python scripts/samples.py
          # Prüfung 04.10.2026: Proben nicht mehr ins öffentliche Repo committen (Lead-Kontaktdaten); Quelle ist die DB
      - name: Neue Entwürfe (Freigabe laut config/versand.yaml)
        if: ${{ !cancelled() }}
        run: |
          FREIGABE=$(grep -E '^freigabe:' config/versand.yaml | cut -d'"' -f2)
          python scripts/drafts.py --approve "$FREIGABE"
