# Testmail an den Inhaber: zeigt, wie eine echte Mail ankommt (Betreff mit [TEST]). Geht nie an Käufer.
name: testmail
on:
  workflow_dispatch:
    inputs:
      an:
        description: "Empfänger (deine eigene Adresse)"
        required: true
      segment:
        description: "S1, S2 oder S9"
        default: S1
      land:
        description: "UK, US oder FR"
        default: UK
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_TRANSPORT: resend
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      UNSUBSCRIBE_MODE: reply
      AN: ${{ inputs.an }}
      SEGMENT: ${{ inputs.segment }}
      LAND: ${{ inputs.land }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python scripts/outreach.py test --to "$AN" --segment "$SEGMENT" --country "$LAND"
