# Testmail an den Inhaber: zeigt, wie eine echte Mail ankommt (Betreff mit [TEST]). Geht nie an Käufer.
name: testmail
on:
  workflow_dispatch:
    inputs:
      an:
        description: "Empfänger (deine eigene Adresse)"
        required: true
      segment:
        description: "S1, S2 oder S9"
        default: S1
      land:
        description: "UK, US oder FR"
        default: UK
      art:
        description: "kaltmail, probe, nachfass, probe-nachfass, willkommen oder lieferung"
        default: kaltmail
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_TRANSPORT: resend
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      UNSUBSCRIBE_MODE: reply
      AN: ${{ inputs.an }}
      SEGMENT: ${{ inputs.segment }}
      LAND: ${{ inputs.land }}
      ART: ${{ inputs.art }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.art != 'willkommen'
        with: { python-version: "3.11" }
      - if: inputs.art != 'willkommen'
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - if: inputs.art != 'willkommen' && inputs.art != 'lieferung'
        run: python scripts/outreach.py test --to "$AN" --segment "$SEGMENT" --country "$LAND" --art "${ART:-kaltmail}"
      # Montagslieferung (PDF + Tabelle) mit echten Leads, ändert nichts in der Datenbank
      - if: inputs.art == 'lieferung'
        run: python scripts/deliveries.py test-mail --to "$AN" --segment "$SEGMENT" --country "$LAND"
      # Willkommensmail nach dem Kauf (app/lib/welcome-mail.ts)
      - if: inputs.art == 'willkommen'
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: inputs.art == 'willkommen'
        working-directory: app
        run: npx --yes tsx scripts/testmail-welcome.ts "$AN" "$LAND"
