# KPI-Tageswerte (JARVIS-Plan W1-1): täglich 23:20 deutscher Zeit je Land × Kennzahl nach signalwerk.kpi_daily
# (scripts/kpi_snapshot.py, Upsert, wiederholbar). Zwei Crons für Sommer- und Winterzeit. Tagesabschluss (Zeitplan
# oder Wachhund mit abschluss=true): 23:xx deutscher Zeit = heute, verspätet bis 05:59 = gestern, falls noch offen
# (05.10.2026: GitHub startete die Läufe erst 02:12/03:18, der 04.10. blieb ohne Abschluss). Von Hand ohne abschluss
# sofort für heute. Liest Rohdaten, schreibt nur kpi_daily, sendet nichts, löscht nichts. Kosten 0.
name: kpi-tag
on:
  schedule:
    - cron: "20 21 * * *"   # 23:20 MESZ (Sommerzeit)
    - cron: "20 22 * * *"   # 23:20 MEZ (Winterzeit)
  workflow_dispatch:
    inputs:
      abschluss:
        description: "Tagesabschluss wie der Zeitplan (Wachhund)"
        type: boolean
        default: false
concurrency: { group: kpi-tag, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pyyaml
      - name: KPI-Tageswerte speichern
        run: python scripts/kpi_snapshot.py ${{ (github.event_name == 'schedule' || inputs.abschluss) && '--nur-abends' || '' }}
      - name: Lernschleife nachmessen (brain_learn.py, frische KPI-Werte)
        continue-on-error: true
        run: python scripts/brain_learn.py pruefen --apply
      - name: Gehirn-Score speichern (brain_meta.py, kpi_daily Land ALL)
        run: python scripts/brain_meta.py score --apply ${{ (github.event_name == 'schedule' || inputs.abschluss) && '--nur-abends' || '' }}
