# Wachhund: GitHub lässt geplante Läufe unter Last ausfallen (27./28.09.2026). Prüft, ob ein Pflichtlauf überfällig
# ist (scripts/wachhund.py). Actions-Drossel (Inhaber 06.10.2026: „fahr github actions erstmal runter“): stündlich statt
# alle 15 min, startet nichts mehr nach (nur Anzeige); Startwünsche des Inhabers aus dem Dashboard nur, solange im
# Repo weniger als 5 Läufe aktiv sind. Die Datenbank-Schritte (Lernschleife, Übergaben, A/B …) laufen weiter.
name: wachhund
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
concurrency: { group: takt, cancel-in-progress: false }   # Drossel 06.10.2026: leichte Zeitpläne nacheinander
permissions:
  actions: write   # nur für Startwünsche des Inhabers (start_requests)
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pyyaml
      - run: python scripts/wachhund.py --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # nur lesend: Schalter des Inhabers (owner_settings), damit pausierte Werke nicht nachgestartet werden
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}  # Gehirn-Weckruf: Inhaber-Verkehr nicht als Ereignis zählen
      # Website-Agenten (Inhaber 04.10.2026): fällige bekommen einen Auftrag (agent_tasks, kind website) für die
      # JARVIS-Routine; Fehler hier dürfen den Wachhund nie stoppen
      - run: python scripts/website_agents.py faellig --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Lernschleife des Gehirns (docs/GEHIRN-AUFBAU.md 2–4): fällige Entscheidungen mit Erwartung nachmessen
      # (bestaetigt/widerlegt/unklar -> Vertrauen im Wissensspeicher), montags ab 05:00 deutscher Zeit die Rückschau
      # (archivieren statt löschen, Widersprüche, Top-3-Lehren), täglich einmal die Prüffälle (brain_evals).
      # Gehirn pausiert (settings.brain_enabled = false) -> nur anzeigen. Sendet nichts; Fehler stoppen den Wachhund nie
      - run: python scripts/brain_learn.py pruefen --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python scripts/brain_learn.py rueckschau --apply --nur-montag
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python scripts/brain_eval.py regeln --apply --einmal-taeglich
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Gehirn-Routinen (Inhaber 04.10.2026: „jeden tag um 14 uhr sollst du 15min recherchieren …“): fällige bekommen
      # einen Auftrag (agent_tasks, kind gehirn) für die JARVIS-Runde, Ergebnisse landen kurz in brain_routines;
      # Fehler hier dürfen den Wachhund nie stoppen
      - run: python scripts/brain_routines.py faellig --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Firma (Inhaber 04.10.2026): feste Übergaben zwischen den Bereichen (Qualität → Produktion, Vertrieb → Marketing,
      # Kaufinteresse → Kundenservice + Push, Vorrat leer → Strategie, Spam → Qualität) als agent_tasks, je Schlüssel
      # nur einmal (signalwerk.handoffs); token-frei, sendet keine Mails. Fehler stoppen den Wachhund nie
      - run: python scripts/uebergaben.py pruefen --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.nextgen-profit.de' }}   # Push über /api/push
      # Abteilungs-Motor (Inhaber 04.10.2026: „JARVIS baut sich selbst“): je Abteilung Ziel vs. Ist -> Lücke; für die
      # 2–3 größten Lücken (umsatznah zuerst) je höchstens 1 offener Auftrag, max. 6 offen, nur S2 × US/UK/FR, eigener
      # Takt alle 2 h; brain_enabled = false -> nur rechnen. Sendet nichts; Fehler stoppen den Wachhund nie
      - run: python scripts/abteilungen_motor.py lauf --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # A/B je Schritt (Inhaber 04.10.2026): laufende Tests auswerten – Gewinner (≥ 95 % und Mindestmenge) übernehmen,
      # nach 21 Tagen ohne Entscheidung stoppen; Meldung in decisions und im Gehirn-Chat. Fehler stoppen den Wachhund nie
      - run: python scripts/ab.py auswerten --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Engpass-Protokoll (JARVIS-Plan W1-2): höchstens 1×/h ein Eintrag „Engpass: <Station>“ in decisions; hält
      # dieselbe Station ≥ 6 der letzten 8 Einträge und ≥ 24 h ohne laufenden Test, genau ein Agenten-Auftrag
      # „Test vorschlagen und anlegen“ (nur Webagenturen US/UK/FR). Sendet nichts; Fehler stoppen den Wachhund nie
      - run: python scripts/ab.py engpass-log
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Datenfluss steht still (JARVIS-Plan C3): Station der Kette (Leads, Käufer, Proben, Mails, Antworten) länger als
      # 3× ihr übliches Intervall ohne Zuwachs -> Vorschlag in JARVIS + Gehirn-Chat, höchstens 1× je 6 h je Station.
      # Lernschleife (C4): fertige Aufträge leads/kaeufer/quelle nach 72 h vorher/nachher (kpi_daily) bewerten
      # -> agent_tasks.wirkung + Wissensnotiz, höchstens 1×/h. Senden nichts; Fehler stoppen den Wachhund nie
      - run: python scripts/datenfluss.py stillstand --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python scripts/datenfluss.py wirkung --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Selbstoptimierung (Inhaber 04.10.2026: „bekommen wir es hin das sich das system … selbst optimiert“):
      # Versand-Tagesmenge (nur senken / bis zum Ziel), Dauerprüfung, Käufer-Kategorien und nächster A/B-Entwurf
      # nach gemessener Wirkung; jede Änderung nach N Tagen bewertet, ohne Wirkung zurück; alles in decisions.
      # Nie Prüfregeln, Sperrliste, Notbremse, Länder, Kosten, Preise. Fehler stoppen den Wachhund nie
      - run: python scripts/selbstopt.py lauf --apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
