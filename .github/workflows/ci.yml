name: ci
on:
  pull_request:
  push:
    branches: [main]
# Drossel 06.10.2026: je Branch/PR höchstens ein CI-Lauf zur Zeit
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: false }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/lint_templates.py
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls; create schema extensions;"
      - name: Migrationen zweimal anwenden (idempotent)
        run: for i in 1 2; do for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done; done
      - name: SQL-Tests (Proben-Vorrat)
        run: for f in supabase/tests/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { SUPABASE_URL: "https://example.supabase.co", SUPABASE_SERVICE_ROLE_KEY: "build-only" }
      # Layout-Wächter (Inhaber 04.10.2026: bündig, X mittig, kein Querscrollen, Fluss-Karte ohne Überlappung):
      # Dashboard mit erfundenen Testdaten (tests/layout/fixtures.mjs), keine Datenbank, keine Geheimnisse
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: npm run layout
