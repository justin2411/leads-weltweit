# Das Gehirn (BRAIN.md Abschnitt 3). Vorerst NUR manuell – die tägliche Planung (06:30 Uhr) wird laut BRAIN.md 8.8
# erst nach dem Ende-zu-Ende-Test im Stripe-Testmodus eingeschaltet (dann die schedule-Zeile aktivieren).
name: gehirn
on:
  # schedule: [{ cron: "23 4 * * *" }]   # ca. 06:30 Uhr deutscher Sommerzeit – erst nach dem Test aktivieren
  workflow_dispatch:
    inputs:
      anwenden:
        description: "Entscheidungen schreiben (sonst nur Probelauf)"
        type: boolean
        default: false
concurrency: { group: werke, cancel-in-progress: false }   # Drossel 06.10.2026: ein schweres Werk zur Zeit
jobs:
  schleife:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_COMPANY: ${{ secrets.SENDER_COMPANY }}
      SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
      SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python scripts/brain.py ${{ inputs.anwenden && '--apply' || '' }}
