# Aufräumen (Inhaber 05.10.2026: „Achte aber auch auf unsere Ressourcen wie Speicherknappheit über Supabase und lösche
# auch Daten, die wir nicht brauchen“): täglich nach festen Regeln (scripts/aufraeumen.py, Funktion
# signalwerk.aufraeumen): erst Trockenlauf mit Zählung je Kategorie, dann in Häppchen löschen. Nur alter Rohbestand,
# alte Laufzahlen/Herzschläge/Protokolle und verworfene Proben – nie Leads, Sperrliste, Nachrichten, Käufer, Kunden.
name: aufraeumen
on:
  schedule: [{ cron: "53 2 * * *" }]   # 04:53 MESZ
  workflow_dispatch:
    inputs:
      trocken:
        description: "nur Trockenlauf (nichts löschen)"
        type: boolean
        default: false
concurrency: { group: takt, cancel-in-progress: false }   # Drossel 06.10.2026: leichte Zeitpläne nacheinander
permissions:
  contents: read
jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Trockenlauf
        run: python scripts/aufraeumen.py
      - name: Löschen in Häppchen
        if: ${{ github.event_name == 'schedule' || !inputs.trocken }}
        run: python scripts/aufraeumen.py --apply
